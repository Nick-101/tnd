<title>욜로드워프 데모 3.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1f232b; --panel2: #272c36; --line: #363d4a; --text: #e8eaf0; --dim: #98a0b0;
  --gold: #ffd257; --good: #6fd08c; --bad: #ff6b62; --fever: #ff9a3c; --ice: #7fd4ff; --mult: #ff9f7a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
button, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: #6b7690; background: #303746; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: #2f6fdd; border-color: #4a86ee; font-weight: 700; }
button.primary:hover:not(:disabled) { background: #3c7cec; }
small, .dim { color: var(--dim); }
h2, h3 { margin: 0 0 6px; }
h3 small, h2 small { font-weight: 400; font-size: 12px; }
p { margin: 4px 0; }
.good { color: var(--good); } .bad { color: var(--bad); } .num { color: var(--gold); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px; white-space: nowrap; margin: 0 2px; background: color-mix(in srgb, var(--c) 28%, #1b1e25); border: 1px solid var(--c); }
.kind { white-space: nowrap; color: color-mix(in srgb, var(--c) 75%, #fff); font-weight: 700; }
.cfee { color: var(--gold); } .cmult { color: var(--mult); } .cstack { color: #9fe0b0; } .csat { color: #ff9fbd; } .now { color: var(--dim); }
.mark { font-weight: 700; margin-right: 3px; font-size: 12px; }
.mark.like, .s.like { color: #ff7fa5; } .mark.hate, .s.hate { color: #9fb0c8; } .s.rest { color: #9fc8ff; }
.trait { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: #5a4a1c; border: 1px solid var(--gold); color: var(--gold); margin-left: 4px; white-space: nowrap; }
.stars { color: var(--gold); margin-left: 2px; letter-spacing: -1px; }

#app { display: flex; flex-direction: column; height: 100%; min-height: 790px; overflow-x: auto; }
#top, main { min-width: 1240px; }
#top { display: flex; align-items: center; gap: 12px; padding: 7px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
#top .brand { font-weight: 800; font-size: 16px; }
#top .stat { display: flex; align-items: baseline; gap: 5px; padding: 2px 11px; border-left: 1px solid var(--line); position: relative; white-space: nowrap; }
#top .stat label { color: var(--dim); font-size: 12px; }
#top .stat b { font-size: 19px; font-variant-numeric: tabular-nums; }
#top .stat b.sw { font-size: 15px; }
#top .money b { color: var(--gold); } #top .money b.tg { color: var(--text); font-size: 16px; }
#top .money.hit #money { color: var(--good); }
#top .money .bar { position: absolute; left: 11px; right: 11px; bottom: -4px; height: 3px; background: #333a47; border-radius: 2px; overflow: hidden; }
#top .money .bar i { display: block; height: 100%; background: var(--gold); transition: width .2s; }
#top .money.hit .bar i { background: var(--good); }
#top .grow { flex: 1; }
#top .flag { color: #ffb36b; font-size: 12px; border: 1px dashed #ffb36b; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
#top .seed { color: var(--dim); font-size: 12px; white-space: nowrap; } #top .seed b { color: var(--text); font-family: ui-monospace, monospace; user-select: all; }

main { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 10px; min-height: 0; }
#upper { display: flex; gap: 10px; flex: none; height: 440px; }
#side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 330px; min-height: 0; }

/* ── 보드: 둥근 네모 트랙 ── */
#board { position: relative; flex: none; width: 770px; height: 440px; display: grid; gap: 5px; padding: 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 26px; transition: box-shadow .4s, border-color .4s; }
#board.fever { border-color: var(--fever); box-shadow: 0 0 0 1px var(--fever), 0 0 26px rgba(255, 154, 60, .35); }
#board.fever.f2 { box-shadow: 0 0 0 2px var(--fever), 0 0 40px rgba(255, 154, 60, .5); }
#board.fever.f3, #board.fever.f4 { box-shadow: 0 0 0 3px #ff6a2a, 0 0 60px rgba(255, 106, 42, .7); }
#board.burst { animation: burst .7s; }
@keyframes burst { 0% { transform: scale(1); } 25% { transform: scale(1.015); filter: brightness(1.5); } 100% { transform: scale(1); } }
.tile { position: relative; min-width: 0; min-height: 0; border-radius: 7px; padding: 8px 6px 4px; background: var(--panel2); border: 2px solid var(--line); overflow: hidden; user-select: none; }
.tile.corner-tl { border-top-left-radius: 20px; } .tile.corner-tr { border-top-right-radius: 20px; } .tile.corner-br { border-bottom-right-radius: 20px; } .tile.corner-bl { border-bottom-left-radius: 20px; }
.tile[draggable="true"] { cursor: grab; }
.tile.empty { background: transparent; border-style: dashed; }
.tile.support { background: #2a2d33; border-color: #4a4f59; color: #c9ccd3; }
.tile .kbar { position: absolute; left: 0; top: 0; right: 0; height: 5px; display: flex; }
.tile .kbar i { flex: 1; background: #70757f; }
.tile .tno { position: absolute; right: 5px; bottom: 1px; font-size: 10px; color: #6f788a; }
.tile[data-tile="0"] .tno { color: var(--gold); font-weight: 700; }
.tile[data-tile="0"] { box-shadow: inset 4px 0 0 var(--gold); }
.tile .arrow { position: absolute; left: 4px; bottom: 0; font-size: 11px; color: #6f788a; }
.tile .taste { position: absolute; right: 4px; top: 6px; font-weight: 800; font-size: 15px; z-index: 1; }
.tile.like .taste { color: #ff7fa5; } .tile.dislike .taste { color: #c3d0e6; }
.tile.like { background: color-mix(in srgb, #ff7fa5 15%, var(--panel2)); }
.tile.dislike { background: repeating-linear-gradient(135deg, var(--panel2), var(--panel2) 9px, #20242d 9px, #20242d 12px); }
.tname { font-weight: 700; font-size: 13px; white-space: nowrap; display: flex; align-items: baseline; padding-right: 12px; }
.tname .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tname .stars, .tname .mk, .tname .boost { flex: none; }
.tkind { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.mk { font-style: normal; font-size: 11px; margin-left: 2px; }
.boost { color: var(--ice); font-style: normal; font-weight: 700; font-size: 11px; margin-left: 3px; }
.tile.top { border-color: #8b7630; }
.tstats { display: flex; gap: 6px; align-items: baseline; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tstats .fee { font-weight: 800; font-size: 17px; color: var(--text); } .tstats .fee.buffed { color: var(--gold); }
.tstats .mult { color: var(--mult); font-weight: 800; font-size: 14px; } .tstats .again { color: var(--ice); font-weight: 700; }
.ttext { font-size: 11px; line-height: 1.3; color: #a9aeb9; margin-top: 2px; }
/* 칸 수에 따라 줄인다 */
#board.n16 .tkind, #board.n20 .tkind, #board.n24 .tkind { display: none; }
#board.n16 .ttext { font-size: 10px; line-height: 1.25; }
#board.n20 .ttext, #board.n24 .ttext { font-size: 9.5px; line-height: 1.2; margin-top: 0; }
#board.n20 .tname, #board.n24 .tname { font-size: 11.5px; }
#board.n24 .tile { padding: 7px 4px 2px; } #board.n24 .tname { font-size: 11px; letter-spacing: -.5px; }
#board.n20 .tstats .fee, #board.n24 .tstats .fee { font-size: 15px; } #board.n24 .tstats { gap: 4px; } #board.n24 .tstats .mult { font-size: 12px; }
#board.n8 .tname { font-size: 16px; } #board.n8 .tkind, #board.n8 .ttext { font-size: 13px; } #board.n8 .tstats .fee { font-size: 24px; } #board.n8 .tstats .mult { font-size: 18px; } #board.n8 .tile { padding: 14px 12px; }
#board.n12 .tname { font-size: 14px; } #board.n12 .tile { padding: 10px 8px; } #board.n12 .tstats .fee { font-size: 20px; }
.tile.hl-self { border-color: #fff; }
.tile.hl-target { border-color: var(--good); box-shadow: 0 0 0 2px rgba(111, 208, 140, .45); }
.tile.hl-target.hl-prev::after { content: "↩ 이전 칸"; position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 11px; font-weight: 700; color: var(--good); }
.tile.hl-source { border-color: var(--ice); box-shadow: 0 0 0 2px rgba(127, 212, 255, .45); }
.tile.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 87, .5); }
.tile.droppable { border-color: #6b7690; cursor: pointer; background: rgba(107, 118, 144, .12); }
.tile.over { border-color: var(--gold); background: #3a3a2c; }
.tile.reading { border-color: #fff3b0; box-shadow: 0 0 14px rgba(255, 243, 176, .6); filter: brightness(1.25); }
.tile.paid { animation: paid .45s; } .tile.paid-big { animation: paidbig .6s; }
@keyframes paid { 0% { filter: brightness(1.9); transform: scale(1.04); } 100% { filter: none; transform: none; } }
@keyframes paidbig { 0% { filter: brightness(2.4); transform: scale(1.1) rotate(-1deg); } 30% { transform: scale(1.06) rotate(1deg); } 100% { filter: none; transform: none; } }
.tile.refused { animation: refused .45s; }
@keyframes refused { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); background: #5a2b2b; } 60% { transform: translateX(5px); } }
.tile.grew { animation: grew .9s; }
.tile.grew .tstats span, .tile.grew .now { display: inline-block; animation: grewnum .9s; }
@keyframes grew { 0% { box-shadow: 0 0 0 3px var(--good); } 100% { box-shadow: none; } }
@keyframes grewnum { 0% { transform: scale(1.8); color: var(--good); } 100% { transform: none; } }

#fx { position: absolute; inset: 0; pointer-events: none; }
#token { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; border: 3px solid #2f6fdd; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: left linear, top linear; z-index: 5; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
#token[hidden] { display: none; }
#token.fever { border-color: var(--fever); box-shadow: 0 0 16px 5px rgba(255, 154, 60, .85); animation: glow .5s infinite alternate; }
#token.fever.f2 { box-shadow: 0 0 22px 9px rgba(255, 140, 40, .9); }
#token.fever.f3, #token.fever.f4 { box-shadow: 0 0 30px 14px rgba(255, 90, 30, .95); animation-duration: .25s; }
@keyframes glow { from { transform: scale(1); } to { transform: scale(1.22); } }
.pop { position: absolute; transform: translate(-50%, -50%); z-index: 6; text-align: center; white-space: nowrap; animation: rise 1.5s forwards; background: rgba(15, 17, 21, .9); border-radius: 8px; padding: 2px 8px; border: 1px solid var(--line); }
.pop b { display: block; color: var(--gold); line-height: 1.1; }
.pop .f { display: block; font-size: 11.5px; color: #dfe3ec; } .pop .s { display: block; font-size: 11.5px; font-weight: 700; }
.pop .via { display: block; font-size: 11px; color: var(--ice); font-style: normal; }
.pop.big { border-color: var(--gold); animation-name: risebig; } .pop.huge { border-color: #ff6a2a; animation-name: risehuge; } .pop.huge b { color: #ffb14a; text-shadow: 0 0 12px #ff6a2a; }
.pop.refuse { border-color: var(--bad); } .pop.refuse b { color: var(--bad); font-size: 13px; }
.pop.growpop { border-color: var(--good); animation-name: risegrow; } .pop.growpop b { color: var(--good); font-size: 12px; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -95%); } }
@keyframes risebig { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.35); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }
@keyframes risehuge { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1.7) rotate(-4deg); } 20% { transform: translate(-50%, -50%) scale(1.2) rotate(3deg); } 30% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -130%); } }
@keyframes risegrow { 0% { opacity: 0; transform: translate(-50%, 0); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -120%); } }

/* ── 보드 가운데 ── */
#center { min-width: 0; min-height: 0; border-radius: 10px; background: #191c22; border: 1px solid var(--line); padding: 8px 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
.ctitle { font-size: 17px; font-weight: 800; } .ctitle small { font-size: 12px; font-weight: 400; color: var(--dim); }
.cbig { font-size: 30px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.2; }
.csub { font-size: 13px; color: var(--dim); margin: 3px 0; }
.cbox.judge.pass .ctitle { color: var(--good); } .cbox.judge.failj .ctitle { color: var(--bad); } .cbox.judge button { margin-top: 6px; }
.banner { margin-top: 5px; font-size: 12px; line-height: 1.4; border-radius: 6px; padding: 4px 8px; background: #262b35; }
.banner.extra { background: #3a2a1a; } .banner.extra b { color: var(--fever); } .banner b { color: var(--gold); }
#board.n8 .cbig { font-size: 24px; } #board.n8 .banner { font-size: 11px; }

/* ── 오른쪽: 드워프·단계, 살펴보기, 기록 ── */
#hud, #detail, #log-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
#hud { flex: none; height: 132px; overflow: hidden; font-size: 13px; }
#hud h3 { font-size: 15px; } #hud .cur { color: var(--gold); font-weight: 700; }
#detail { flex: none; height: 160px; overflow: auto; font-size: 13px; }
#side.logbig #detail { display: none; }
.sends { margin: 3px 0; padding: 0; list-style: none; font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; } .sends b { color: var(--gold); }
.decklabel { white-space: nowrap; }
.hud-head { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; font-size: 14px; }
.hud-head .lapno { margin-left: auto; font-weight: 700; } .hud.fever .lapno { color: var(--fever); }
.hud-row { display: flex; align-items: center; gap: 9px; margin-top: 5px; font-size: 13px; flex-wrap: wrap; }
.hud-row b { font-size: 16px; font-variant-numeric: tabular-nums; } .hud-row b.neg { color: var(--bad); }
.gauge { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
.gauge i { font-style: normal; } .gauge .gr { color: #f0923b; } .gauge .gl { color: #7fb3ff; }
.gtrack { position: relative; width: 64px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #35507e, #2a2e37 50%, #7e4d22); }
.gtrack::after { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 14px; background: #777; }
.gtrack em { position: absolute; top: -4px; width: 10px; height: 16px; margin-left: -5px; border-radius: 3px; background: #fff; transition: left .2s; }
.hungry { color: #f0923b; } .fullv { color: #7fb3ff; }
.state { font-weight: 800; font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.state.drunk { background: #6b3fb8; } .state.full { background: #2f5fa8; }
.pips { display: inline-flex; gap: 2px; } .pips i { width: 7px; height: 12px; border-radius: 2px; background: #3a4150; } .pips i.on { background: #ff7fa5; }
.sums { border-top: 1px solid var(--line); padding-top: 5px; } .sums b { color: var(--gold); }
.calc { border-collapse: collapse; font-size: 13px; margin: 3px 0; } .calc th { text-align: left; color: var(--dim); font-weight: 400; padding: 1px 10px 1px 0; white-space: nowrap; vertical-align: top; }
.calc b { color: var(--gold); } .calc small { color: var(--dim); }
.tacts { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; } .tacts .why { color: #ffb36b; }
.kw { font-size: 11.5px; color: var(--dim); margin-top: 3px; } .kw b { color: #c9d0de; }
#log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-right: 6px; }
#log-wrap h3 { font-size: 13px; display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; } #log-wrap .hint { font-weight: 400; font-size: 11px; color: var(--dim); flex: 1; }
.mini-btn { font-size: 11px; padding: 1px 7px; }
#log { flex: 1; overflow-y: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.line { padding: 2px 0; border-bottom: 1px solid #262b34; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.line .lt { color: var(--dim); width: 82px; flex: none; } .line .lf { color: #cfd5e2; } .line .lp { color: var(--gold); font-weight: 700; } .line .ls { color: #8f98aa; } .line .lr { color: var(--bad); font-weight: 700; }
.line.head { margin-top: 5px; color: #9cc2ff; border-bottom-color: #3b4660; display: block; } .line.tail { color: var(--text); display: block; background: #232832; }
.line.mark { color: var(--good); display: block; } .line.prepl { color: #b6bccb; display: block; }
.line.lap { background: #20242c; } .line.lap.extra .ls { color: var(--fever); } .line.lap.leave .ls { color: #d99; }
.line.growl .ls { color: var(--good); }

/* ── 아래 줄: 후보 / 드워프 ── */
#tray { flex: 1; min-height: 176px; display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.cands, .dwarves { display: flex; gap: 6px; flex: 1; min-width: 0; }
.cand { position: relative; flex: 1; min-width: 0; max-width: 220px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 9px 6px 30px; cursor: pointer; overflow: hidden; }
.cand[draggable="true"] { cursor: grab; }
.cand .kbar { position: absolute; left: 0; top: 0; right: 0; height: 5px; display: flex; } .cand .kbar i { flex: 1; background: #70757f; }
.cand.support { background: #2a2d33; }
.cand.none { border-style: dashed; background: transparent; cursor: default; }
.cand.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 87, .45); }
.cand.locked { border-color: var(--ice); background: #22323d; box-shadow: inset 0 0 18px rgba(127, 212, 255, .3); }
.cname { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ckind { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.ckind b { color: var(--gold); font-size: 14px; }
.rar-common { color: #b9bec9; } .rar-uncommon { color: #7fd4ff; font-weight: 700; } .rar-rare { color: #ffb14a; font-weight: 700; }
.ctext { font-size: 11px; line-height: 1.3; color: #c2c7d2; margin-top: 2px; }
.lock { position: absolute; left: 5px; right: 5px; bottom: 4px; padding: 1px 4px; font-size: 11px; }
.cand.locked .lock { border-color: var(--ice); color: var(--ice); }
.actions { width: 150px; flex: none; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.actions.wide { width: auto; } .actions small { font-size: 11px; line-height: 1.3; }
.builds { text-align: center; } .builds b { font-size: 20px; color: var(--gold); }
.speed { display: flex; gap: 3px; align-items: center; } .speed button { flex: 1; padding: 4px 6px; } .speed button.on { background: #2f6fdd; border-color: #4a86ee; }
.auto { font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap; }
.dwarf { flex: 1; max-width: 340px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px; }
.dwarf.pickable:hover { border-color: #fff; }
.dwarf.chosen { border-color: var(--gold); } .dwarf.gone { opacity: .3; }
.dname { font-weight: 800; font-size: 15px; } .dtrait { font-size: 12px; color: #d8c98f; }
.drow { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.dfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--dim); min-height: 30px; }
.dfoot .pv { color: #ffb36b; font-weight: 700; } .dfoot button { margin-left: auto; }

/* ── 창 ── */
#modal { display: none; } #modal.open { display: flex; position: fixed; inset: 0; background: rgba(0, 0, 0, .62); align-items: center; justify-content: center; z-index: 20; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 24px; width: 920px; max-width: calc(100% - 32px); max-height: 92%; overflow: auto; }
.sheet.settings { width: 660px; }
.sheet table { border-collapse: collapse; margin: 8px 0; } .sheet td, .sheet th { padding: 3px 12px 3px 0; text-align: left; font-size: 13px; }

// ── js/engine.js
// 욜로드워프 데모 3.0 계산 엔진. 규칙 문서(docs/demo3/욜로드워프_데모3_규칙.md)의 2~11절.
// 화면과 무관한 순수 계산이다. DOM도 난수도 쓰지 않는다. 숫자는 모두 데이터 파일에서 읽는다.
// 계산은 docs/demo3/reference_engine3.mjs와 같다(검증 사례로 맞춘다). 여기에는 화면이 쓸 기록(events)을 더했다.
//
// 상태(st): { board: 건물 id(빈 칸은 null), stars: ★ 수, grow: 키운 배율(0.1 단위의 정수), tiles: 특수 칸 id, kept: 터줏자리에 남은 배율, timers, money }
// read(st)             → 보드를 읽는다 (업종, 거리 표지판, 이웃, 배율이 가장 높은 매장)
// runDwarf(st, dwarf)  → 드워프 한 마리. 상태를 바꾸지 않는다. 키운 배율은 결과의 grow로 돌려준다
// apply(st, op)        → 보드에 손대는 일 하나. 새 상태나 { illegal }을 돌려준다. 미리 보기도 이 함수로 한다
// endWave / startPrep  → 웨이브가 끝났을 때와 정비를 시작할 때

const mod = (a, n) => ((a % n) + n) % n;
const clone = st => ({ ...st, board: [...st.board], stars: [...st.stars], grow: [...st.grow], tiles: [...st.tiles], kept: [...st.kept], timers: { ...st.timers } });

function makeEngine(data) {
  const c = data.constants;
  const shops = new Map(data.shops.map(s => [s.id, s]));
  const supports = new Map(data.supports.map(s => [s.id, s]));
  const guests = new Map((data.guests || []).map(g => [g.id, g]));
  const traits = new Map(data.traits.map(t => [t.id, t]));
  const REST = '휴식';

  // 보드를 읽는다. 드워프를 보낼 때마다 다시 읽는다.
  function read(st) {
    const { board, stars, grow, tiles } = st; const N = board.length;
    const shopAt = board.map(b => (b && shops.get(b)) || null);
    const typeAt = board.map(b => (b && supports.has(b) ? supports.get(b).effect.type : null));
    const effAt = board.map(b => (b && supports.has(b) ? supports.get(b).effect : null));
    const shopTiles = []; for (let i = 0; i < N; i++) if (shopAt[i]) shopTiles.push(i);
    const prev = i => mod(i - 1, N), next = i => mod(i + 1, N);

    // 이웃. 로터리의 건물은 모든 칸과 이웃하고, 모든 칸은 로터리의 건물과 이웃한다.
    const rotary = tiles.indexOf('rotary');
    const near = (i, which) => {
      if (i === rotary) return board.map((b, j) => j).filter(j => j !== i);
      const base = which === 'adj' ? [prev(i), next(i)] : which === 'prev' ? [prev(i)] : [next(i)];
      if (rotary >= 0) base.push(rotary);
      return [...new Set(base)];
    };

    // 업종. 구름다리: 실제 양옆 칸이 모두 매장이면 두 매장은 서로의 업종도 갖는다 (본래 가진 업종만 건넨다). 로터리와 상관없다.
    const kindsAt = board.map((b, i) => (shopAt[i] ? [...shopAt[i].kinds] : null));
    for (let i = 0; i < N; i++) if (typeAt[i] === 'shareKinds') {
      const a = prev(i), b = next(i);
      if (shopAt[a] && shopAt[b] && a !== b) {
        for (const k of shopAt[b].kinds) if (!kindsAt[a].includes(k)) kindsAt[a].push(k);
        for (const k of shopAt[a].kinds) if (!kindsAt[b].includes(k)) kindsAt[b].push(k);
      }
    }
    // 거리 표지판: 휴식을 뺀 업종 가운데 그 업종을 가진 매장이 가장 많은 업종. 같으면 그 업종의 첫 매장이 입구에 가까운 쪽, 그것도 같으면 업종의 정해진 순서
    const mostKind = () => {
      let kind = null, bestCount = 0, bestFirst = N;
      for (const k of c.kinds) {
        if (k === REST) continue;
        const t = shopTiles.filter(j => kindsAt[j].includes(k)); if (!t.length) continue;
        if (t.length > bestCount || (t.length === bestCount && t[0] < bestFirst)) { kind = k; bestCount = t.length; bestFirst = t[0]; }
      }
      return kind;
    };
    const likeAll = typeAt.includes('likeMost') ? mostKind() : null;
    // 배율. 금싸라기 땅의 매장은 ★이 하나 더 있는 것으로 친다. 값은 10을 곱한 정수다 (124면 ×12.4).
    const starMult = j => Math.pow(c.stars.multPerStar, stars[j] + (tiles[j] === 'prime_land' ? 1 : 0));
    const mult10 = j => (10 + grow[j]) * starMult(j);
    // 배율이 가장 높은 매장. 같으면 요금이 높은 쪽, 그것도 같으면 입구에서 먼저 나오는 칸
    let top = null;
    for (const j of shopTiles) if (top === null || mult10(j) > mult10(top) || (mult10(j) === mult10(top) && shopAt[j].fee > shopAt[top].fee)) top = j;
    return { N, shopAt, typeAt, effAt, shopTiles, kindsAt, likeAll, mostKind: mostKind(), near, starMult, mult10, top, rotary, prev, next, has: t => typeAt.includes(t), at: t => typeAt.indexOf(t) };
  }

  // 좋아하는 매장, 싫어하는 매장. 좋아하는 업종과 싫어하는 업종을 함께 가진 매장은 어느 쪽도 아니다. 단골 골목의 매장은 누구나 좋아한다.
  function tastes(st, info, dwarf) {
    const likes = info.likeAll && !dwarf.likes.includes(info.likeAll) ? [...dwarf.likes, info.likeAll] : dwarf.likes;
    const liked = st.board.map(() => false), disliked = st.board.map(() => false);
    for (const j of info.shopTiles) {
      if (st.tiles[j] === 'regulars_alley') { liked[j] = true; continue; }
      const like = info.kindsAt[j].some(k => likes.includes(k)), dis = dwarf.dislike != null && info.kindsAt[j].includes(dwarf.dislike);
      liked[j] = like && !dis; disliked[j] = dis && !like;
    }
    return { liked, disliked, likes };
  }

  // 드워프 한 마리를 보낸다. 상태를 바꾸지 않는다. 키운 배율은 결과의 grow로 돌려준다.
  // dwarf: { likes, dislike, trait } 또는 귀빈 { likes, dislike: null, quirk, baseLaps?, firstLapCost?, guest: true }
  // opt.first: 이 웨이브의 첫 드워프인가. opt.events가 false면 기록을 남기지 않는다.
  function runDwarf(st, dwarf, opt = {}) {
    const info = read(st), N = info.N, tiles = st.tiles; const grow = [...st.grow];
    const trait = dwarf.trait ? traits.get(dwarf.trait).effect : {};
    const quirk = dwarf.quirk || null;
    const start = trait.lapStart || {};
    const baseLaps = dwarf.baseLaps || trait.baseLaps || c.baseLaps;
    const payMult = dwarf.guest ? c.guests.payMult : 1;
    const fresh = () => ({ h: (start.hunger || 0) - (start.fullness || 0), d: start.tipsy || 0, y: start.hype || 0, tired: 0 });   // h: 양수는 허기, 음수는 포만감
    const { liked, disliked } = tastes(st, info, dwarf);
    const log = opt.events === false ? null : [];

    let s = fresh(), sat = 0, cost = dwarf.firstLapCost || c.extraLapCost.first, laps = 0, total = 0, uses = 0, fired = 0, dislikedThisLap = false, bestPay = 0;
    let step = 0, path = [], back = 0;   // 화면용: 이 바퀴에 걷는 칸의 차례
    const sales = st.board.map(() => 0);
    const amount = name => name === 'hunger' ? Math.max(s.h, 0) : name === 'fullness' ? Math.max(-s.h, 0) : name === 'tipsy' ? s.d : name === 'hype' ? s.y : s.tired;
    const isShop = j => !!info.shopAt[j];
    const snap = () => ({ h: s.h, d: s.d, y: s.y, tired: s.tired, sat });
    // 지원 건물이 한 번 지나갈 때 발동하는 횟수: 역 앞이면 한 번 더, 수집가면 한 번 더
    const fires = i => 1 + (tiles[i] === 'station_front' ? 1 : 0) + (quirk === 'doubleSupports' ? 1 : 0);
    // 매장을 키운다. 프랜차이즈 본사가 있으면 같은 이름의 매장이 함께 자란다. 기름진 땅의 매장은 두 배로 자란다.
    const addGrow = (j, amt, changes) => {
      const targets = info.has('franchise') ? info.shopTiles.filter(q => st.board[q] === st.board[j]) : [j];
      for (const q of targets) { const v = amt * (tiles[q] === 'fertile_land' ? 2 : 1); grow[q] += v; if (changes) changes.push({ tile: q, amount: v, now: grow[q] }); }
    };

    // 매장 이용 한 번. 지나치면 null. 매출을 셈한 뒤에 스택을 소모하고, 그 뒤에 스택을 준다.
    const use = (j, ev) => {
      const shop = info.shopAt[j];
      if (tiles[j] !== 'back_door') {
        if (shop.skip === 'drunk' && s.d >= c.thresholds.drunk) { if (ev) ev.skip = 'drunk'; return null; }
        if (shop.skip === 'full' && -s.h >= c.thresholds.full) { if (ev) ev.skip = 'full'; return null; }
        if (quirk === 'skipUnliked' && !liked[j]) { if (ev) ev.skip = 'unliked'; return null; }
      }
      let add = 0; for (const r of shop.read) add += r.per * amount(r.stack);
      const fan = shop.fanMult && liked[j] ? shop.fanMult : 1;
      const m = (10 + grow[j]) * info.starMult(j) * fan * payMult;
      const pay = Math.floor((shop.fee + add) * m / 10);
      if (ev) Object.assign(ev, { fee: shop.fee, terms: shop.read.map(r => ({ stack: r.stack, count: amount(r.stack), per: r.per })), add,
        mult10: (10 + grow[j]) * info.starMult(j), fan, guestMult: payMult, raw: (shop.fee + add) * m / 10, pay });
      for (const r of shop.read) if (r.consume) { if (r.stack === 'fullness') { if (s.h < 0) s.h = 0; } else if (r.stack === 'tipsy') s.d = 0; else if (r.stack === 'hype') s.y = 0; }
      const bonus = tiles[j] === 'lucky_spot' ? 1 : 0, plus = x => (x > 0 ? x + bonus : 0), g = shop.give;
      s.h += plus(g.hunger) - (quirk === 'noFullness' ? 0 : plus(g.fullness)); s.d += plus(g.tipsy); s.y += plus(g.hype);
      return pay;
    };

    // 칸 하나를 지난다
    const visit = i => {
      const base = (shopTile, via) => (log ? { type: 'use', lap: laps + 1, step, tile: i, shopTile, via, before: snap() } : null);
      if (isShop(i)) {
        const shop = info.shopAt[i], times = 1 + (tiles[i] === 'station_front' ? 1 : 0);
        for (let u = 0; u < times; u++) {
          const ev = base(i, u > 0 ? 'again' : back ? 'roundabout' : null);
          const pay = use(i, ev);
          if (pay === null) { if (log) { ev.type = 'skip'; log.push(ev); } break; }
          total += pay; sales[i] += pay; uses += 1; if (pay > bestPay) bestPay = pay;
          let restGain = 0, restFrom = null, satChange = 0;
          if (shop.rest) {   // 휴식: 피로를 만족도로 바꾼다. 한 번 지나갈 때 한 번만 바꾼다
            if (u === 0) { restFrom = s.tired; restGain = Math.floor(s.tired / shop.rest.per) * shop.rest.gain; sat += restGain; if (shop.rest.mode === 'consumePer') s.tired = 0; }
          } else if (liked[i]) s.tired += c.fatigue.perLikedUse * (quirk === 'doubleFatigue' ? 2 : 1);
          if (liked[i]) { sat += c.satisfaction.like; satChange = c.satisfaction.like; } else if (disliked[i]) { sat += c.satisfaction.dislike; satChange = c.satisfaction.dislike; dislikedThisLap = true; }
          if (log) { Object.assign(ev, { satChange, restGain, restFrom, after: snap(), total }); log.push(ev); }
        }
        return;
      }
      const e = info.effAt[i]; if (!e) return;
      for (let f = 0; f < fires(i); f++) {
        if (e.type === 'branch') {   // 2호점: 배율이 가장 높은 매장을 이 칸에서 이용한다. 매출과 스택만 바뀐다
          if (info.top !== null) {
            const ev = base(info.top, 'branch');
            const pay = use(info.top, ev);
            if (pay !== null) { total += pay; sales[info.top] += pay; if (pay > bestPay) bestPay = pay; if (log) { Object.assign(ev, { satChange: 0, restGain: 0, restFrom: null, after: snap(), total }); log.push(ev); } }
            else if (log) { ev.type = 'skip'; log.push(ev); }
          }
        } else if (e.type === 'roundabout') {   // 회전교차로: 이전 칸들을 한 번 더 지난다. 입구 앞으로는 넘어가지 않는다
          const here = step;
          for (let k = Math.max(0, i - e.tiles); k < i; k++) { path.push({ tile: k, back: true }); step = path.length - 1; back++; visit(k); back--; }
          if (f + 1 < fires(i)) { path.push({ tile: i, back: true }); step = path.length - 1; } else step = here;
        } else if (e.type === 'pass') {   // 산책로, 버스킹 존
          const before = log ? snap() : null;
          for (const k of e.consume || []) { if (k === 'fullness') { if (s.h < 0) s.h = 0; } else if (k === 'tipsy') s.d = 0; else if (k === 'hype') s.y = 0; }
          if (e.convert) { const v = amount(e.convert.from); s.d = 0; s.y += v; }
          if (e.give) s.h += e.give.hunger || 0;
          if (log) log.push({ type: 'pass', lap: laps + 1, step, tile: i, before, after: snap() });
        } else if (e.type === 'grower') {
          const stacks3 = ['hunger', 'fullness', 'tipsy', 'hype', 'tired'].filter(k => amount(k) >= c.thresholds.nightMarket).length;
          const n = e.cond === 'any' ? 1 : e.cond === 'extraLap' ? +(laps >= baseLaps) : e.cond === 'first' ? +!!opt.first : e.cond === 'disliked' ? +dislikedThisLap
            : e.cond === 'stacks3' ? stacks3 : 1;   // likesPrev는 아래에서 매장마다 본다
          if (n === 0) continue;
          let targets = e.target === 'adj' ? info.near(i, 'adj') : e.target === 'prev' ? info.near(i, 'prev') : e.target === 'next' ? info.near(i, 'next')
            : e.target === 'all' ? info.shopTiles : info.shopTiles.filter(j => liked[j]);
          targets = targets.filter(isShop);
          if (e.cond === 'likesPrev') targets = targets.filter(j => liked[j]);
          const changes = log ? [] : null;
          for (const j of targets) addGrow(j, e.amount * n, changes);
          if (targets.length) { fired += 1; if (log) log.push({ type: 'grow', lap: laps + 1, step, tile: i, changes }); }
        }
      }
    };

    for (;;) {
      path = []; step = 0;
      if (log) log.push({ type: 'lapStart', lap: laps + 1, extra: laps >= baseLaps, extraNo: Math.max(0, laps - baseLaps + 1), stacks: snap(), sat, cost, baseLaps, path });
      for (let i = 0; i < N; i++) { path.push({ tile: i, back: false }); step = path.length - 1; visit(i); }
      laps += 1; dislikedThisLap = false;
      const end = log ? { type: 'lapEnd', lap: laps, total, stacksBefore: snap(), satBefore: sat } : null;
      const kept = s; s = fresh();
      if (info.has('keepStack')) s.y += kept.y;          // 전광판: 흥은 바퀴를 넘어 남는다
      if (quirk === 'keepTipsy') s.d += kept.d;          // 술고래: 취기는 바퀴를 넘어 남는다
      let result = 'base';
      if (laps >= baseLaps) {
        if (sat >= cost && laps < c.maxLaps) { sat -= cost; if (end) end.paid = cost; cost *= c.extraLapCost.multiplier; result = 'extra'; }
        else { result = 'leave'; if (end) end.needed = cost; }
      }
      if (end) { Object.assign(end, { result, sat, cost, keptHype: info.has('keepStack') ? kept.y : 0, keptTipsy: quirk === 'keepTipsy' ? kept.d : 0 }); log.push(end); }
      if (result === 'leave') break;
    }
    // 방명록: 떠날 때 남은 만족도 1당 배율이 가장 높은 매장이 자란다
    const gb = info.at('guestbook');
    if (gb >= 0 && sat > 0 && info.top !== null) { const changes = log ? [] : null; addGrow(info.top, info.effAt[gb].amount * sat * fires(gb), changes); if (log) log.push({ type: 'grow', leaving: true, tile: gb, changes }); }
    return { sales: total, laps, extraLaps: laps - baseLaps, uses, fired, satLeft: sat, salesByTile: sales, grow, top: info.top, bestPay, events: log, baseLaps, info, liked, disliked };
  }

  // 이 웨이브에 드워프를 보내는 횟수. 버스 터미널이 있으면 한 번 더, 그것이 역 앞에 있으면 또 한 번 더.
  function sends(st) {
    const i = st.board.findIndex(b => b && supports.has(b) && supports.get(b).effect.type === 'extraSend');
    return c.sendsPerWave + (i >= 0 ? supports.get(st.board[i]).effect.amount * (1 + (st.tiles[i] === 'station_front' ? 1 : 0)) : 0);
  }
  // 귀빈의 보상으로 나오는 특수 칸 후보의 수
  const guestReward = (waveNo, extraLaps) => (c.guests.rewardWaves.includes(waveNo) ? Math.min(c.guests.rewardMax, Math.max(0, extraLaps)) : 0);
  // 새로고침 비용: 그 웨이브의 처음 값에서 시작해 누를 때마다 두 배. presses: 이번 정비에서 지금까지 누른 횟수
  const refreshCost = (waveNo, presses) => data.waves[waveNo - 1].refreshBase * Math.pow(c.refresh.multiplierPerPress, presses);

  // 웨이브 하나: 보낸 순서대로 드워프를 돌리고, 귀빈이 있으면 마지막에 돌린다. 검증 사례와 같은 꼴을 돌려준다.
  function runWave(st, dwarves, guestId = null) {
    const cur = clone(st); const salesByTile = st.board.map(() => 0); const perDwarf = [];
    const one = (d, first) => {
      const r = runDwarf(cur, d, { first, events: false }); cur.grow = r.grow; r.salesByTile.forEach((v, i) => { salesByTile[i] += v; });
      return { sales: r.sales, laps: r.laps, extraLaps: r.extraLaps, uses: r.uses, satLeft: r.satLeft, top: r.top };
    };
    dwarves.forEach((d, k) => perDwarf.push(one(d, k === 0)));
    const guest = guestId ? one({ ...guests.get(guestId), guest: true }, false) : null;
    const info = read(st);
    return { perDwarf, guest, waveSales: perDwarf.reduce((a, r) => a + r.sales, 0) + (guest ? guest.sales : 0), salesByTile, growAfter: cur.grow,
      kindsByTile: info.kindsAt, likeAll: info.likeAll };
  }

  // 보드에 손대는 일들. 새 상태를 돌려준다. 할 수 없는 일이면 { illegal: 까닭 }을 돌려준다.
  // op: { type: 'build' | 'overlap' | 'replace', tile, id } | { type: 'demolish', tile } | { type: 'swap', a, b }
  //   | { type: 'insert', gap, from } (보드의 건물을 틈에 끼워 넣는다) | { type: 'insert', gap, id } (손패의 카드를 틈에 끼워 넣는다)
  //   | { type: 'addTile', pos, special } (귀빈의 보상: pos번 칸 자리에 새 특수 칸을 끼워 넣는다. pos는 1부터 칸 수까지)
  // 틈 gap은 (gap − 1)번 칸과 gap번 칸의 사이다. 0은 마지막 칸과 0번 칸의 사이다.
  function apply(st0, op) {
    const st = clone(st0), N = st.board.length; const isShop = id => shops.has(id), isSup = id => supports.has(id);
    const known = id => isShop(id) || isSup(id);
    const empty = i => st.board[i] === null;
    const put = (i, b) => { st.board[i] = b.id; st.stars[i] = b.stars; st.grow[i] = b.grow; };
    const take = i => { const b = { id: st.board[i], stars: st.stars[i], grow: st.grow[i] }; st.board[i] = null; st.stars[i] = 0; st.grow[i] = 0; return b; };
    const fresh = id => { if (supports.has(id) && supports.get(id).waves) st.timers[id] = supports.get(id).waves; return { id, stars: 0, grow: 0 }; };
    const demolish = i => {   // 터줏자리의 매장을 철거하면 키운 배율이 칸에 남는다
      if (isShop(st.board[i]) && st.tiles[i] === 'old_site') st.kept[i] += st.grow[i];
      if (st.board[i] in st.timers) delete st.timers[st.board[i]];
      take(i);
    };
    const dupSupport = id => isSup(id) && st.board.includes(id);
    const bad = why => ({ illegal: why });
    if (op.type === 'build') {
      if (!known(op.id)) return bad('없는 건물'); if (!empty(op.tile)) return bad('빈 칸이 아니다'); if (dupSupport(op.id)) return bad('같은 지원 건물은 한 채');
      put(op.tile, fresh(op.id));
    } else if (op.type === 'overlap') {
      if (!isShop(op.id) || st.board[op.tile] !== op.id) return bad('같은 이름의 매장이 아니다'); if (st.stars[op.tile] >= c.stars.max) return bad('★이 가득 찼다');
      st.stars[op.tile] += 1;
    } else if (op.type === 'replace') {
      if (!known(op.id)) return bad('없는 건물'); if (empty(op.tile)) return bad('빈 칸이다'); if (st.board[op.tile] === op.id) return bad('같은 건물이다');
      demolish(op.tile); if (dupSupport(op.id)) return bad('같은 지원 건물은 한 채');
      put(op.tile, fresh(op.id));
    } else if (op.type === 'demolish') {
      if (empty(op.tile)) return bad('빈 칸이다'); demolish(op.tile);
    } else if (op.type === 'swap') {
      const a = take(op.a), b = take(op.b); put(op.a, b); put(op.b, a);
    } else if (op.type === 'insert') {
      if (op.id !== undefined) { if (!known(op.id)) return bad('없는 건물'); if (dupSupport(op.id)) return bad('같은 지원 건물은 한 채'); }
      else if (empty(op.from)) return bad('빈 칸이다');
      const b = op.id !== undefined ? null : take(op.from);   // 보드의 건물은 먼저 들어 올린다. 그 칸은 빈 칸이 된다
      let dL = -1, dR = -1;
      for (let k = 0; k < N && dR < 0; k++) if (empty(mod(op.gap + k, N))) dR = k;          // 가는 방향으로 가장 가까운 빈 칸
      for (let k = 0; k < N && dL < 0; k++) if (empty(mod(op.gap - 1 - k, N))) dL = k;      // 오는 방향으로 가장 가까운 빈 칸
      if (dR < 0) return bad('빈 칸이 없다');
      const b2 = b || fresh(op.id);
      if (dR <= dL) {   // 틈의 뒤쪽 건물들이 가는 방향으로 한 칸씩 밀린다. 거리가 같으면 이쪽이다
        for (let k = dR; k >= 1; k--) put(mod(op.gap + k, N), take(mod(op.gap + k - 1, N)));
        put(mod(op.gap, N), b2);
      } else {          // 틈의 앞쪽 건물들이 오는 방향으로 한 칸씩 밀린다
        for (let k = dL; k >= 1; k--) put(mod(op.gap - 1 - k, N), take(mod(op.gap - k, N)));
        put(mod(op.gap - 1, N), b2);
      }
    } else if (op.type === 'addTile') {
      if (op.pos < 1 || op.pos > N) return bad('끼워 넣을 수 없는 자리'); if (st.tiles.includes(op.special)) return bad('같은 특수 칸은 한 런에 한 번');
      st.board.splice(op.pos, 0, null); st.stars.splice(op.pos, 0, 0); st.grow.splice(op.pos, 0, 0); st.tiles.splice(op.pos, 0, op.special); st.kept.splice(op.pos, 0, 0);
    } else return bad('모르는 일');
    // 터줏자리에 남은 배율은 그 칸에 놓인 매장이 가져간다
    for (let i = 0; i < st.board.length; i++) if (st.kept[i] > 0 && isShop(st.board[i])) { st.grow[i] += st.kept[i]; st.kept[i] = 0; }
    return st;
  }

  // 웨이브가 끝났을 때(판정을 통과한 뒤) 보드에 일어나는 일. 순서: 대기업 사옥, 팝업 스토어.
  function endWave(st0, salesByTile) {
    const st = clone(st0), N = st.board.length, events = []; const isShop = i => !!st.board[i] && shops.has(st.board[i]);
    const typeOf = id => (id && supports.has(id) ? supports.get(id).effect.type : null);
    const hq = st.board.findIndex(b => typeOf(b) === 'merger');
    if (hq >= 0) {
      const a = mod(hq - 1, N), b = mod(hq + 1, N);
      if (a !== b && isShop(a) && isShop(b)) {
        // 매출이 높은 쪽이 남는다. 같으면 ★이 많은 쪽, 그것도 같으면 입구에서 먼저 나오는 쪽
        const lo = Math.min(a, b), hi = Math.max(a, b);
        const win = salesByTile[lo] !== salesByTile[hi] ? (salesByTile[lo] > salesByTile[hi] ? lo : hi) : st.stars[lo] !== st.stars[hi] ? (st.stars[lo] > st.stars[hi] ? lo : hi) : lo;
        const lose = win === lo ? hi : lo;
        if (st.stars[win] < c.stars.max) {   // 남는 쪽이 이미 ★★★이면 아무 일도 없다
          events.push({ type: 'merger', demolished: lose, shop: st.board[lose], starTo: win });
          if (st.tiles[lose] === 'old_site') st.kept[lose] += st.grow[lose];
          st.board[lose] = null; st.stars[lose] = 0; st.grow[lose] = 0; st.stars[win] += 1;
        }
      }
    }
    for (const id of Object.keys(st.timers)) {   // 팝업 스토어
      const p = st.board.indexOf(id); if (p < 0) continue;
      st.timers[id] -= 1;
      if (st.timers[id] <= 0) { st.board[p] = null; st.stars[p] = 0; st.grow[p] = 0; delete st.timers[id]; events.push({ type: 'gone', tile: p, id }); }
    }
    return { state: st, events };
  }

  // 정비를 시작할 때: 둘째 웨이브부터 고리의 끝에 빈 칸이 하나 생긴다.
  function startPrep(st0, waveNo) {
    const st = clone(st0);
    if (waveNo >= 2) for (let k = 0; k < c.tilesPerPrep; k++) { st.board.push(null); st.stars.push(0); st.grow.push(0); st.tiles.push(null); st.kept.push(0); }
    return st;
  }

  // 화면용: 이 칸의 지원 건물이 닿는 칸
  function reach(st, i) {
    const info = read(st), e = info.effAt[i]; if (!e) return [];
    if (e.type === 'grower') return (e.target === 'adj' ? info.near(i, 'adj') : e.target === 'prev' ? info.near(i, 'prev') : e.target === 'next' ? info.near(i, 'next') : info.shopTiles).filter(j => info.shopAt[j]);
    if (e.type === 'branch' || e.type === 'guestbook') return info.top === null ? [] : [info.top];
    if (e.type === 'roundabout') { const out = []; for (let k = Math.max(0, i - e.tiles); k < i; k++) out.push(k); return out; }
    if (e.type === 'shareKinds' || e.type === 'merger') { const a = info.prev(i), b = info.next(i); return a !== b && info.shopAt[a] && info.shopAt[b] ? [a, b] : []; }
    return [];
  }

  return { read, tastes, runDwarf, runWave, apply, endWave, startPrep, sends, guestReward, refreshCost, reach, clone,
    shop: id => shops.get(id), support: id => supports.get(id), building: id => shops.get(id) || supports.get(id), guest: id => guests.get(id), trait: id => traits.get(id) };
}

// 숫자를 화면에 적는 법
const fmtNum = x => (Number.isInteger(x) ? String(x) : String(Math.round(x * 1000) / 1000));
// 배율(10을 곱한 정수)을 화면에 적는 법: 124 → "12.4", 10 → "1"
const fmtMult = m10 => (m10 % 10 === 0 ? String(m10 / 10) : (m10 / 10).toFixed(1));

// 이용 기록 한 줄을 계산식 글자로. 예: "(4 + 허기 3 × 4) × 12.4 × 3(단골) × 3(귀빈) = 1785"
function formulaText(ev, stackNames) {
  const terms = ev.terms.filter(t => t.count > 0).map(t => `${stackNames[t.stack]} ${t.count} × ${t.per}`);
  const sum = [fmtNum(ev.fee), ...terms].join(' + ');
  const mults = [];
  if (ev.mult10 !== 10) mults.push(fmtMult(ev.mult10));
  if (ev.fan !== 1) mults.push(`${ev.fan}(단골)`);
  if (ev.guestMult !== 1) mults.push(`${ev.guestMult}(귀빈)`);
  if (!mults.length) return terms.length ? `${sum} = ${ev.pay}` : `요금 ${ev.pay}`;
  const floored = ev.raw !== ev.pay ? ' (소수 버림)' : '';
  return `${terms.length ? `(${sum})` : sum} × ${mults.join(' × ')} = ${ev.pay}${floored}`;
}

// 허기와 포만감은 한 눈금이다. 양수면 허기, 음수면 포만감.
const gaugeText = h => (h > 0 ? `허기 ${h}` : h < 0 ? `포만감 ${-h}` : '허기 0');

// ── js/rng.js
// 시드로 다시 만들 수 있는 무작위. 같은 시드 글자 → 같은 수열.
function hash(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

function makeRng(seedText) {
  let a = hash(String(seedText));
  const rand = () => {                    // mulberry32
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    rand,
    int: n => Math.floor(rand() * n),
    shuffle(list) {
      const a2 = list.slice();
      for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; }
      return a2;
    },
    weighted(items, weightOf) {
      const total = items.reduce((s, x) => s + weightOf(x), 0);
      let r = rand() * total;
      for (const x of items) { r -= weightOf(x); if (r < 0) return x; }
      return items[items.length - 1];
    },
  };
}

const randomSeed = () => Math.random().toString(36).slice(2, 8).toUpperCase();

// ── js/game.js
// 한 런의 진행 (데모 3.0 규칙 문서의 1~4절, 11절). DOM을 쓰지 않는다. 계산과 보드에 손대는 일은 engine.js에 맡긴다.
// 단계(phase): intro → prep(정비) → pick(드워프 고르기) … → guest(귀빈이 돌 차례) → judge(판정) → reward(귀빈의 보상) → prep … → over
// 인기 업종과 비인기 업종(덱의 색)은 넣지 않았다(사용자 요청). 덱은 90마리에서 고르게 뽑는다.



function createGame(data, { seed, targetMult = 1, traits = true, supportRate = null, disabled = [], forced = [], guestPicks = [], startSpecial = null, alwaysThree = false } = {}) {
  const c = data.constants, H = c.hand;
  const engine = makeEngine(data);
  const isShop = id => !!engine.shop(id);
  const typeOf = id => (id && engine.support(id) ? engine.support(id).effect.type : null);
  const nameOf = id => engine.building(id).name;
  const candRng = makeRng(`${seed}/candidates`);   // 후보, 드워프, 시작, 보상은 서로 다른 수열을 쓴다
  const rate = supportRate == null ? c.candidateRates.support : supportRate;
  const N0 = data.waves[0].tiles;

  const s = {
    seed: String(seed),
    options: { targetMult, traits, supportRate: rate, disabled: [...disabled], forced: forced.slice(0, 2), guestPicks: [...guestPicks], startSpecial, alwaysThree },
    phase: 'intro',
    wave: 0,                                   // 0부터. 화면에는 +1
    st: { board: new Array(N0).fill(null), stars: new Array(N0).fill(0), grow: new Array(N0).fill(0), tiles: new Array(N0).fill(null), kept: new Array(N0).fill(0), timers: {}, money: c.startMoney },
    uid: new Array(N0).fill(0), nextUid: 1,     // 건물마다의 표. 건물을 따라 움직인다(웨이브의 매출을 건물에 적어 두려고)
    newTiles: [],
    hand: [],                                  // 손패: 건물 id들
    candidates: new Array(H.candidates).fill(null),   // { id, built } 또는 null(골랐거나 없음)
    picksLeft: 0, refreshPresses: 0,
    deck: [], guests: [],                      // guests: 귀빈 웨이브 차례대로의 귀빈 id
    start: { tile: null, special: null },
    hand3: [], order: [], orderPos: 0, sendIndex: 0,
    waveSales: 0, waveSends: [], salesByUid: {}, guestRun: null,
    results: [], log: [],
    bestPay: null, maxLaps: 0,
    judge: null, outcome: null,
  };
  const targetOf = wave => Math.ceil(data.waves[wave].target * s.options.targetMult);
  const target = () => targetOf(s.wave);
  const noteLog = () => s.log[s.wave];
  const guestWaveIndex = () => c.guests.waves.indexOf(s.wave + 1);
  const guestOfWave = (w = s.wave) => { const k = c.guests.waves.indexOf(w + 1); return k >= 0 && s.guests[k] ? engine.guest(s.guests[k]) : null; };

  // ── 런을 시작할 때: 덱, 귀빈 셋, 시작 보드의 특수 칸, 시작 손패 ──
  function setup() {
    const rng = makeRng(`${s.seed}/deck`), dk = c.deck;
    s.deck = rng.shuffle(data.dwarves).slice(0, dk.size).map(d => ({ ...d, trait: null }));   // 90마리에서 고르게 30마리
    if (s.options.traits) {
      const lucky = rng.shuffle(s.deck.map((_, i) => i)).slice(0, dk.traitsEach * data.traits.length);
      lucky.forEach((di, n) => { s.deck[di].trait = data.traits[n % data.traits.length].id; });
    }
    const r2 = makeRng(`${s.seed}/start`);
    // 귀빈: 여섯 가운데 셋(서로 다르다). 시험용 스위치로 정한 자리는 그대로 둔다
    const all = (data.guests || []).map(g => g.id), chosen = c.guests.waves.map((_, k) => (all.includes(s.options.guestPicks[k]) ? s.options.guestPicks[k] : null));
    const rest = r2.shuffle(all.filter(id => !chosen.includes(id)));
    s.guests = chosen.map(id => id || rest.shift() || null);
    // 시작 보드의 특수 칸: 칸과 종류 모두 무작위
    const specials = (data.specialTiles || []).map(x => x.id);
    for (let k = 0; k < (specials.length ? c.specialTiles.atStart : 0); k++) {
      const special = specials.includes(s.options.startSpecial) ? s.options.startSpecial : specials[r2.int(specials.length)];
      const tile = r2.int(N0);
      s.st.tiles[tile] = special; s.start = { tile, special };
    }
    // 시작 손패: 매장 3장과 지원 건물 1장
    for (let k = 0; k < H.startShops; k++) s.hand.push(data.shops[r2.int(data.shops.length)].id);
    for (let k = 0; k < H.startSupports; k++) {
      const pool = data.supports.filter(x => !s.options.disabled.includes(x.id) && !s.hand.includes(x.id));
      s.hand.push((pool.length ? pool : data.shops)[r2.int((pool.length ? pool : data.shops).length)].id);
    }
  }

  // ── 보드에 손대는 일. 엔진의 apply로 하고, 건물의 표(uid)도 같은 일로 함께 옮긴다 ──
  // 미리 해 본다: 놓은 뒤의 상태와 건물의 표. 새로 서는 건물의 표는 -1이다. 화면의 미리 보기와 실제 결과가 이 함수 하나에서 나온다
  function simulate(op) {
    const r = engine.apply(s.st, op);
    if (r.illegal) return r;
    const n = s.st.board.length;
    const shadow = engine.apply({ board: s.st.board, stars: new Array(n).fill(0), grow: s.uid, tiles: new Array(n).fill(null), kept: new Array(n).fill(0), timers: {}, money: 0 }, op);
    return { st: r, uid: shadow.grow.map((u, i) => (r.board[i] === null ? 0 : u || -1)) };
  }
  function applyOp(op) {
    const r = simulate(op);
    if (r.illegal) return r;
    s.uid = r.uid.map(u => (u === -1 ? s.nextUid++ : u));   // 새로 선 건물은 새 표를 받는다
    s.st = r.st;
    return r.st;
  }
  const preview = op => engine.apply(s.st, op);
  // 카드를 칸에 놓으면 무슨 일이 되는가: 빈 칸이면 짓기, 같은 이름의 매장이면 겹치기, 다른 건물이면 바꿔 짓기
  const cardOp = (id, tile) => (s.st.board[tile] === null ? { type: 'build', tile, id } : s.st.board[tile] === id && isShop(id) ? { type: 'overlap', tile, id } : { type: 'replace', tile, id });

  // ── 후보 (3.1절) ──
  function supportAllowed(x, taken) { return !s.options.disabled.includes(x.id) && !taken.has(x.id); }
  function drawCandidates(slots, forcedIds = []) {
    const taken = new Set([...s.st.board.filter(b => b && !isShop(b)), ...s.hand.filter(id => !isShop(id))]);
    s.candidates.forEach((cd, i) => { if (cd && !slots.includes(i) && !isShop(cd.id)) taken.add(cd.id); });
    const queue = forcedIds.filter(id => engine.support(id) && supportAllowed(engine.support(id), taken));
    const builtShops = s.st.board.filter(b => b && isShop(b));
    for (const i of slots) {
      let pick, built = false;
      if (queue.length) pick = engine.support(queue.shift());
      else if (i === 0 && s.wave + 1 >= H.builtShopCandidateFromPrep && builtShops.length) { pick = engine.shop(builtShops[candRng.int(builtShops.length)]); built = true; }   // 첫 장은 보드에 지은 매장
      else {
        const pool = candRng.rand() < s.options.supportRate ? data.supports.filter(x => supportAllowed(x, taken)) : [];
        const from = pool.length ? pool : data.shops;
        pick = from[candRng.int(from.length)];
      }
      s.candidates[i] = { id: pick.id, built };
      if (!isShop(pick.id)) taken.add(pick.id);
      noteLog().offered.push(pick.id);
    }
  }
  const openSlots = () => s.candidates.map((cd, i) => (cd && cd.picked ? -1 : i)).filter(i => i >= 0);

  function enterPrep() {
    s.phase = 'prep'; s.judge = null; s.guestRun = null;
    s.log[s.wave] = { offered: [], picked: [], used: [], demolished: [], refreshes: 0, reward: null };
    const before = s.st.board.length;
    s.st = engine.startPrep(s.st, s.wave + 1);             // 둘째 웨이브부터 고리의 끝에 빈 칸 하나
    s.newTiles = []; while (s.uid.length < s.st.board.length) { s.newTiles.push(s.uid.length); s.uid.push(0); }
    void before;
    s.picksLeft = H.picksPerPrep; s.refreshPresses = 0;
    s.candidates = new Array(H.candidates).fill(null);
    drawCandidates(s.candidates.map((_, i) => i), s.wave === 0 ? s.options.forced : []);
  }

  const refreshCost = () => engine.refreshCost(s.wave + 1, s.refreshPresses);
  const canRefresh = () => s.phase === 'prep' && s.picksLeft > 0 && s.st.money >= refreshCost() && openSlots().length > 0;
  const canMove = () => s.phase === 'prep' || s.phase === 'pick';
  const sendsNow = () => engine.sends(s.st);   // 보낼 횟수는 드워프를 보낼 때마다 다시 센다

  function nextHand(returning) {
    const take = c.offerSize - (returning ? 1 : 0);
    const drawn = s.order.slice(s.orderPos, s.orderPos + take).map(i => s.deck[i]);
    s.orderPos += take;
    s.hand3 = returning ? [returning, ...drawn] : drawn;
  }

  // 드워프나 귀빈 한 마리의 결과를 상태에 넣는다
  function commitRun(r, who) {
    const out = { ...r, dwarf: who, wave: s.wave, sendIndex: s.sendIndex, sends: sendsNow(), offer: s.hand3.slice(), target: target(), growBefore: [...s.st.grow],
      moneyBefore: s.st.money, waveSalesBefore: s.waveSales, bestPayBefore: s.bestPay ? s.bestPay.pay : 0 };
    s.st = { ...s.st, grow: r.grow, money: s.st.money + r.sales };
    s.waveSales += r.sales;
    r.salesByTile.forEach((v, i) => { if (v) s.salesByUid[s.uid[i]] = (s.salesByUid[s.uid[i]] || 0) + v; });   // 2호점에서 올린 것도 그 매장의 매출이다
    if (r.laps > s.maxLaps) s.maxLaps = r.laps;
    if (r.bestPay > (s.bestPay ? s.bestPay.pay : 0)) s.bestPay = { pay: r.bestPay, dwarf: who.name, wave: s.wave };
    return out;
  }

  // 웨이브의 끝 (11절): 판정 → 대기업 사옥 → 팝업 스토어 → 귀빈의 보상
  function finishWave() {
    const t = target(), passed = s.st.money >= t, cleared = passed && s.wave === data.waves.length - 1;
    s.judge = { passed, cleared, money: s.st.money, target: t, ratio: s.st.money / t, events: [], reward: null };
    s.results.push({ wave: s.wave, sales: s.waveSales, moneyAfter: s.st.money, target: t, passed, sends: s.waveSends, guest: s.guestRun });
    if (passed && !cleared) {
      const r = engine.endWave(s.st, s.st.board.map((_, i) => s.salesByUid[s.uid[i]] || 0));
      for (const e of r.events) {
        if (e.type === 'merger') { s.judge.events.push({ type: 'merger', demolished: nameOf(e.shop), kept: nameOf(r.state.board[e.starTo]), tile: e.demolished, starTo: e.starTo }); noteLog().demolished.push(`${nameOf(e.shop)}(대기업 사옥)`); }
        else s.judge.events.push({ type: 'gone', name: nameOf(e.id), tile: e.tile });
      }
      s.st = r.state; s.uid = s.uid.map((u, i) => (s.st.board[i] === null ? 0 : u));
      // 귀빈의 보상: 추가 바퀴 수만큼(셋까지) 아직 보드에 없는 특수 칸 가운데서
      const waveNo = s.wave + 1;
      if (c.guests.rewardWaves.includes(waveNo) && s.guestRun) {
        const count = s.options.alwaysThree ? c.guests.rewardMax : engine.guestReward(waveNo, s.guestRun.extraLaps);
        const pool = makeRng(`${s.seed}/reward/${s.wave}`).shuffle((data.specialTiles || []).map(x => x.id).filter(id => !s.st.tiles.includes(id)));
        s.judge.reward = { count, offer: pool.slice(0, count) };
        noteLog().reward = { offer: s.judge.reward.offer.slice(), chosen: null, pos: null };
      }
    }
    s.hand3 = [];
    s.phase = 'judge';
  }

  // 웨이브 도중에 보드를 손대서 보낼 횟수가 줄었으면(버스 터미널을 철거했다) 이미 다 보낸 것일 수 있다
  function recount() {
    if (s.phase !== 'pick' || s.sendIndex === 0 || s.sendIndex < sendsNow()) return;
    if (api.isGuestWave()) { s.hand3 = []; s.phase = 'guest'; } else finishWave();
  }

  const api = {
    state: s, data, engine, c,
    target, targetOf, refreshCost, canRefresh, canMove, sendsNow, preview, simulate, cardOp, guestOfWave,
    info: () => engine.read(s.st),
    isGuestWave: () => guestWaveIndex() >= 0 && !!guestOfWave(),

    begin() { if (s.phase !== 'intro') return false; enterPrep(); return true; },

    // 후보에서 고른다. 한 정비에 2장까지
    pick(slot) {
      const cd = s.candidates[slot];
      if (s.phase !== 'prep' || !cd || cd.picked || s.picksLeft <= 0) return false;
      s.hand.push(cd.id); cd.picked = true; s.picksLeft -= 1;
      noteLog().picked.push(cd.id);
      return true;
    },

    // 새로고침: 아직 고르지 않은 후보를 모두 다시 뽑는다. 고른 수는 그대로다
    refresh() {
      if (!canRefresh()) return false;
      s.st = { ...s.st, money: s.st.money - refreshCost() };
      s.refreshPresses += 1; noteLog().refreshes += 1;
      drawCandidates(openSlots());
      return true;
    },

    // 손패의 카드를 쓴다. target: { tile } (짓기, 겹치기, 바꿔 짓기) 또는 { gap } (끼워 넣기). 할 수 없으면 { illegal }
    playCard(h, where) {
      const id = s.hand[h];
      if (s.phase !== 'prep' || id == null) return { illegal: '지금은 쓸 수 없다' };
      const op = where.gap != null ? { type: 'insert', gap: where.gap, id } : cardOp(id, where.tile);
      const was = op.type === 'replace' ? s.st.board[op.tile] : null;
      const r = applyOp(op);
      if (r.illegal) return r;
      s.hand.splice(h, 1);
      const verb = { build: '짓기', overlap: '겹치기', replace: '바꿔 짓기', insert: '끼워 넣기' }[op.type];
      noteLog().used.push(`${verb} ${nameOf(id)}${op.type === 'insert' ? `(틈 ${op.gap})` : `(${op.tile}번${was ? `, ${nameOf(was)} 철거` : ''})`}`);
      if (was) noteLog().demolished.push(nameOf(was));
      return { ok: true, op };
    },

    discard(h) {
      if (s.phase !== 'prep' || s.hand[h] == null) return false;
      noteLog().used.push(`버리기 ${nameOf(s.hand[h])}`);
      s.hand.splice(h, 1);
      return true;
    },

    // 보드의 건물: 자리 바꾸기, 끼워 넣기(옮기기), 철거. 정비 때와 드워프를 고르기 전에 할 수 있다
    swap(a, b) { if (!canMove() || a === b || (s.st.board[a] === null && s.st.board[b] === null)) return false; const ok = !applyOp({ type: 'swap', a, b }).illegal; recount(); return ok; },
    insertFrom(from, gap) { if (!canMove()) return false; const ok = !applyOp({ type: 'insert', gap, from }).illegal; recount(); return ok; },
    demolish(tile) {
      if (!canMove() || s.st.board[tile] === null) return false;
      const id = s.st.board[tile];
      if (applyOp({ type: 'demolish', tile }).illegal) return false;
      noteLog().demolished.push(nameOf(id));
      recount();
      return true;
    },

    // 정비를 마친다. 손패는 2장까지 남긴다
    startWave() {
      if (s.phase !== 'prep' || s.hand.length > H.keep) return false;
      s.phase = 'pick';
      s.order = makeRng(`${s.seed}/dwarves/${s.wave}`).shuffle(s.deck.map((_, i) => i));
      s.orderPos = 0; s.sendIndex = 0; s.waveSales = 0; s.waveSends = []; s.salesByUid = {}; s.guestRun = null;
      nextHand(null);
      return true;
    },

    // 시험용: 지금 보드에서 이 드워프를 보내면 매출이 얼마인가. 상태를 바꾸지 않는다(배율을 키우지 않는다)
    previewSend(choice) {
      const r = engine.runDwarf(s.st, s.hand3[choice], { first: s.sendIndex === 0, events: false });
      return { sales: r.sales, laps: r.laps };
    },

    // 드워프를 보낸다. 결과(기록 포함)를 돌려주고 상태를 진행한다. 화면은 기록을 재생만 한다
    send(choice) {
      const dwarf = s.hand3[choice];
      if (s.phase !== 'pick' || !dwarf) return null;
      const r = engine.runDwarf(s.st, dwarf, { first: s.sendIndex === 0 });   // 웨이브의 첫 드워프는 처음 보낸 드워프다
      const out = commitRun(r, dwarf);
      s.waveSends.push({ name: dwarf.name, sales: r.sales, laps: r.laps });
      s.sendIndex += 1;
      if (s.sendIndex < sendsNow()) nextHand(s.st.board.some(b => typeOf(b) === 'returnDwarf') ? dwarf : null);   // 쿠폰 가판대
      else if (api.isGuestWave()) { s.hand3 = []; s.phase = 'guest'; }   // 드워프를 다 보낸 뒤에 귀빈이 마지막으로 돈다

    },

    // 귀빈이 돈다. 고르는 것이 아니다. 웨이브의 첫 드워프로 치지 않는다
    runGuest() {
      if (s.phase !== 'guest') return null;

      const r = engine.runDwarf(s.st, g, { first: false });
      const out = commitRun(r, g);
      s.guestRun = { id: g.id, name: g.name, sales: r.sales, laps: r.laps, extraLaps: r.extraLaps };
      finishWave();
      return out;
    },

    // 판정 뒤: 모자라거나 클리어면 끝. 보상이 있으면 보상을 고르고, 없으면 다음 정비

      const j = s.judge;
      if (!j.passed || j.cleared) { s.outcome = j.cleared ? 'clear' : 'fail'; s.phase = 'over'; }
      else if (j.reward && j.reward.offer.length) s.phase = 'reward';

      return true;
    },

    // 귀빈의 보상: 특수 칸 하나를 골라 틈에 끼워 넣는다. pos는 1부터 칸 수까지(칸 수면 마지막 칸의 뒤)

      return true;
    },

}

    el.innerHTML = `<div class="cbox"><div class="ctitle">웨이브 <small>보내기 ${s.sendIndex + 1} / ${game.sendsNow()}</small></div><div class="csub">셋 가운데 하나를 골라 보내세요.</div></div>`;
  } else el.innerHTML = '';
}

const judgeEventText = e => (e.type === 'merger' ? `${josa(e.demolished, '을', '를')} 철거하고 ${e.kept}에 ★을 줬어요.` : `${josa(e.name, '이', '가')} 문을 닫았어요.`);
const guestLine = (g, wave) => `<b>${g.name}</b>${wave ? ` <small>웨이브 ${wave}</small>` : ''} ${g.likes.map(k => chip(k, '♥')).join('')} <span class="gq">${g.text}</span>`;

// 오른쪽 위 창: 걷는 드워프의 스택, 또는 지금 단계의 요약
function renderHud() {
  const s = game.state, P = ui.play, el = $('hud');
  if (P) {
    const d = P.out.dwarf, st = P.st;
    const drunkOn = st.d >= c.thresholds.drunk, fullOn = -st.h >= c.thresholds.full;
    const pos = Math.max(-6, Math.min(6, st.h));
    el.innerHTML = `<div class="hud ${P.fever ? 'fever' : ''}">
      <div class="hud-head"><b>${d.guest ? '👑' : '🧔'} ${d.name}</b>${d.likes.map(k => chip(k, '♥')).join('')}${d.dislike ? chip(d.dislike, '✕') : ''}${traitBadge(d)}
        <span class="lapno">${P.fever ? `🔥 추가 바퀴 ${P.fever}` : `바퀴 ${P.lap} / 기본 ${P.out.baseLaps}`}</span></div>
      ${d.guest ? `<div class="hud-row"><span class="gq">${d.text}</span><span class="state guest">매출 ×${c.guests.payMult}</span></div>` : ''}
      <div class="hud-row"><span class="gauge" title="허기와 포만감은 한 눈금의 양 끝이에요">
        <i class="gl">포만감</i><span class="gtrack"><em style="left:${50 + pos * (50 / 6)}%"></em></span><i class="gr">허기</i></span>
        <b class="${st.h > 0 ? 'hungry' : st.h < 0 ? 'fullv' : ''}">${gaugeText(st.h)}</b>${fullOn ? '<span class="state full">포만 상태</span>' : ''}
        <span class="st">🍺 ${SN.tipsy} <b>${st.d}</b></span>${drunkOn ? '<span class="state drunk">만취 상태</span>' : ''}
        <span class="st">🎵 ${SN.hype} <b>${st.y}</b></span><span class="st">💤 ${SN.fatigue} <b>${st.tired}</b></span></div>
      <div class="hud-row sat"><span class="st">😊 만족도 <b class="${P.sat < 0 ? 'neg' : ''}">${P.sat}</b></span>
        <span class="st">다음 추가 바퀴의 비용 <b>${P.cost}</b></span>
        <span class="pips">${Array.from({ length: Math.min(P.cost, 12) }, (_, k) => `<i class="${k < P.sat ? 'on' : ''}"></i>`).join('')}</span></div>
      <div class="hud-row sums"><span>이 ${d.guest ? '귀빈' : '드워프'}의 매출 <b>${won(P.total)}</b></span><span>이번 웨이브의 매출 <b>${won(P.waveSales)}</b></span></div></div>`;
    return;
  }
  const sends = [...s.waveSends, ...(s.guestRun ? [{ name: `귀빈 ${s.guestRun.name}`, sales: s.guestRun.sales, laps: s.guestRun.laps }] : [])]
    .map((x, i) => `<li>${i + 1}. ${x.name} <b>${won(x.sales)}</b> <small>${x.laps}바퀴</small></li>`).join('');
  const g = game.guestOfWave();
  const guestNote = g ? `<p class="gnote">이번 웨이브의 귀빈: ${guestLine(g)}</p>` : '';
  if (s.phase === 'prep') {
    el.innerHTML = `<h3>정비 <small>${waveLabel()} · ${s.st.board.length}칸${s.newTiles.length ? ' (새 칸 1개)' : ''} · 이번 웨이브에 보낼 횟수 ${game.sendsNow()}</small></h3>
      ${guestNote}
      <p class="dim">후보에서 2장까지 골라 손패에 넣어요. 손패의 카드를 끌거나 누른 뒤, 빈 칸(짓기), 같은 매장(★ +1), 다른 건물(바꿔 짓기), 칸 사이의 틈(끼워 넣기)에 놓으세요. 보드의 건물도 끌어서 옮기거나 틈에 끼워 넣을 수 있어요. 정비를 마칠 때 손패는 ${H.keep}장까지 남아요.</p>`;
  } else if (s.phase === 'pick' || s.phase === 'guest') {
    el.innerHTML = `<h3>웨이브 <small>${waveLabel()} · 보내기 ${Math.min(s.sendIndex + 1, game.sendsNow())} / ${game.sendsNow()}</small></h3>
      <ul class="sends">${sends}</ul>
      <p>이번 웨이브의 매출 <b class="num">${won(s.waveSales)}</b></p>${guestNote}
      <p class="dim">고르기 전에 보드의 건물을 옮기거나 철거할 수 있어요.</p>`;
  } else if (s.phase === 'judge' || s.phase === 'reward') {
    const j = s.judge, rw = j.reward;
    el.innerHTML = `<h3 class="${j.passed ? 'good' : 'bad'}">${j.passed ? '목표 달성!' : '런이 끝났어요'} <small>${waveLabel()}</small></h3>
      <p>자금 <b class="num">${won(j.money)}</b> · 목표 <b class="num">${won(j.target)}</b> · ${j.passed ? `<b class="good">목표의 ${j.ratio.toFixed(1)}배</b>` : `목표에 ${won(j.target - j.money)} 모자랐어요.`}</p>
      <ul class="sends">${sends}</ul>
      ${j.events.length ? `<p class="good">${j.events.map(judgeEventText).join(' ')}</p>` : ''}
      ${rw ? `<p class="good">${rw.offer.length ? `추가 바퀴 ${s.guestRun.extraLaps}번. 특수 칸 후보 ${rw.offer.length}장을 받았어요.` : '추가 바퀴를 돌지 못했어요. 보상이 없어요.'}</p>` : ''}`;
  } else el.innerHTML = `<h3>${waveLabel()}</h3>`;
}

function cardHTML(id, extra = '') {
  const def = bldDef(id);
  return isShop(id)
    ? `<div class="kbar">${def.kinds.map(k => `<i style="background:${kindColor(k)}"></i>`).join('')}</div>
       <div class="cname">${def.name} <small>${def.kinds.map(k => ICONS[k] + k).join(' + ')} · 요금 <b>${def.fee}</b></small>${extra}</div><div class="ctext">${rich(def.text)}</div>`
    : `<div class="kbar"><i></i></div><div class="cname">${def.name} <small>지원 건물</small>${extra}</div><div class="ctext">${rich(def.text, nowText(id, null))}</div>`;
}
function dwarfCard(d, i, extra = '') {
  return `<div class="dwarf ${extra}" data-dwarf="${i}">
    <div class="dname">${d.guest ? '👑' : '🧔'} ${d.name} ${traitBadge(d)}</div>
    <div class="drow"><span class="mark like">♥</span>${d.likes.map(k => chip(k)).join('')}${d.dislike ? `<span class="mark hate">✕</span>${chip(d.dislike)}` : ''}</div>
    ${d.trait ? `<div class="dtrait">${rich(traitOf(d.trait).text)}</div>` : d.guest ? `<div class="dtrait">${d.text} 매출 ×${c.guests.payMult}.</div>` : ''}`;
}
const handRow = live => {
  const s = game.state;
  return `<div class="row"><div class="rlabel">손패<small>${s.hand.length}장${live ? ` · ${H.keep}장까지 남겨요` : ''}</small></div><div class="cards">${s.hand.map((id, h) =>
    `<div class="card ${isShop(id) ? 'shop' : 'support'} ${live ? 'live' : 'idle'} ${ui.sel?.type === 'card' && ui.sel.h === h ? 'sel' : ''}" data-hand="${h}" draggable="${live}">${cardHTML(id)}</div>`).join('') || '<div class="cardnone">손패가 비었어요</div>'}</div></div>`;
};

function renderTray() {
  const s = game.state, t = $('tray');
  const auto = `<label class="auto"><input type="checkbox" data-set="autoSkip" ${settings.autoSkip ? 'checked' : ''}> 계속 결과만 보기</label>`;
  if (ui.playing) {
    const P = ui.play, list = P.out.dwarf.guest ? [P.out.dwarf] : P.out.offer;
    t.innerHTML = `<div class="rows"><div class="row"><div class="rlabel">${P.out.dwarf.guest ? '귀빈' : '드워프'}</div><div class="dwarves">${list.map((d, i) => dwarfCard(d, i, d === P.out.dwarf ? 'chosen' : 'gone') + '</div>').join('')}</div></div>${handRow(false)}</div>
      <div class="actions"><div class="speed">${[1, 2, 4].map(x => `<button data-act="speed" data-x="${x}" class="${ui.speed === x ? 'on' : ''}">${x}배</button>`).join('')}</div>
      <button data-act="skip">결과만 보기 ⏭</button>${auto}</div>`;
  } else if (s.phase === 'prep') {
    const cost = game.refreshCost(), picked = H.picksPerPrep - s.picksLeft;
    t.innerHTML = `<div class="rows"><div class="row"><div class="rlabel">후보<small>${picked} / ${H.picksPerPrep}장 골랐어요</small></div><div class="cards">${s.candidates.map((cd, i) =>
        `<div class="card cand ${isShop(cd.id) ? 'shop' : 'support'} ${cd.picked ? 'picked' : s.picksLeft <= 0 ? 'dimmed' : ''}" data-cand="${i}">${cardHTML(cd.id, cd.built ? '<em class="builttag">지은 매장</em>' : '')}
          ${cd.picked ? '<span class="pickedtag">골랐어요</span>' : `<button class="pickbtn" data-act="pick" data-slot="${i}" ${s.picksLeft > 0 ? '' : 'disabled'}>고르기</button>`}</div>`).join('')}</div></div>
      ${handRow(true)}</div>
      <div class="actions"><button data-act="refresh" ${game.canRefresh() ? '' : 'disabled'}>새로고침 <b>${won(cost)}</b></button>
      <div class="discard ${ui.sel?.type === 'card' || ui.drag?.type === 'card' ? 'ready' : ''}" data-act="discard" data-discard="1">🗑 버리기<small>카드를 여기에 놓거나, 카드를 고르고 누르세요</small></div>
      <button class="primary" data-act="startWave">웨이브 시작</button></div>`;
  } else if (s.phase === 'pick') {
    t.innerHTML = `<div class="rows"><div class="row"><div class="rlabel">드워프<small>보내기 ${s.sendIndex + 1} / ${game.sendsNow()}</small></div><div class="dwarves">${s.hand3.map((d, i) => {
      const pv = settings.preview ? game.previewSend(i) : null;
      return dwarfCard(d, i, 'pickable') + `<div class="dfoot">${pv ? `<span class="pv">예상 매출 ${won(pv.sales)} · ${pv.laps}바퀴</span>` : ''}<button class="primary" data-act="send" data-i="${i}">보내기</button></div></div>`;
    }).join('')}</div></div>${handRow(false)}</div><div class="actions">${auto}</div>`;
  } else if (s.phase === 'reward' && !ui.modal) {
    const rw = s.judge.reward, N = s.st.board.length;
    t.innerHTML = `<div class="rows"><div class="row"><div class="rlabel">보상<small>특수 칸 후보 ${rw.offer.length}장</small></div><div class="cards">${rw.offer.map(id => { const d = spDef(id);
      return `<div class="card sp ${ui.reward.special === id ? 'sel' : ''}" data-act="rewardPick" data-sp="${id}"><div class="cname">${SP_ICON[id] || '✦'} ${d.name} <small>특수 칸</small></div><div class="ctext">${rich(d.text)}</div></div>`; }).join('')}</div></div>
      <div class="row"><div class="rlabel">자리</div><p class="rewardhelp">특수 칸을 하나 고르고 끼워 넣을 자리를 골라 주세요. 보드의 틈(●)을 누르면 그 자리에 새 칸이 생기고, 그 뒤의 칸과 건물이 한 칸씩 밀려요. 0번 칸의 앞에는 넣을 수 없어요. 놓기 전에는 틈을 바꿔 볼 수 있어요.
        ${ui.reward.pos != null ? `<br><b class="good">고른 자리: ${ui.reward.pos === N ? '마지막 칸의 뒤' : `${ui.reward.pos - 1}번 칸과 ${ui.reward.pos}번 칸의 사이`}</b>` : ''}</p></div></div>
      <div class="actions"><button class="primary" data-act="rewardPlace" ${ui.reward.special && ui.reward.pos != null ? '' : 'disabled'}>여기에 끼워 넣기</button></div>`;
  } else t.innerHTML = `<div class="rows">${s.phase === 'intro' ? '' : handRow(false)}</div><div class="actions"></div>`;
}

// ── 살펴보기 창 ──────────────────────────────────────────────
// 매장을 철거하거나 바꿔 지으려 할 때 잃는 것
function lossText(i) {
  const st = game.state.st, id = st.board[i];
  if (!id || !isShop(id)) return '';
  const m = (10 + st.grow[i]) * ui.info.starMult(i);
  return (st.stars[i] || st.grow[i] ? ` ★과 키운 배율(×${fmtMult(m)})이 사라져요.` : '') + (st.tiles[i] === 'old_site' && st.grow[i] ? ` 키운 배율(+${fmtMult(st.grow[i])})은 이 칸에 남아요.` : '');
}
function tileActions(i) {
  const s = game.state, id = s.st.board[i];
  if (!id || !game.canMove() || ui.playing || !(ui.sel?.type === 'tile' && ui.sel.i === i)) return '';
  return `<div class="tacts"><button data-act="demolish" data-tile="${i}">철거</button><small class="why">${lossText(i)}</small></div>`;
}
function detailTile(i) {
  const s = game.state, st = s.st, p = ui.info, id = st.board[i], sp = st.tiles[i], spd = sp && spDef(sp);
  const spLine = spd ? `<p class="spline">${SP_ICON[sp] || '✦'} <b>${spd.name}</b> ${rich(spd.text)}${st.kept[i] ? ` <span class="cmult">칸에 남은 배율 +${fmtMult(st.kept[i])}</span>` : ''}</p>` : '';
  if (!id) return `<h3>${i}번 칸 <small>빈 칸</small></h3>${spLine}<p class="dim">드워프는 그냥 지나가요.</p>`;
  const def = bldDef(id);
  if (!isShop(id)) {
    const t = game.engine.reach(st, i);
    return `<h3>${def.name} <small>${i}번 칸 · 지원 건물</small></h3><p>${rich(def.text, nowText(id, i))}</p>${spLine}${tileActions(i)}
      <p>닿는 칸: ${t.length ? t.map(j => `<b>${j}번${st.board[j] ? ' ' + bldName(st.board[j]) : ' 빈 칸'}</b>`).join(', ') : '<span class="dim">지금은 없어요</span>'}</p>`;
  }
  const kinds = p.kindsAt[i], stars = st.stars[i], g = viewGrow()[i], prime = st.tiles[i] === 'prime_land';
  const tags = [];
  if (p.top === i) tags.push('👑 배율이 가장 높은 매장');
  if (kinds.length > def.kinds.length) tags.push(`구름다리: 업종 ${kinds.slice(def.kinds.length).join(', ')}도 가져요`);
  return `<h3>${def.name}${stars ? ` <span class="stars">${'★'.repeat(stars)}</span>` : ''} <small>${i}번 칸</small> ${kinds.map(k => chip(k)).join('')}</h3><p>${rich(def.text)}</p>${spLine}${tileActions(i)}
    <table class="calc"><tr><th>배율</th><td>(1 + 키운 배율 <span class="cmult">${fmtMult(g)}</span>) × ${c.stars.multPerStar}<sup>★ ${stars}${prime ? ' + 1(금싸라기 땅)' : ''}</sup> = <b>×${fmtMult(mult10At(i))}</b></td></tr>
    <tr><th>요금</th><td>${def.fee}${def.fanMult ? ` <small>· 이 매장을 좋아하는 드워프는 매출 ×${def.fanMult}</small>` : ''}</td></tr></table>
    ${tags.length ? `<p class="good">${tags.join('<br>')}</p>` : ''}`;
}
function renderDetail() {
  const s = game.state, h = ui.hover || (ui.sel?.type === 'tile' ? { type: 'tile', i: ui.sel.i } : ui.sel?.type === 'card' ? { type: 'hand', h: ui.sel.h } : null);
  let html;
  if (h?.type === 'tile' && h.i < s.st.board.length) html = detailTile(h.i);
  else if ((h?.type === 'cand' && s.candidates[h.slot]) || (h?.type === 'hand' && s.hand[h.h])) {
    const id = h.type === 'cand' ? s.candidates[h.slot].id : s.hand[h.h], def = bldDef(id);
    html = `<h3>${def.name} <small>${h.type === 'cand' ? '후보' : '손패'} · ${isShop(id) ? `매장 · 요금 ${def.fee}` : '지원 건물'}</small> ${(def.kinds || []).map(k => chip(k)).join('')}</h3><p>${rich(def.text, nowText(id, null))}</p>
      ${isShop(id) ? '<p class="dim">같은 이름의 매장 위에 놓으면 ★ +1이에요(셋까지).</p>' : '<p class="dim">같은 지원 건물은 한 채만 지을 수 있어요.</p>'}`;
  } else if (h?.type === 'guest') { const g = game.engine.guest(s.guests[h.k]); html = `<h3>귀빈 ${g.name} <small>웨이브 ${c.guests.waves[h.k]}</small></h3><p>${g.likes.map(k => chip(k, '♥')).join('')}</p><p>${g.text}</p><p class="dim">귀빈은 드워프를 다 보낸 뒤에 마지막으로 돌아요. 귀빈이 낸 매출은 ${c.guests.payMult}배예요. 싫어하는 업종이 없어요.</p>`; }
  else if (h?.type === 'dwarf') {
    const d = ui.play ? (ui.play.out.dwarf.guest ? ui.play.out.dwarf : ui.play.out.offer[h.i]) : s.hand3[h.i];
    if (d) {
      const t = game.engine.tastes(s.st, ui.info, d);
      html = `<h3>${d.guest ? '👑' : '🧔'} ${d.name} ${traitBadge(d)}</h3><p>${d.likes.map(k => chip(k, '♥')).join('')} ${d.dislike ? chip(d.dislike, '✕') : ''}${ui.info.likeAll && !d.likes.includes(ui.info.likeAll) ? ` <small>거리 표지판:</small> ${chip(ui.info.likeAll, '♥')}` : ''}</p>
        ${d.trait ? `<p>${rich(traitOf(d.trait).text)}</p>` : d.guest ? `<p>${d.text}</p>` : ''}
        <p>보드에 좋아하는 매장 <b>${t.liked.filter(Boolean).length}곳</b>, 싫어하는 매장 <b>${t.disliked.filter(Boolean).length}곳</b></p>
        <p class="dim">좋아하는 매장을 이용하면 만족도 +1과 피로 +1, 싫어하는 매장이면 만족도가 1 내려요. 기본 바퀴를 다 돈 뒤 만족도가 추가 바퀴의 비용(3, 6, 12, 24…) 이상이면 그만큼 내고 한 바퀴를 더 돌아요.</p>`;
    }
  }
  if (!html) html = '<h3>살펴보기</h3><p class="dim">건물, 카드, 드워프, 귀빈에 마우스를 올리면 여기에 풀이가 나와요. 지원 건물은 닿는 칸이 보드에 밝혀져요. 색이 다른 칸은 특수 칸이에요.</p>';
  $('detail').innerHTML = html;
}

// 마우스가 올라간 것에 따라 보드에 표시를 한다. 칸을 다시 그리지 않는다(끌기가 끊기지 않게).
function applyHighlights() {
  const s = game.state, st = s.st, p = ui.info, h = ui.hover || (ui.sel?.type === 'tile' ? { type: 'tile', i: ui.sel.i } : null);
  const tiles = [...document.querySelectorAll('#board .tile')];
  const d = h?.type === 'dwarf' ? (ui.play ? (ui.play.out.dwarf.guest ? ui.play.out.dwarf : ui.play.out.offer[h.i]) : s.hand3[h.i]) : ui.play ? ui.play.out.dwarf : null;
  const t = d ? game.engine.tastes(st, p, d) : null;
  const reach = h?.type === 'tile' && st.board[h.i] && !isShop(st.board[h.i]) ? game.engine.reach(st, h.i) : [];
  tiles.forEach((el, i) => {
    el.classList.remove('hl-target', 'hl-self', 'sel', 'like', 'dislike');
    const like = t && t.liked[i], dis = t && t.disliked[i];
    el.querySelector('.taste').textContent = like ? '♥' : dis ? '✕' : '';
    if (like) el.classList.add('like'); else if (dis) el.classList.add('dislike');
    if (h?.type === 'tile' && h.i === i) el.classList.add('hl-self');
    if (reach.includes(i)) el.classList.add('hl-target');
    if (ui.sel?.type === 'tile' && ui.sel.i === i) el.classList.add('sel');
  });
}

// ── 놓기 전의 미리 보기 ──────────────────────────────────────
function hint(el, text, cls = '') {
  const h = $('hint');
  if (!el || !text) { h.hidden = true; return; }
  const r = el.getBoundingClientRect(), a = $('app').getBoundingClientRect();
  h.textContent = text; h.className = cls; h.hidden = false;
  h.style.left = Math.max(120, Math.min(a.width - 120, r.left - a.left + r.width / 2)) + 'px'; h.style.top = r.top - a.top - 6 + 'px';
}
function clearPreview() {
  document.querySelectorAll('#board .bld').forEach(b => { b.style.transform = ''; b.classList.remove('shifting'); });
  document.querySelectorAll('#board .tile.incoming, #board .tile.over, #board .tile.willshift, #board .tile.doomed').forEach(t => t.classList.remove('incoming', 'over', 'willshift', 'doomed'));
  document.querySelectorAll('#board .gap.hot').forEach(g => g.classList.remove('hot'));
  document.querySelector('#fx .ghost')?.remove();
  hint(null);
}
const held = () => ui.drag || ui.sel;
// 틈 위에 올렸을 때: 밀릴 건물 전부가 움직일 방향으로 반 칸쯤 비켜나고, 벌어진 자리에 놓을 건물이 흐리게 보인다
function previewGap(g) {
  clearPreview();
  const s = game.state, what = held(), gapEl = document.querySelector(`#board .gap[data-gap="${g}"]`);
  if (!what || !gapEl) return;
  const op = what.type === 'card' ? { type: 'insert', gap: g, id: s.hand[what.h] } : { type: 'insert', gap: g, from: what.i };
  const r = game.simulate(op);
  if (r.illegal) { if (what.type === 'card' && !s.st.board.includes(null)) hint(gapEl, '빈 칸이 없어요. 겹치거나 바꿔 지을 수 있어요.', 'bad'); else if (what.type === 'card') hint(gapEl, '같은 지원 건물은 한 채만 지을 수 있어요.', 'bad'); return; }
  gapEl.classList.add('hot');
  const movedUid = what.type === 'tile' ? s.uid[what.i] : -1;
  let dest = r.uid.indexOf(movedUid);
  r.uid.forEach((u, j) => {
    if (u <= 0 || u === movedUid) return;
    const from = s.uid.indexOf(u); if (from === j) return;
    const a = centerOf(tileEl(from)), b = centerOf(tileEl(j)), el = tileEl(from).querySelector('.bld');
    if (el) { el.style.transform = `translate(${(b.x - a.x) / 2}px, ${(b.y - a.y) / 2}px)`; el.classList.add('shifting'); }
    if (s.st.tiles[j]) tileEl(j).classList.add('incoming');   // 특수 칸으로 밀려 들어간다: 능력이 바뀐다
  });
  if (dest >= 0) {
    const id = what.type === 'card' ? s.hand[what.h] : s.st.board[what.i], ghost = document.createElement('div');
    ghost.className = 'ghost'; ghost.textContent = bldName(id);
    ghost.style.left = gapEl.style.left; ghost.style.top = gapEl.style.top;
    $('fx').appendChild(ghost);
    if (s.st.tiles[dest]) tileEl(dest).classList.add('incoming');
    hint(gapEl, `끼워 넣기 → ${dest}번 칸${s.st.tiles[dest] ? ` (${spDef(s.st.tiles[dest]).name})` : ''}`);
  }
}
// 칸 위에 올렸을 때: 무슨 일이 일어날지
function previewTile(i) {
  clearPreview();
  const s = game.state, st = s.st, what = held(), el = tileEl(i);
  if (!what || !el) return;
  if (what.type === 'tile') { if (what.i !== i) { el.classList.add('over'); hint(el, st.board[i] ? '자리 바꾸기' : '옮기기'); } return; }
  const id = s.hand[what.h], op = game.cardOp(id, i), r = game.simulate(op);
  el.classList.add('over');
  if (op.type === 'build') hint(el, '짓기');
  else if (op.type === 'overlap') hint(el, r.illegal ? '★이 가득 찼어요.' : '★ +1', r.illegal ? 'bad' : 'good');
  else if (r.illegal) hint(el, '같은 지원 건물은 한 채만 지을 수 있어요.', 'bad');
  else { el.classList.add('doomed'); hint(el, `${josa(bldName(st.board[i]), '이', '가')} 철거돼요.${lossText(i)}`, 'warn'); }
}
// 보상의 자리를 고를 때: 그 뒤의 칸들이 밀린다는 것을 보여 준다
function previewReward(pos) {
  document.querySelectorAll('#board .tile.willshift').forEach(t => t.classList.remove('willshift'));
  if (pos == null) return;
  for (let j = pos; j < game.state.st.board.length; j++) tileEl(j)?.classList.add('willshift');
}
// 놓은 뒤: 밀린 건물들이 제자리로 미끄러져 들어간다
function snapshot() { const m = new Map(); document.querySelectorAll('#board .bld[data-uid]').forEach(b => { const r = b.getBoundingClientRect(); m.set(b.dataset.uid, { x: r.left, y: r.top }); }); return m; }
function playFlip(before) {
  document.querySelectorAll('#board .bld[data-uid]').forEach(b => {
    const old = before.get(b.dataset.uid), r = b.getBoundingClientRect();
    if (!old) { b.classList.add('placed'); return; }
    const dx = old.x - r.left, dy = old.y - r.top; if (Math.abs(dx) + Math.abs(dy) < 2) return;
    b.style.transition = 'none'; b.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = 'transform .28s ease'; b.style.transform = ''; setTimeout(() => { b.style.transition = ''; }, 320); }));
  });
}
