<title>욜로드워프 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1f232b; --panel2: #272c36; --line: #363d4a; --text: #e8eaf0; --dim: #98a0b0;
  --gold: #ffd257; --good: #6fd08c; --bad: #ff6b62; --fever: #ff9a3c; --ice: #7fd4ff;
  --tw: 182px; --th: 114px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: #6b7690; background: #303746; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: #2f6fdd; border-color: #4a86ee; font-weight: 700; }
button.primary:hover:not(:disabled) { background: #3c7cec; }
small, .dim { color: var(--dim); }
h2, h3 { margin: 0 0 6px; }
h3 small, h2 small { font-weight: 400; font-size: 12px; }
.good { color: var(--good); } .warn { color: #ffb36b; }
.chip { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; white-space: nowrap; margin: 0 2px; background: color-mix(in srgb, var(--c) 28%, #1b1e25); border: 1px solid var(--c); }
.mark { font-weight: 700; margin-right: 4px; font-size: 12px; }
.mark.like, .s.like { color: #ff7fa5; } .mark.hate, .s.hate { color: #9fb0c8; }

#app { display: flex; flex-direction: column; height: 100%; min-height: 780px; overflow-x: auto; }
#top, main { min-width: 1240px; }
#top { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
#top .brand { font-weight: 800; font-size: 17px; }
#top .stat { display: flex; align-items: baseline; gap: 5px; padding: 2px 12px; border-left: 1px solid var(--line); position: relative; }
#top .stat label { color: var(--dim); font-size: 12px; }
#top .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
#top .money b { color: var(--gold); }
#top .money.hit b { color: var(--good); }
#top .money .bar { position: absolute; left: 12px; right: 12px; bottom: -4px; height: 3px; background: #333a47; border-radius: 2px; overflow: hidden; }
#top .money .bar i { display: block; height: 100%; background: var(--gold); transition: width .2s; }
#top .money.hit .bar i { background: var(--good); }
#top .grow { flex: 1; }
#top .flag { color: #ffb36b; font-size: 12px; border: 1px dashed #ffb36b; border-radius: 4px; padding: 1px 6px; }
#top .seed { color: var(--dim); font-size: 12px; } #top .seed b { color: var(--text); font-family: ui-monospace, monospace; user-select: all; }

main { flex: 1; display: flex; gap: 12px; padding: 12px 16px; min-height: 0; }
#left { display: flex; flex-direction: column; gap: 10px; flex: none; }
#side { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 330px; min-height: 0; }

/* ── 보드 ── */
#board { position: relative; display: grid; grid-template-columns: repeat(4, var(--tw)); grid-auto-rows: var(--th); gap: 8px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; transition: box-shadow .4s, border-color .4s; }
#board.fever { border-color: var(--fever); box-shadow: 0 0 0 1px var(--fever), 0 0 26px rgba(255, 154, 60, .35); }
#board.fever.f2 { box-shadow: 0 0 0 2px var(--fever), 0 0 40px rgba(255, 154, 60, .5); }
#board.fever.f3, #board.fever.f4 { box-shadow: 0 0 0 3px #ff6a2a, 0 0 60px rgba(255, 106, 42, .7); }
#board.burst { animation: burst .7s; }
@keyframes burst { 0% { transform: scale(1); } 25% { transform: scale(1.018); filter: brightness(1.5); } 100% { transform: scale(1); } }
.tile { position: relative; border-radius: 8px; padding: 9px 8px 6px; background: var(--panel2); border: 2px solid var(--line); overflow: hidden; user-select: none; }
.tile[draggable="true"] { cursor: grab; }
.tile.empty { background: transparent; border-style: dashed; display: flex; align-items: center; justify-content: center; }
.tile.empty .plus { color: #596275; font-size: 12px; }
.tile.support { background: #2a2d33; border-color: #4a4f59; color: #c9ccd3; }
.tile .kbar { position: absolute; left: 0; top: 0; right: 0; height: 6px; display: flex; }
.tile .kbar i { flex: 1; background: #70757f; }
.tile .tno { position: absolute; right: 6px; bottom: 3px; font-size: 11px; color: #6f788a; }
.tile[data-tile="0"] .tno { color: var(--gold); font-weight: 700; }
.tile[data-tile="0"] { box-shadow: inset 4px 0 0 var(--gold); }
.tile .arrow { position: absolute; left: 6px; bottom: 2px; font-size: 13px; color: #6f788a; }
.tile .taste { position: absolute; right: 6px; top: 9px; font-weight: 800; font-size: 17px; }
.tile.like .taste { color: #ff7fa5; } .tile.dislike .taste { color: #c3d0e6; } .tile.both .taste { color: var(--dim); font-size: 13px; }
.tile.like { background: color-mix(in srgb, #ff7fa5 13%, var(--panel2)); }
.tile.dislike { background: repeating-linear-gradient(135deg, var(--panel2), var(--panel2) 9px, #222630 9px, #222630 12px); }
.tname { font-weight: 700; font-size: 14px; white-space: nowrap; margin-top: 2px; }
.tkind { font-size: 11px; color: var(--dim); white-space: nowrap; }
.star { color: var(--gold); font-style: normal; font-weight: 700; } .boost { color: var(--ice); font-style: normal; font-weight: 700; }
.tile.top { border-color: #8b7630; }
.tstats { display: flex; gap: 8px; align-items: baseline; margin-top: 3px; font-size: 12px; white-space: nowrap; }
.tstats b { font-size: 17px; font-variant-numeric: tabular-nums; }
.tstats .fee b { color: var(--gold); } .tstats .mult { color: #ff9f7a; } .tstats .again { color: var(--ice); font-weight: 700; }
.tgrow { font-size: 11px; color: var(--good); white-space: nowrap; }
.ttext { font-size: 11px; line-height: 1.3; color: #a9aeb9; margin-top: 3px; }
.tile.hl-self { border-color: #fff; }
.tile.hl-target { border-color: var(--good); box-shadow: 0 0 0 2px rgba(111, 208, 140, .45); }
.tile.hl-source { border-color: var(--ice); box-shadow: 0 0 0 2px rgba(127, 212, 255, .45); }
.tile.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 87, .5); }
.tile.droppable { border-style: dashed; border-color: #6b7690; cursor: pointer; }
.tile.over { border-color: var(--gold); background: #3a3a2c; }
.tile.reading { border-color: #fff3b0; box-shadow: 0 0 14px rgba(255, 243, 176, .6); filter: brightness(1.25); }
.tile.paid { animation: paid .45s; } .tile.paid-big { animation: paidbig .6s; }
@keyframes paid { 0% { filter: brightness(1.9); transform: scale(1.04); } 100% { filter: none; transform: none; } }
@keyframes paidbig { 0% { filter: brightness(2.4); transform: scale(1.1) rotate(-1deg); } 30% { transform: scale(1.06) rotate(1deg); } 100% { filter: none; transform: none; } }
.tile.refused { animation: refused .45s; }
@keyframes refused { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); background: #5a2b2b; } 60% { transform: translateX(5px); } }
.tile.grew { animation: grew .9s; }
.tile.grew .tstats b { animation: grewnum .9s; }
@keyframes grew { 0% { box-shadow: 0 0 0 3px var(--good); } 100% { box-shadow: none; } }
@keyframes grewnum { 0% { transform: scale(1.9); color: var(--good); } 100% { transform: none; } }
.tstats b { display: inline-block; }

#fx { position: absolute; inset: 0; pointer-events: none; }
#token { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #fff; border: 3px solid #2f6fdd; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: left linear, top linear; z-index: 5; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
#token[hidden] { display: none; }
#token.fever { border-color: var(--fever); box-shadow: 0 0 16px 5px rgba(255, 154, 60, .85); animation: glow .5s infinite alternate; }
#token.fever.f2 { box-shadow: 0 0 22px 9px rgba(255, 140, 40, .9); }
#token.fever.f3, #token.fever.f4 { box-shadow: 0 0 30px 14px rgba(255, 90, 30, .95); animation-duration: .25s; }
@keyframes glow { from { transform: scale(1); } to { transform: scale(1.22); } }
.pop { position: absolute; transform: translate(-50%, -50%); z-index: 6; text-align: center; white-space: nowrap; animation: rise 1.6s forwards; background: rgba(15, 17, 21, .88); border-radius: 8px; padding: 3px 9px; border: 1px solid var(--line); }
.pop b { display: block; color: var(--gold); line-height: 1.1; }
.pop .f { display: block; font-size: 12px; color: #dfe3ec; } .pop .s { display: block; font-size: 12px; font-weight: 700; }
.pop .via { display: block; font-size: 11px; color: var(--ice); font-style: normal; }
.pop.big { border-color: var(--gold); animation-name: risebig; } .pop.huge { border-color: #ff6a2a; animation-name: risehuge; } .pop.huge b { color: #ffb14a; text-shadow: 0 0 12px #ff6a2a; }
.pop.refuse { border-color: var(--bad); } .pop.refuse b { color: var(--bad); font-size: 14px; }
.pop.growpop { border-color: var(--good); animation-name: risegrow; } .pop.growpop b { color: var(--good); font-size: 13px; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -95%); } }
@keyframes risebig { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.35); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }
@keyframes risehuge { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1.7) rotate(-4deg); } 20% { transform: translate(-50%, -50%) scale(1.2) rotate(3deg); } 30% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -130%); } }
@keyframes risegrow { 0% { opacity: 0; transform: translate(-50%, 0); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -120%); } }

/* ── 보드 가운데 ── */
#center { border-radius: 8px; background: #191c22; border: 1px solid var(--line); padding: 10px 12px; overflow: hidden; }
#center .info h2 { font-size: 18px; } #center .info p { margin: 4px 0; font-size: 13px; }
#center .sends { margin: 4px 0; padding: 0; list-style: none; font-size: 13px; } #center .sends b { color: var(--gold); }
.info.judge.pass h2 { color: var(--good); } .info.judge.failj h2 { color: var(--bad); }
.info.judge button { margin-top: 6px; }
.hud-head { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 14px; }
.hud-head .lapno { margin-left: auto; font-weight: 700; } .hud.fever .lapno { color: var(--fever); }
.hud-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; flex-wrap: wrap; }
.hud-row b { font-size: 16px; font-variant-numeric: tabular-nums; }
.gauge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
.gauge i { font-style: normal; } .gauge .gr { color: #f0923b; } .gauge .gl { color: #7fb3ff; }
.gtrack { position: relative; width: 70px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #35507e, #2a2e37 50%, #7e4d22); }
.gtrack::after { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 14px; background: #777; }
.gtrack em { position: absolute; top: -4px; width: 10px; height: 16px; margin-left: -5px; border-radius: 3px; background: #fff; transition: left .2s; }
.hungry { color: #f0923b; } .fullv { color: #7fb3ff; }
.state { font-weight: 800; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
.state.drunk { background: #6b3fb8; } .state.full { background: #2f5fa8; }
.pips { display: inline-flex; gap: 2px; } .pips i { width: 7px; height: 12px; border-radius: 2px; background: #3a4150; } .pips i.on { background: #ff7fa5; }
.sums { border-top: 1px solid var(--line); padding-top: 5px; } .sums b { color: var(--gold); }
.banner { margin-top: 5px; font-size: 12px; line-height: 1.4; border-radius: 6px; padding: 0 8px; }
.banner:not(:empty) { padding: 5px 8px; background: #262b35; border-left: 3px solid var(--dim); }
.banner.extra { border-color: var(--fever); background: #3a2a1a; } .banner.extra b { color: var(--fever); }
.banner.leave { border-color: var(--bad); }

/* ── 아래 줄: 후보 / 드워프 ── */
#tray { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; width: calc(4 * var(--tw) + 46px); min-height: 190px; }
.cands, .dwarves { display: flex; gap: 6px; flex: 1; }
.cand { position: relative; flex: 1; min-width: 0; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 10px 6px 34px; cursor: pointer; overflow: hidden; }
.cand[draggable="true"] { cursor: grab; }
.cand .kbar { position: absolute; left: 0; top: 0; right: 0; height: 6px; display: flex; } .cand .kbar i { flex: 1; background: #70757f; }
.cand.support { background: #2a2d33; }
.cand.none { display: flex; align-items: center; justify-content: center; color: #596275; border-style: dashed; background: transparent; cursor: default; }
.cand.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 87, .45); }
.cand.frozen { border-color: var(--ice); background: #22323d; box-shadow: inset 0 0 18px rgba(127, 212, 255, .3); }
.cname { font-weight: 700; font-size: 13px; } .ckind { font-size: 11px; color: var(--dim); }
.cfee { font-size: 12px; margin: 2px 0; } .cfee b { color: var(--gold); font-size: 16px; }
.rar-common { color: #b9bec9; } .rar-uncommon { color: #7fd4ff; font-weight: 700; } .rar-rare { color: #ffb14a; font-weight: 700; }
.ctext { font-size: 11px; line-height: 1.3; color: #c2c7d2; }
.freeze { position: absolute; left: 5px; right: 5px; bottom: 5px; padding: 2px 4px; font-size: 11px; }
.cand.frozen .freeze { border-color: var(--ice); color: var(--ice); }
.actions { width: 138px; flex: none; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.actions.wide { width: auto; } .actions small { font-size: 11px; line-height: 1.3; }
.builds { text-align: center; } .builds b { font-size: 20px; color: var(--gold); }
.speed { display: flex; gap: 3px; align-items: center; font-size: 12px; } .speed button { padding: 4px 7px; } .speed button.on { background: #2f6fdd; border-color: #4a86ee; }
.dwarf { flex: 1; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.dwarf.pickable:hover { border-color: #fff; }
.dwarf.chosen { border-color: var(--gold); } .dwarf.gone { opacity: .35; }
.dname { font-weight: 800; font-size: 15px; } .dtaste { font-size: 11px; color: var(--dim); }
.drow { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.dfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--dim); }
.dfoot .pv { color: #ffb36b; font-weight: 700; } .dfoot button { margin-left: auto; }

/* ── 오른쪽: 살펴보기, 기록 ── */
#detail { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; height: 218px; overflow: auto; flex: none; }
#detail p { margin: 4px 0; font-size: 13px; } #detail .cur { color: var(--gold); font-weight: 700; }
.calc { border-collapse: collapse; font-size: 13px; margin: 4px 0; } .calc th { text-align: left; color: var(--dim); font-weight: 400; padding: 1px 10px 1px 0; white-space: nowrap; vertical-align: top; }
.calc b { color: var(--gold); }
#log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 6px 14px; }
#log-wrap h3 { font-size: 14px; } #log-wrap .hint { font-weight: 400; font-size: 11px; color: var(--dim); margin-left: 6px; }
#log { flex: 1; overflow-y: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.line { padding: 2px 0; border-bottom: 1px solid #262b34; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.line .lt { color: var(--dim); width: 78px; flex: none; } .line .lf { color: #cfd5e2; } .line .lp { color: var(--gold); font-weight: 700; } .line .ls { color: #8f98aa; } .line .lr { color: var(--bad); font-weight: 700; }
.line.head { margin-top: 6px; color: #9cc2ff; border-bottom-color: #3b4660; display: block; } .line.tail { color: var(--text); display: block; background: #232832; }
.line.mark { color: var(--good); display: block; } .line.prepl { color: #b6bccb; display: block; }
.line.lap { background: #20242c; } .line.lap.extra .ls { color: var(--fever); } .line.lap.leave .ls { color: #d99; }
.line.growl .ls { color: var(--good); }

/* ── 창 ── */
#modal { display: none; } #modal.open { display: flex; position: fixed; inset: 0; background: rgba(0, 0, 0, .62); align-items: center; justify-content: center; z-index: 20; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; width: 860px; max-height: 90vh; overflow: auto; }
.sheet.settings { width: 620px; }
.sheet table { border-collapse: collapse; margin: 10px 0; } .sheet td, .sheet th { padding: 4px 12px 4px 0; text-align: left; font-size: 13px; }
.sheet th { color: var(--dim); font-weight: 400; }
.barcell { white-space: nowrap; min-width: 190px; } .b { display: inline-block; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 4px; } .b.like { background: #ff7fa5; } .b.hate { background: #7c8aa3; }
.targets td { text-align: right; padding: 3px 14px; border-left: 1px solid var(--line); } .targets .cur { color: var(--gold); }
details { margin: 6px 0; } summary { cursor: pointer; color: #9cc2ff; }
.deckgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.mini { background: var(--panel2); border-radius: 6px; padding: 5px 6px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; } .mini .chip { font-size: 11px; padding: 0 4px; margin: 0 1px; }
.mfoot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 14px; }
.sw { display: block; padding: 9px 0; border-bottom: 1px solid var(--line); } .sw small { display: block; margin-top: 2px; }
.sw input[type=checkbox] { transform: scale(1.3); margin-right: 6px; }
#seed-in { font: inherit; font-family: ui-monospace, monospace; background: #14161a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 140px; }
.result { width: 100%; } .result td.l { font-size: 12px; color: #c2c7d2; } .result tr.bad td { color: var(--bad); } .big { font-size: 24px; color: var(--gold); }

#toasts { position: fixed; top: 64px; left: 400px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 30; pointer-events: none; }
.toast { background: #2a2f3a; border: 1px solid var(--line); border-radius: 8px; padding: 7px 16px; font-weight: 700; animation: toast 2.6s forwards; box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
.toast.goal { border-color: var(--good); color: var(--good); font-size: 18px; } .toast.record { border-color: var(--gold); color: var(--gold); font-size: 18px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px) scale(.8); } 8% { opacity: 1; transform: scale(1.08); } 14% { transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }

html, body { height: 100%; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
</style>
<div id="app">
    <header id="top"></header>
    <main>
      <section id="left">
        <div id="board"></div>
        <div id="tray"></div>
      </section>
      <aside id="side">
        <div id="detail"></div>
        <div id="log-wrap">
          <h3>기록 <span class="hint">칸 · 건물 · 계산식 · 낸 돈 · 스택과 만족도의 변화</span></h3>
          <div id="log"></div>
        </div>
      </aside>
    </main>
    <div id="modal"></div>
    <div id="toasts"></div>

<script type="module">

// 욜로드워프 계산 엔진. 제작 요청서 5.5~5.8절.
// 화면과 무관한 순수 계산이다. DOM도 무작위도 쓰지 않는다.
// prepareBoard(board)      → 지원 효과를 정리한 값 (5.5)
// simulateDwarf(prep, ...) → 드워프 한 마리의 수입과 "어느 칸에서 얼마를 왜 냈는지"의 기록 (5.7, 5.8)
// simulateWave(board, ...) → 보낸 순서대로, 마친 바퀴 수 g가 이어진다 (5.6)

function makeEngine(data) {
  const cfg = data.config;
  const N = cfg.boardSize;
  const byName = new Map(data.buildings.map(b => [b.name, b]));
  const dwarfByName = new Map(data.dwarves.map(d => [d.name, d]));
  const prev = i => (i - 1 + N) % N;
  const next = i => (i + 1) % N;
  const isShop = name => name != null && byName.get(name).group === 'shop';
  const hasKind = (name, kind) => byName.get(name).kinds.includes(kind);
  const isRepeater = name => name != null && byName.get(name).effect.type === 'repeatAdjacentSupports';

  // 5.5 지원 효과 정리하기. board는 길이 N의 배열(건물 이름 또는 null).
  function prepareBoard(board) {
    const shops = [];
    for (let i = 0; i < N; i++) if (isShop(board[i])) shops.push(i);
    // (1) 변전소 배수
    const m = new Array(N).fill(1);
    for (let i = 0; i < N; i++) {
      const name = board[i];
      if (name == null || isShop(name) || isRepeater(name)) continue;
      m[i] = 1 + [prev(i), next(i)].filter(j => isRepeater(board[j])).length;
    }
    const supports = [];
    for (let i = 0; i < N; i++) {
      const name = board[i];
      if (name != null && !isShop(name)) supports.push({ i, name, e: byName.get(name).effect, m: m[i] });
    }
    const adjacentShops = i => [prev(i), next(i)].filter(j => isShop(board[j]));
    const within2 = i => [...new Set([prev(prev(i)), prev(i), next(i), next(next(i))])].filter(j => isShop(board[j]));

    // 화면이 "무엇이 어디에 걸렸는지"를 보여 줄 수 있게 남기는 기록. 계산에는 쓰지 않는다.
    const sources = Array.from({ length: N }, () => []);   // 칸마다: 이 칸에 걸린 지원
    const targets = Array.from({ length: N }, () => []);   // 칸마다: 이 칸의 지원이 닿는 칸
    const note = (s, j, type, value) => { sources[j].push({ from: s.i, name: s.name, type, value, m: s.m }); targets[s.i].push(j); };

    // (2) 요금
    const fee = new Array(N).fill(0);
    for (const i of shops) fee[i] = byName.get(board[i]).fee;
    for (const s of supports) {
      const e = s.e;
      if (e.type === 'feeAdjacent') for (const j of adjacentShops(s.i)) { fee[j] += e.amount * s.m; note(s, j, 'fee', e.amount * s.m); }
      else if (e.type === 'feeAll') for (const j of shops) { fee[j] += e.amount * s.m; note(s, j, 'fee', e.amount * s.m); }
      else if (e.type === 'feeKindWithin2') { for (const j of within2(s.i)) if (hasKind(board[j], e.kind)) { fee[j] += e.amount * s.m; note(s, j, 'fee', e.amount * s.m); } }
      else if (e.type === 'feeBuildingAll') { for (const j of shops) if (board[j] === e.building) { fee[j] += e.amount * s.m; note(s, j, 'fee', e.amount * s.m); } }
    }
    // (3) 요금이 가장 높은 건물. 같으면 칸 번호가 작은 쪽
    let top = null;
    for (const i of shops) if (top === null || fee[i] > fee[top]) top = i;
    // (4) 곱, (5) 한 번 더, (6) 성장
    const mult = new Array(N).fill(1);
    const again = new Array(N).fill(0);
    const growFee = new Array(N).fill(0);
    const growMult = new Array(N).fill(0);
    for (const s of supports) {
      const e = s.e;
      if (e.type === 'multAdjacent') for (const j of adjacentShops(s.i)) { mult[j] *= e.mult ** s.m; note(s, j, 'mult', e.mult ** s.m); }
      else if (e.type === 'multKindAll') { for (const j of shops) if (hasKind(board[j], e.kind)) { mult[j] *= e.mult ** s.m; note(s, j, 'mult', e.mult ** s.m); } }
      else if (e.type === 'multBuildingAll') { for (const j of shops) if (board[j] === e.building) { mult[j] *= e.mult ** s.m; note(s, j, 'mult', e.mult ** s.m); } }
      else if (e.type === 'multTop') { if (top !== null) { mult[top] *= e.mult ** s.m; note(s, top, 'mult', e.mult ** s.m); } }
      else if (e.type === 'againPrevious') { if (isShop(board[prev(s.i)])) { again[prev(s.i)] += s.m; note(s, prev(s.i), 'again', s.m); } }
      else if (e.type === 'againKindAdjacent') { for (const j of adjacentShops(s.i)) if (hasKind(board[j], e.kind)) { again[j] += s.m; note(s, j, 'again', s.m); } }
      else if (e.type === 'growFeeAll') for (const j of shops) { growFee[j] += e.amountPerLap * s.m; note(s, j, 'growFee', e.amountPerLap * s.m); }
      else if (e.type === 'growFeeAdjacent') for (const j of adjacentShops(s.i)) { growFee[j] += e.amountPerLap * s.m; note(s, j, 'growFee', e.amountPerLap * s.m); }
      else if (e.type === 'growMultAdjacent') for (const j of adjacentShops(s.i)) { growMult[j] += e.addPerLap * s.m; note(s, j, 'growMult', e.addPerLap * s.m); }
      else if (e.type === 'growMultTop') { if (top !== null) { growMult[top] += e.addPerLap * s.m; note(s, top, 'growMult', e.addPerLap * s.m); } }
      else if (e.type === 'useTopHere') { if (top !== null) note(s, top, 'branch', s.m); }
      else if (e.type === 'repeatAdjacentSupports') {
        for (const j of [prev(s.i), next(s.i)]) if (board[j] != null && !isShop(board[j]) && !isRepeater(board[j])) { sources[j].push({ from: s.i, name: s.name, type: 'repeat', value: 1, m: 1 }); targets[s.i].push(j); }
      }
    }
    return { board, shops, supportMult: m, fee, mult, again, growFee, growMult, top, sources, targets };
  }

  // 5.6 그 바퀴의 요금과 곱. g는 이 웨이브에서 마친 바퀴 수.
  const feeAt = (prep, i, g) => prep.fee[i] + prep.growFee[i] * g;
  const multAt = (prep, i, g) => prep.mult[i] * (1 + prep.growMult[i] * g);

  // 5.7, 5.8 드워프 한 마리. lapsDoneBefore는 이 웨이브에서 지금까지 마친 바퀴 수(5.6의 g).
  function simulateDwarf(prep, dwarfName, lapsDoneBefore = 0, options = {}) {
    const dwarf = dwarfByName.get(dwarfName);
    const useDislike = options.dislike !== false;
    const board = prep.board;
    let gauge = 0, drunk = 0, hype = 0;       // 눈금(양수 허기짐, 음수 포만감), 취함, 흥
    let satisfaction = 0, lapCost = cfg.lapCostStart;
    let laps = 0, income = 0;
    const incomePerLap = [], events = [];

    function useOnce(tile, shopTile, lap, feeNow, multNow, countsSatisfaction, via) {
      const b = byName.get(board[shopTile]);
      const e = b.effect;
      const before = { gauge, drunk, hype, satisfaction };
      // 1. 받지 않는 조건
      if (b.refuses === 'drunk' && drunk >= cfg.drunkThreshold) { events.push({ type: 'refused', lap, tile, shopTile, building: b.name, reason: 'drunk', via, before }); return false; }
      if (b.refuses === 'full' && -gauge >= cfg.fullThreshold) { events.push({ type: 'refused', lap, tile, shopTile, building: b.name, reason: 'full', via, before }); return false; }
      // 2. 더하기 (이용 직전의 스택)
      const hunger = Math.max(0, gauge);
      let add = (e.feePerHunger ?? 0) * hunger + (e.feePerDrunk ?? 0) * drunk + (e.feePerHype ?? 0) * hype;
      if (e.consumeAllHypeFeePer) add += e.consumeAllHypeFeePer * hype;
      const terms = [];
      if (e.feePerHunger) terms.push({ stack: '허기짐', count: hunger, per: e.feePerHunger });
      if (e.feePerDrunk) terms.push({ stack: '취함', count: drunk, per: e.feePerDrunk });
      if (e.feePerHype) terms.push({ stack: '흥', count: hype, per: e.feePerHype });
      if (e.consumeAllHypeFeePer) terms.push({ stack: '흥', count: hype, per: e.consumeAllHypeFeePer });
      // 3. 낸 돈
      let mult = multNow;
      const arcade = e.doubleIfDrunkAtLeast != null && drunk >= e.doubleIfDrunkAtLeast;
      if (arcade) mult *= 2;
      const raw = (feeNow + add) * mult;
      const pay = Math.floor(raw);
      income += pay;
      // 4. 만족도
      let satChange = 0, taste = 'none';
      const liked = b.kinds.some(k => dwarf.likes.includes(k));
      const disliked = b.kinds.includes(dwarf.dislikes);
      if (liked && !disliked) taste = 'like';
      else if (disliked && !liked) taste = 'dislike';
      else if (liked && disliked) taste = 'both';
      if (countsSatisfaction) {
        if (taste === 'like') { satisfaction += cfg.likeSatisfaction; satChange = cfg.likeSatisfaction; }
        else if (taste === 'dislike' && useDislike) { const b4 = satisfaction; satisfaction = Math.max(0, satisfaction + cfg.dislikeSatisfaction); satChange = satisfaction - b4; }
      }
      // 5. 스택을 쓰거나 없앤다
      if (e.consumeAllHypeFeePer) hype = 0;
      if (e.clearDrunk) drunk = 0;
      if (e.clearAll) { gauge = 0; drunk = 0; hype = 0; }
      if (e.reduceDrunk) drunk = Math.max(0, drunk - e.reduceDrunk);
      // 6. 스택을 준다
      gauge += (e.giveHunger ?? 0) - (e.giveFullness ?? 0);
      drunk += e.giveDrunk ?? 0;
      hype += e.giveHype ?? 0;
      events.push({
        type: 'use', lap, tile, shopTile, building: b.name, via,
        fee: feeNow, terms, add, baseMult: multNow, mult, arcadeDoubled: arcade, raw, pay,
        taste, countsSatisfaction, satChange, before, after: { gauge, drunk, hype, satisfaction }, incomeSoFar: income,
      });
      return true;
    }

    while (true) {
      const g = lapsDoneBefore + laps;
      const lap = laps + 1;
      const before = income;
      events.push({ type: 'lapStart', lap, g, extra: laps >= cfg.baseLaps, satisfaction, lapCost });
      for (let i = 0; i < N; i++) {
        const name = board[i];
        if (name == null) continue;
        if (isShop(name)) {
          for (let k = 0; k < 1 + prep.again[i]; k++) if (!useOnce(i, i, lap, feeAt(prep, i, g), multAt(prep, i, g), true, k === 0 ? null : 'again')) break;
        } else if (byName.get(name).effect.type === 'useTopHere' && prep.top !== null) {
          for (let k = 0; k < prep.supportMult[i]; k++) if (!useOnce(i, prep.top, lap, feeAt(prep, prep.top, g), multAt(prep, prep.top, g), false, 'branch')) break;
        }
      }
      laps += 1;
      incomePerLap.push(income - before);
      const stacksBefore = { gauge, drunk, hype };
      gauge = 0; drunk = 0; hype = 0;      // 한 바퀴가 하루다
      const end = { type: 'lapEnd', lap, g: lapsDoneBefore + laps, lapIncome: income - before, incomeSoFar: income, stacksBefore, satisfactionBefore: satisfaction };
      if (laps < cfg.baseLaps) { events.push({ ...end, result: 'base', satisfaction, lapCost }); continue; }
      if (satisfaction >= lapCost) {
        satisfaction -= lapCost;
        const paid = lapCost;
        lapCost *= cfg.lapCostGrowth;
        events.push({ ...end, result: 'extra', paid, satisfaction, lapCost });
        continue;
      }
      events.push({ ...end, result: 'leave', needed: lapCost, satisfaction, lapCost });
      break;
    }
    return { dwarf: dwarfName, income, laps, incomePerLap, events, lapsDoneBefore };
  }

  // 5.6 웨이브: 보낸 순서대로, 마친 바퀴 수가 이어진다.
  function simulateWave(board, sendOrder, options = {}) {
    const prep = prepareBoard(board);
    let g = 0;
    const sends = sendOrder.map(name => { const r = simulateDwarf(prep, name, g, options); g += r.laps; return r; });
    return { sends, waveIncome: sends.reduce((a, s) => a + s.income, 0) };
  }

  // 5.9 새로고침 값. pressedThisPrep는 이 정비에서 이미 누른 횟수.
  const refreshCost = (waveIndex, pressedThisPrep) =>
    Math.max(1, Math.floor(cfg.targets[waveIndex] * cfg.refreshBaseRate)) * cfg.refreshGrowth ** pressedThisPrep;

  return { prepareBoard, simulateDwarf, simulateWave, refreshCost, feeAt, multAt, isShop, building: n => byName.get(n), dwarf: n => dwarfByName.get(n) };
}

// 숫자를 화면에 적는 법. 2.5, 6.25, 9.375처럼 필요한 자리까지만.
const fmtNum = x => (Number.isInteger(x) ? String(x) : String(Math.round(x * 1000) / 1000));

// 이용 기록 한 줄을 계산식 글자로. 예: "6 + 허기짐 3 × 8 = 30", "(12 + 0) × 2.5 × 2(만취) = 60"
function formulaText(ev) {
  const terms = ev.terms.filter(t => t.count > 0).map(t => `${t.stack} ${t.count} × ${t.per}`);
  const sum = [fmtNum(ev.fee), ...terms].join(' + ');
  const mults = [];
  if (ev.baseMult !== 1) mults.push(fmtNum(ev.baseMult));
  if (ev.arcadeDoubled) mults.push('2(만취)');
  if (!mults.length) return terms.length ? `${sum} = ${ev.pay}` : `요금 ${ev.pay}`;
  const floored = ev.raw !== ev.pay ? ' (소수 버림)' : '';
  return `${terms.length ? `(${sum})` : sum} × ${mults.join(' × ')} = ${ev.pay}${floored}`;
}

// 눈금 숫자를 글자로. 양수면 허기짐, 음수면 포만감.
const gaugeText = g => (g > 0 ? `허기짐 ${g}` : g < 0 ? `포만감 ${-g}` : '눈금 0');

// ── js/rng.js
// 시드로 다시 만들 수 있는 무작위. 같은 시드 글자 → 같은 수열.
function hash(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

function makeRng(seedText) {
  let a = hash(String(seedText));
  const rand = () => {                    // mulberry32
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    rand,
    int: n => Math.floor(rand() * n),
    shuffle(list) {
      const a2 = list.slice();
      for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; }
      return a2;
    },
    weighted(items, weightOf) {
      const total = items.reduce((s, x) => s + weightOf(x), 0);
      let r = rand() * total;
      for (const x of items) { r -= weightOf(x); if (r < 0) return x; }
      return items[items.length - 1];
    },
  };
}

const randomSeed = () => Math.random().toString(36).slice(2, 8).toUpperCase();

// ── js/game.js
// 한 판의 진행 (5.1, 5.9, 5.10, 5.11). DOM을 쓰지 않는다. 계산은 engine.js에 맡긴다.
// 단계(phase): intro → prep → pick → (send ×3) → judge → prep … → over



function createGame(data, { seed, dislike = true } = {}) {
  const cfg = data.config;
  const engine = makeEngine(data);
  const isSupport = name => !engine.isShop(name);
  // 후보와 드워프는 서로 다른 수열을 쓴다. 새로고침을 몇 번 눌렀든 같은 시드면 드워프 순서가 같다.
  const candRng = makeRng(`${seed}/candidates`);

  const s = {
    seed: String(seed),
    options: { dislike },
    phase: 'intro',
    wave: 0,                                   // 0부터. 화면에는 +1
    money: cfg.startMoney,
    board: new Array(cfg.boardSize).fill(null),
    candidates: new Array(cfg.candidates).fill(null),   // { name, frozen } 또는 null
    buildsLeft: 0,
    refreshCount: 0,
    deck: [], sendIndex: 0, choices: [],
    g: 0,                                      // 이 웨이브에서 마친 바퀴 수 (5.6)
    waveIncome: 0, waveSends: [],
    waveResults: [],                           // 웨이브마다 { wave, income, sends, moneyAfter, target, passed }
    bestSend: null,                            // 이번 판 최고 수입 { income, dwarf, wave }
    judge: null, outcome: null,                // outcome: 'clear' | 'fail'
  };

  const target = () => cfg.targets[s.wave];
  const prep = () => engine.prepareBoard(s.board);

  // 5.9 후보 뽑기. 보드의 지원과 후보 칸에 떠 있는 지원은 풀에서 뺀다.
  function fillSlots(slots) {
    const taken = new Set(s.board.filter(n => n != null && isSupport(n)));
    s.candidates.forEach((c, i) => { if (c && !slots.includes(i) && isSupport(c.name)) taken.add(c.name); });
    for (const i of slots) {
      const pool = data.buildings.filter(b => !(b.group === 'support' && taken.has(b.name)));
      const pick = candRng.weighted(pool, b => b.weight);
      s.candidates[i] = { name: pick.name, frozen: false };
      if (pick.group === 'support') taken.add(pick.name);
    }
  }
  const unfrozenSlots = () => s.candidates.map((c, i) => (c && c.frozen ? -1 : i)).filter(i => i >= 0);

  function enterPrep() {
    s.phase = 'prep';
    s.buildsLeft = cfg.buildsPerPrep;
    s.refreshCount = 0;
    s.judge = null;
    fillSlots(unfrozenSlots());   // 얼린 후보만 남는다 (README "정해야 할 것" 1)
  }

  const refreshCost = () => engine.refreshCost(s.wave, s.refreshCount);
  const canRefresh = () => s.phase === 'prep' && s.money >= refreshCost() && unfrozenSlots().length > 0;
  const canEditBoard = () => s.phase === 'prep' || s.phase === 'pick';

  function deal() {
    s.choices = s.deck.slice(s.sendIndex * cfg.choicesPerSend, (s.sendIndex + 1) * cfg.choicesPerSend);
  }

  const api = {
    state: s, data, engine, cfg,
    target, prep, refreshCost, canRefresh, canEditBoard,

    begin() { if (s.phase !== 'intro') return false; enterPrep(); return true; },

    build(slot, tile) {
      const c = s.candidates[slot];
      if (s.phase !== 'prep' || !c || s.buildsLeft <= 0 || s.board[tile] != null) return false;
      if (isSupport(c.name) && s.board.includes(c.name)) return false;   // 같은 지원은 한 채만 (5.3)
      s.board[tile] = c.name;
      s.candidates[slot] = null;
      s.buildsLeft -= 1;
      return true;
    },

    // 자리 바꾸기: 빈 칸으로 옮기거나 두 건물을 맞바꾼다.
    move(from, to) {
      if (!canEditBoard() || from === to || s.board[from] == null) return false;
      [s.board[from], s.board[to]] = [s.board[to], s.board[from]];
      return true;
    },

    toggleFreeze(slot) {
      const c = s.candidates[slot];
      if (s.phase !== 'prep' || !c) return false;
      c.frozen = !c.frozen;
      return true;
    },

    refresh() {
      if (!canRefresh()) return false;
      s.money -= refreshCost();
      s.refreshCount += 1;
      fillSlots(unfrozenSlots());
      return true;
    },

    startWave() {
      if (s.phase !== 'prep') return false;
      s.phase = 'pick';
      s.deck = makeRng(`${s.seed}/dwarves/${s.wave}`).shuffle(data.dwarves.map(d => d.name));
      s.sendIndex = 0; s.g = 0; s.waveIncome = 0; s.waveSends = [];
      deal();
      return true;
    },

    // 시험용: 지금 보드에서 이 드워프를 보내면 얼마를 버는가.
    preview(choice) {
      const r = engine.simulateDwarf(prep(), s.choices[choice], s.g, s.options);
      return { income: r.income, laps: r.laps };
    },

    // 드워프를 보낸다. 결과(기록 포함)를 돌려주고 상태를 끝까지 진행한다. 화면은 기록을 재생만 한다.
    send(choice) {
      if (s.phase !== 'pick' || !s.choices[choice]) return null;
      const p = prep();
      const result = engine.simulateDwarf(p, s.choices[choice], s.g, s.options);
      const info = { ...result, prep: p, wave: s.wave, sendIndex: s.sendIndex, moneyBefore: s.money, waveIncomeBefore: s.waveIncome, bestBefore: s.bestSend ? s.bestSend.income : 0 };
      s.money += result.income;
      s.g += result.laps;
      s.waveIncome += result.income;
      s.waveSends.push({ dwarf: result.dwarf, income: result.income, laps: result.laps });
      if (!s.bestSend || result.income > s.bestSend.income) s.bestSend = { income: result.income, dwarf: result.dwarf, wave: s.wave };
      s.sendIndex += 1;
      if (s.sendIndex < cfg.sendsPerWave) deal();
      else {
        const passed = s.money >= target();
        s.judge = { passed, cleared: passed && s.wave === cfg.waves - 1, money: s.money, target: target() };
        s.waveResults.push({ wave: s.wave, income: s.waveIncome, sends: s.waveSends, moneyAfter: s.money, target: target(), passed });
        s.choices = [];
        s.phase = 'judge';
      }
      return info;
    },

    // 판정 뒤: 통과면 다음 정비, 다섯째를 통과했거나 모자라면 끝.
    proceed() {
      if (s.phase !== 'judge') return false;
      if (s.judge.passed && !s.judge.cleared) { s.wave += 1; enterPrep(); }
      else { s.outcome = s.judge.cleared ? 'clear' : 'fail'; s.phase = 'over'; }
      return true;
    },
  };
  return api;
}

// ── js/ui.js
// 화면. 엔진이 돌려준 기록을 재생만 한다. 규칙 계산은 하지 않는다.




const $ = id => document.getElementById(id);
const won = n => Math.round(n).toLocaleString('ko-KR');

// ── 데이터 ──────────────────────────────────────────────────
let data;
try {
  // 한 파일로 묶은 판(build-single.mjs)은 데이터를 안에 품고 있다.
  data = globalThis.__YOLO_DATA__ ?? await (await fetch('data/yolodwarf_data.json', { cache: 'no-store' })).json();
} catch (e) {
  document.body.innerHTML = `<p style="padding:24px;color:#fff">데이터 파일(data/yolodwarf_data.json)을 읽지 못했습니다. README의 실행 방법대로 <code>npm start</code>로 열었는지, 파일의 쉼표나 따옴표가 깨지지 않았는지 확인해 주세요.<br><br>${e}</p>`;
  throw e;
}
const cfg = data.config;
const N = cfg.boardSize;
const COLORS = { 초록: '#4fb873', 주황: '#f0923b', 보라: '#a078e8', 빨강: '#e8574e', 분홍: '#f083b8', 노랑: '#e3bf3a', 파랑: '#559fec' };
const ICONS = { 운동: '🏋️', 식당: '🍜', 술집: '🍺', 오락: '🕹️', 공연: '🎤', 상점: '🛍️', 휴식: '🛏️' };
const RARITY = { common: '흔함', uncommon: '보통', rare: '드묾' };
const kindInfo = new Map(data.kinds.map(k => [k.name, k]));
const kindColor = k => COLORS[kindInfo.get(k)?.color] || '#888';
const building = name => data.buildings.find(b => b.name === name);
const dwarfOf = name => data.dwarves.find(d => d.name === name);
const chip = (k, mark = '') => `<span class="chip" style="--c:${kindColor(k)}">${mark}${ICONS[k] || ''} ${k}</span>`;

// ── 저장되는 것: 역대 최고, 시험용 스위치 ─────────────────────
const store = {
  get(key, fallback) { try { const v = localStorage.getItem('yolodwarf.' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, v) { try { localStorage.setItem('yolodwarf.' + key, JSON.stringify(v)); } catch { /* 저장이 막힌 브라우저 */ } },
};
const settings = { preview: false, dislike: true, ...store.get('settings', {}) };
let allTimeBest = store.get('best', null);       // { income, dwarf, seed }

// ── 화면 상태 ────────────────────────────────────────────────
let game;
const ui = { sel: null, hover: null, playing: false, play: null, speed: store.get('speed', 1), skip: false, wake: null, modal: null, drag: null };

function newGame(seed) {
  game = createGame(data, { seed: seed || randomSeed(), dislike: settings.dislike });
  Object.assign(ui, { sel: null, hover: null, playing: false, play: null, skip: false, modal: 'intro' });
  $('log').innerHTML = '';
  try { history.replaceState(null, '', '?seed=' + encodeURIComponent(game.state.seed)); } catch { /* 주소를 못 바꾸는 곳 */ }
  render();
}

// ── 보드의 칸 자리: 사각 고리. 0번이 왼쪽 위, 시계 방향 ───────
const COLS = Math.ceil((N + 4) / 4), ROWS = (N + 4) / 2 - COLS;
function tilePos(i) {
  if (i < COLS) return { r: 1, c: i + 1, dir: i === COLS - 1 ? '↓' : '→' };
  if (i < COLS + ROWS - 1) return { r: i - COLS + 2, c: COLS, dir: i === COLS + ROWS - 2 ? '←' : '↓' };
  if (i < 2 * COLS + ROWS - 2) return { r: ROWS, c: COLS - (i - (COLS + ROWS - 2)), dir: i === 2 * COLS + ROWS - 3 ? '↑' : '←' };
  return { r: ROWS - (i - (2 * COLS + ROWS - 3)), c: 1, dir: i === N - 1 ? '→' : '↑' };
}

// ── 그리기 ──────────────────────────────────────────────────
function render() {
  ui.prep = ui.playing ? ui.play.info.prep : game.prep();
  renderTop(); renderBoard(); renderCenter(); renderTray(); renderDetail(); renderModal(); applyHighlights();
}

function renderTop() {
  const s = game.state, P = ui.play;
  const money = P ? P.money : s.money, target = game.target();
  const best = P ? Math.max(P.info.bestBefore, P.total) : (s.bestSend ? s.bestSend.income : 0);
  const pct = Math.min(100, (money / target) * 100);
  $('top').innerHTML = `
    <div class="brand">욜로드워프 <small>데모</small></div>
    <div class="stat"><label>웨이브</label><b>${s.wave + 1}</b><small>/ ${cfg.waves}</small></div>
    <div class="stat money ${money >= target ? 'hit' : ''}"><label>가진 돈 / 목표</label><b id="money">${won(money)}</b><small>/ ${won(target)}</small>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="stat"><label>이번 판 최고 수입</label><b>${won(best)}</b></div>
    <div class="stat"><label>역대 최고</label><b>${won(Math.max(P ? P.allBefore : allTimeBest ? allTimeBest.income : 0, best))}</b></div>
    <div class="grow"></div>
    ${settings.preview || !settings.dislike ? '<span class="flag">시험용 스위치 켜짐</span>' : ''}
    <button data-act="deck">덱 30마리</button>
    <button data-act="settings">설정</button>
    <button data-act="restart">새 판</button>
    <div class="seed" title="같은 시드를 설정에 넣으면 같은 판을 다시 한다">시드 <b>${s.seed}</b></div>`;
}

function tileStats(i, g) {
  const p = ui.prep, e = game.engine;
  const fee = e.feeAt(p, i, g), mult = e.multAt(p, i, g);
  return `<span class="fee" data-v="${fee}">요금 <b>${fmtNum(fee)}</b></span>` +
    (mult !== 1 ? `<span class="mult" data-v="${mult}">×<b>${fmtNum(mult)}</b></span>` : '') +
    (p.again[i] ? `<span class="again">+${p.again[i]}회</span>` : '');
}
const viewG = () => (ui.play ? ui.play.g : game.state.phase === 'pick' ? game.state.g : 0);

function renderBoard() {
  const s = game.state, p = ui.prep, g = viewG();
  const canEdit = game.canEditBoard() && !ui.playing;
  let html = '';
  for (let i = 0; i < N; i++) {
    const pos = tilePos(i), name = s.board[i], b = name && building(name);
    const style = `grid-row:${pos.r};grid-column:${pos.c}`;
    const no = `<span class="tno">${i === 0 ? '0 · 입구' : i}</span><span class="arrow">${pos.dir}</span><span class="taste"></span>`;
    if (!b) { html += `<div class="tile empty" data-tile="${i}" style="${style}">${no}<span class="plus">빈 칸</span></div>`; continue; }
    if (b.group === 'shop') {
      const grow = [p.growFee[i] ? `요금 +${fmtNum(p.growFee[i])}` : '', p.growMult[i] ? `배수 +${fmtNum(p.growMult[i])}` : ''].filter(Boolean).join(' · ');
      html += `<div class="tile shop ${p.top === i ? 'top' : ''}" data-tile="${i}" style="${style}" draggable="${canEdit}">
        <div class="kbar">${b.kinds.map(k => `<i style="background:${kindColor(k)}"></i>`).join('')}</div>${no}
        <div class="tname">${b.kinds.map(k => ICONS[k] || '').join('')} ${b.name}</div>
        <div class="tkind">${b.kinds.join(' + ')}${p.top === i ? ' <em class="star">★ 최고 요금</em>' : ''}</div>
        <div class="tstats">${tileStats(i, g)}</div>
        ${grow ? `<div class="tgrow">▲ 바퀴마다 ${grow}</div>` : ''}</div>`;
    } else {
      html += `<div class="tile support" data-tile="${i}" style="${style}" draggable="${canEdit}">
        <div class="kbar"><i></i></div>${no}
        <div class="tname">⚙️ ${b.name}</div>
        <div class="tkind">지원 · ${RARITY[b.rarity] || ''}${p.supportMult[i] > 1 ? ` <em class="boost">효과 ×${p.supportMult[i]}</em>` : ''}</div>
        <div class="ttext">${b.text}</div></div>`;
    }
  }
  html += `<div id="center" style="grid-row:2/${ROWS};grid-column:2/${COLS}"></div><div id="fx"><div id="token" hidden>🧔</div></div>`;
  $('board').innerHTML = html;
  $('board').className = ui.play && ui.play.fever ? `fever f${Math.min(ui.play.fever, 4)}` : '';
  if (ui.play && ui.play.tile >= 0) placeToken(ui.play.tile, 0);
}

function stackHud(P) {
  const { gauge, drunk, hype } = P.stacks;
  const drunkOn = drunk >= cfg.drunkThreshold, fullOn = -gauge >= cfg.fullThreshold;
  const pos = Math.max(-6, Math.min(6, gauge));
  return `<div class="hud-row"><span class="gauge" title="허기짐과 포만감은 한 눈금의 양 끝">
      <i class="gl">포만감</i><span class="gtrack"><em style="left:${50 + pos * (50 / 6)}%"></em></span><i class="gr">허기짐</i></span>
      <b class="${gauge > 0 ? 'hungry' : gauge < 0 ? 'fullv' : ''}">${gaugeText(gauge)}</b>${fullOn ? '<span class="state full">배부름</span>' : ''}
      <span class="st">🍺 취함 <b>${drunk}</b></span>${drunkOn ? '<span class="state drunk">만취</span>' : ''}<span class="st">🎵 흥 <b>${hype}</b></span></div>`;
}

function renderCenter() {
  const s = game.state, P = ui.play, c = $('center');
  if (!c) return;
  if (P) {
    const d = dwarfOf(P.info.dwarf);
    const need = P.lap < cfg.baseLaps ? null : P.lapCost;
    c.innerHTML = `<div class="hud ${P.fever ? 'fever' : ''}">
      <div class="hud-head"><b>🧔 ${d.name}</b>
        <span class="lapno">${P.fever ? `🔥 추가 바퀴 ${P.fever}` : `바퀴 ${P.lap}`}</span></div>
      ${stackHud(P)}
      <div class="hud-row sat"><span class="st">😊 만족도 <b id="satv">${P.sat}</b></span>
        <span class="st">다음 한 바퀴 값 <b>${P.lapCost}</b></span>
        <span class="pips">${Array.from({ length: Math.min(P.lapCost, 12) }, (_, k) => `<i class="${k < P.sat ? 'on' : ''}"></i>`).join('')}</span>
        ${need == null ? '<small>첫 바퀴는 무조건 한 바퀴 더</small>' : ''}</div>
      <div class="hud-row sums"><span>이번 드워프 <b>${won(P.total)}</b></span><span>이번 웨이브 <b>${won(P.waveIncome)}</b></span><span>마친 바퀴 g <b>${P.g}</b></span></div>
      <div class="banner ${P.banner ? P.banner.cls : ''}">${P.banner ? P.banner.html : ''}</div></div>`;
    return;
  }
  const sends = s.waveSends.map((x, i) => `<li>${i + 1}. ${x.dwarf} <b>${won(x.income)}</b> <small>${x.laps}바퀴</small></li>`).join('');
  if (s.phase === 'prep') {
    c.innerHTML = `<div class="info"><h2>정비 <small>웨이브 ${s.wave + 1} 준비</small></h2>
      <p>후보를 골라 빈 칸에 짓는다. <b>남은 건설 ${s.buildsLeft} / ${cfg.buildsPerPrep}</b></p>
      <p class="dim">후보를 끌어다 놓거나, 후보를 누른 뒤 빈 칸을 누른다.<br>지은 건물은 끌어서 자리를 바꾼다(무료, 횟수 제한 없음).<br>드워프는 <b>입구(0번)</b>에서 화살표 방향으로 돈다.</p></div>`;
  } else if (s.phase === 'pick') {
    c.innerHTML = `<div class="info"><h2>웨이브 ${s.wave + 1} <small>보내기 ${s.sendIndex + 1} / ${cfg.sendsPerWave}</small></h2>
      <p>아래 셋 가운데 하나를 골라 보낸다. 안 고른 둘은 버려진다.</p>
      <ul class="sends">${sends}</ul>
      <p class="dim">이번 웨이브에 번 돈 <b>${won(s.waveIncome)}</b> · 마친 바퀴 g <b>${s.g}</b>${s.g ? ' (성장 지원이 그만큼 자라 있다)' : ''}<br>고르기 전에 자리 바꾸기를 할 수 있다.</p></div>`;
  } else if (s.phase === 'judge') {
    const j = s.judge;
    c.innerHTML = `<div class="info judge ${j.passed ? 'pass' : 'failj'}"><h2>${j.cleared ? '🎉 클리어!' : j.passed ? `✅ 웨이브 ${s.wave + 1} 통과` : `💀 웨이브 ${s.wave + 1} 실패`}</h2>
      <p>가진 돈 <b>${won(j.money)}</b> / 목표 <b>${won(j.target)}</b>${j.passed ? '' : ` — ${won(j.target - j.money)} 모자라다`}</p>
      <ul class="sends">${sends}</ul>
      <button class="primary" data-act="proceed">${j.passed && !j.cleared ? '다음 정비로' : '결과 보기'}</button></div>`;
  } else c.innerHTML = '';
}

function buildingCard(b) {
  return b.group === 'shop'
    ? `<div class="kbar">${b.kinds.map(k => `<i style="background:${kindColor(k)}"></i>`).join('')}</div>
       <div class="cname">${b.name}</div><div class="ckind">${b.kinds.map(k => (ICONS[k] || '') + k).join(' + ')}</div>
       <div class="cfee">요금 <b>${b.fee}</b></div><div class="ctext">${b.text}</div>`
    : `<div class="kbar"><i></i></div><div class="cname">⚙️ ${b.name}</div><div class="ckind">지원</div>
       <div class="cfee rar-${b.rarity}">${RARITY[b.rarity] || ''}</div><div class="ctext">${b.text}</div>`;
}

function dwarfCard(name, i, extra = '') {
  const d = dwarfOf(name);
  return `<div class="dwarf ${extra}" data-dwarf="${i}" data-name="${name}">
    <div class="dname">🧔 ${d.name}</div>
    <div class="dtaste">${d.likes.map(k => kindInfo.get(k).taste).join(' · ')}</div>
    <div class="drow"><span class="mark like">♥ 좋아함</span>${d.likes.map(k => chip(k)).join('')}</div>
    <div class="drow"><span class="mark hate">✕ 싫어함</span>${chip(d.dislikes)}</div>`;
}

function renderTray() {
  const s = game.state, t = $('tray');
  if (ui.playing) {
    const P = ui.play;
    t.innerHTML = `<div class="dwarves">${P.choices.map((n, i) => dwarfCard(n, i, n === P.info.dwarf ? 'chosen' : 'gone') + `<div class="dfoot">${n === P.info.dwarf ? '도는 중…' : '버려짐'}</div></div>`).join('')}</div>
      <div class="actions"><div class="speed">배속 ${[1, 2, 4].map(x => `<button data-act="speed" data-x="${x}" class="${ui.speed === x ? 'on' : ''}">${x}배</button>`).join('')}</div>
      <button data-act="skip">건너뛰기 ⏭</button><small>건너뛰어도 결과는 같다</small></div>`;
  } else if (s.phase === 'prep') {
    const cost = game.refreshCost();
    t.innerHTML = `<div class="cands">${s.candidates.map((c, i) => c
      ? `<div class="cand ${building(c.name).group} ${c.frozen ? 'frozen' : ''} ${ui.sel?.type === 'cand' && ui.sel.slot === i ? 'sel' : ''}" data-cand="${i}" draggable="${s.buildsLeft > 0}">
          ${buildingCard(building(c.name))}<button class="freeze" data-act="freeze" data-slot="${i}">${c.frozen ? '❄️ 얼림 (풀기)' : '얼리기'}</button></div>`
      : '<div class="cand none">지음</div>').join('')}</div>
      <div class="actions"><div class="builds">남은 건설 <b>${s.buildsLeft}</b> / ${cfg.buildsPerPrep}</div>
      <button data-act="refresh" ${game.canRefresh() ? '' : 'disabled'}>🔄 새로고침 <b>${won(cost)}</b></button>
      <button class="primary" data-act="startWave">웨이브 ${s.wave + 1} 시작 ▶</button></div>`;
  } else if (s.phase === 'pick') {
    t.innerHTML = `<div class="dwarves">${s.choices.map((n, i) => {
      const pv = settings.preview ? game.preview(i) : null;
      return dwarfCard(n, i, 'pickable') + `<div class="dfoot">${pv ? `<span class="pv">예상 ${won(pv.income)} · ${pv.laps}바퀴</span>` : ''}<button class="primary" data-act="send" data-i="${i}">보내기</button></div></div>`;
    }).join('')}</div>
      <div class="actions"><div class="builds">보내기 <b>${s.sendIndex + 1}</b> / ${cfg.sendsPerWave}</div><small>카드에 마우스를 올리면 좋아하는 건물(♥)과 싫어하는 건물(✕)이 보드에 표시된다</small></div>`;
  } else t.innerHTML = `<div class="actions wide"><small>${s.phase === 'judge' ? '판정 결과는 보드 가운데에 있다.' : ''}</small></div>`;
}

// ── 살펴보기 창 ──────────────────────────────────────────────
function detailTile(i) {
  const s = game.state, p = ui.prep, name = s.board[i];
  if (!name) return `<h3>${i}번 칸 <small>빈 칸</small></h3><p class="dim">드워프는 그냥 지나간다.</p>`;
  const b = building(name), src = p.sources[i], g = viewG();
  const from = x => `${x.name}<small>(${x.from}번 칸${x.m > 1 ? `, 변전소 ×${x.m}` : ''})</small>`;
  if (b.group === 'support') {
    const t = p.targets[i];
    return `<h3>⚙️ ${b.name} <small>${i}번 칸 · 지원 · ${RARITY[b.rarity]}</small></h3><p>${b.text}</p>
      ${p.supportMult[i] > 1 ? `<p class="good">변전소가 옆에 있어 효과가 ${p.supportMult[i]}번 걸린다.</p>` : ''}
      <p>닿는 칸: ${t.length ? t.map(j => `<b>${j}번 ${s.board[j]}</b>`).join(', ') : '<span class="dim">지금은 없다</span>'}</p>`;
  }
  const fees = src.filter(x => x.type === 'fee'), mults = src.filter(x => x.type === 'mult');
  const agains = src.filter(x => x.type === 'again'), gf = src.filter(x => x.type === 'growFee'), gm = src.filter(x => x.type === 'growMult'), br = src.filter(x => x.type === 'branch');
  const e = game.engine;
  let h = `<h3>${b.name} <small>${i}번 칸</small> ${b.kinds.map(k => chip(k)).join('')}</h3><p>${b.text}</p><table class="calc">`;
  h += `<tr><th>요금</th><td>기본 ${b.fee}${fees.map(x => ` + ${from(x)} ${x.value}`).join('')}${fees.length ? ` = <b>${p.fee[i]}</b>` : ''}</td></tr>`;
  h += `<tr><th>곱</th><td>${mults.length ? mults.map(x => `${from(x)} ×${fmtNum(x.value)}`).join(' · ') + ` = <b>×${fmtNum(p.mult[i])}</b>` : '<span class="dim">×1</span>'}</td></tr>`;
  h += `<tr><th>한 번 더</th><td>${agains.length ? agains.map(x => `${from(x)} +${x.value}`).join(' · ') + ` → 한 번 올 때 <b>${1 + p.again[i]}번</b> 이용` : '<span class="dim">없음</span>'}</td></tr>`;
  if (gf.length || gm.length) h += `<tr><th>성장</th><td>${[...gf.map(x => `${from(x)} 요금 +${fmtNum(x.value)}`), ...gm.map(x => `${from(x)} 배수 +${fmtNum(x.value)}`)].join(' · ')} <small>(바퀴마다)</small></td></tr>`;
  if (g > 0 && (gf.length || gm.length)) h += `<tr><th>지금</th><td>마친 바퀴 g=${g} → 요금 <b>${fmtNum(e.feeAt(p, i, g))}</b>, 곱 <b>×${fmtNum(e.multAt(p, i, g))}</b></td></tr>`;
  h += '</table>';
  if (p.top === i) h += '<p class="good">★ 요금이 가장 높은 건물 (관광 안내소·방송국·2호점의 대상)</p>';
  if (br.length) h += `<p class="good">${br.map(x => `${from(x)}에서도 ${x.value}번 이용된다`).join(' · ')}</p>`;
  if (b.refuses) h += `<p class="warn">${b.refuses === 'drunk' ? `만취(취함 ${cfg.drunkThreshold} 이상)한 손님을 받지 않는다` : `배부른(포만감 ${cfg.fullThreshold} 이상) 손님을 받지 않는다`}</p>`;
  return h;
}

function tasteOf(d, b) {
  if (!b || b.group !== 'shop') return null;
  const liked = b.kinds.some(k => d.likes.includes(k)), hated = b.kinds.includes(d.dislikes);
  return liked && hated ? 'both' : liked ? 'like' : hated ? 'dislike' : null;
}

function renderDetail() {
  const h = ui.hover, s = game.state;
  let html;
  if (h?.type === 'tile') html = detailTile(h.i);
  else if (h?.type === 'cand' && s.candidates[h.slot]) {
    const b = building(s.candidates[h.slot].name);
    html = `<h3>${b.group === 'support' ? '⚙️ ' : ''}${b.name} <small>후보 · ${b.group === 'shop' ? `장사 · 요금 ${b.fee}` : `지원 · ${RARITY[b.rarity]}`}</small> ${(b.kinds || []).map(k => chip(k)).join('')}</h3><p>${b.text}</p>
      ${b.refuses ? `<p class="warn">${b.refuses === 'drunk' ? '만취한 손님을 받지 않는다' : '배부른 손님을 받지 않는다'}</p>` : ''}
      ${b.group === 'support' ? '<p class="dim">같은 지원 건물은 보드에 한 채만 지을 수 있다.</p>' : ''}`;
  } else if (h?.type === 'dwarf') {
    const d = dwarfOf(h.name);
    const marks = s.board.map(n => tasteOf(d, n && building(n)));
    html = `<h3>🧔 ${d.name}</h3><p>${d.likes.map(k => chip(k, '♥')).join('')} ${chip(d.dislikes, '✕')}</p>
      <p>보드에 좋아하는 건물 <b>${marks.filter(m => m === 'like').length}채</b>, 싫어하는 건물 <b>${marks.filter(m => m === 'dislike').length}채</b>${marks.includes('both') ? `, 둘 다인 건물 ${marks.filter(m => m === 'both').length}채(변화 없음)` : ''}</p>
      <p class="dim">좋아하는 건물을 이용하면 만족도 +1, 싫어하는 건물은 −1(0 아래로는 안 내려간다). 낸 돈은 취향과 무관하다.<br>기본 2바퀴 뒤, 만족도가 한 바퀴 값(3 → 6 → 12 → 24) 이상이면 그만큼 내고 한 바퀴 더 돈다.</p>`;
  } else {
    html = `<h3>살펴보기</h3><p class="dim">건물, 후보, 드워프 카드에 마우스를 올리면 여기에 풀이가 나온다.<br>지원 건물은 효과가 닿는 칸이, 장사 건물은 자기에게 걸린 지원이 보드에 표시된다.</p>
      <p class="dim">웨이브 목표: ${cfg.targets.map((t, i) => `<span class="${i === s.wave ? 'cur' : ''}">${i + 1}웨이브 ${won(t)}</span>`).join(' · ')}</p>`;
  }
  $('detail').innerHTML = html;
}

// 마우스가 올라간 것에 따라 보드에 표시를 한다. 칸을 다시 그리지 않고 표시만 바꾼다(끌기가 끊기지 않게).
function applyHighlights() {
  const s = game.state, p = ui.prep, h = ui.hover;
  const tiles = [...document.querySelectorAll('#board .tile')];
  const dwarfName = h?.type === 'dwarf' ? h.name : ui.play ? ui.play.info.dwarf : null;
  const d = dwarfName && dwarfOf(dwarfName);
  tiles.forEach((el, i) => {
    el.classList.remove('hl-target', 'hl-source', 'hl-self', 'sel', 'like', 'dislike', 'both', 'droppable');
    const t = d ? tasteOf(d, s.board[i] && building(s.board[i])) : null;
    el.querySelector('.taste').textContent = t === 'like' ? '♥' : t === 'dislike' ? '✕' : t === 'both' ? '♥✕' : '';
    if (t) el.classList.add(t);
    if (h?.type === 'tile' && s.board[h.i]) {
      if (h.i === i) el.classList.add('hl-self');
      if (p.targets[h.i].includes(i)) el.classList.add('hl-target');
      if (p.sources[h.i].some(x => x.from === i)) el.classList.add('hl-source');
    }
    if (ui.sel?.type === 'tile' && ui.sel.i === i) el.classList.add('sel');
    if (ui.sel?.type === 'cand' && s.board[i] == null) el.classList.add('droppable');
    if (ui.sel?.type === 'tile' && ui.sel.i !== i) el.classList.add('droppable');
  });
}

// ── 창: 시작/덱, 설정, 결과 ──────────────────────────────────
function deckHTML() {
  const rows = data.kinds.map(k => {
    const likes = data.dwarves.filter(d => d.likes.includes(k.name)).length, hates = data.dwarves.filter(d => d.dislikes === k.name).length;
    return `<tr><td>${chip(k.name)}</td><td class="barcell"><span class="mark like">♥</span><i class="b like" style="width:${likes * 16}px"></i> ${likes}</td>
      <td class="barcell"><span class="mark hate">✕</span><i class="b hate" style="width:${hates * 16}px"></i> ${hates}</td></tr>`;
  }).join('');
  return `<table class="deckbars"><tr><th>종류</th><th>좋아하는 드워프</th><th>싫어하는 드워프</th></tr>${rows}</table>
    <details><summary>카드 ${data.dwarves.length}장 펼쳐 보기</summary><div class="deckgrid">${data.dwarves.map(d =>
      `<div class="mini"><b>${d.name}</b><span>${d.likes.map(k => chip(k, '♥')).join('')}</span><span>${chip(d.dislikes, '✕')}</span></div>`).join('')}</div></details>
    <table class="targets"><tr><th>웨이브</th>${cfg.targets.map((_, i) => `<td class="${i === game.state.wave ? 'cur' : ''}">${i + 1}</td>`).join('')}</tr>
      <tr><th>목표 (가진 돈)</th>${cfg.targets.map((t, i) => `<td class="${i === game.state.wave ? 'cur' : ''}"><b>${won(t)}</b></td>`).join('')}</tr>
      <tr><th>첫 새로고침 값</th>${cfg.targets.map((_, i) => `<td>${won(game.engine.refreshCost(i, 0))}</td>`).join('')}</tr></table>`;
}

function renderModal() {
  const m = $('modal'), s = game.state;
  const kind = s.phase === 'over' && ui.modal !== 'settings' && ui.modal !== 'deck' ? 'over' : ui.modal;
  if (!kind) { m.innerHTML = ''; m.className = ''; return; }
  m.className = 'open';
  let h = '';
  if (kind === 'intro' || kind === 'deck') {
    h = `<h2>${kind === 'intro' ? '욜로드워프 — 스테이지 시작' : '덱 30마리'}</h2>
      ${kind === 'intro' ? `<p>고리 모양 보드에 가게를 짓고, 손님 드워프가 그 위를 돌며 돈을 낸다. 웨이브마다 셋씩 세 번 보여 주는 드워프 가운데 하나씩 골라 보낸다. 웨이브가 끝났을 때 <b>가진 돈이 목표 이상</b>이면 통과다. 시작 돈 ${cfg.startMoney}.</p>` : ''}
      ${deckHTML()}
      <div class="mfoot">${kind === 'intro' ? '<button class="primary" data-act="begin">정비 시작 ▶</button>' : '<button data-act="close">닫기</button>'}</div>`;
  } else if (kind === 'settings') {
    h = `<h2>설정 · 시험용 스위치</h2>
      <label class="sw"><input type="checkbox" data-set="preview" ${settings.preview ? 'checked' : ''}> <b>예상 수입 미리보기</b> <small>드워프 카드에 그 드워프를 보냈을 때의 수입을 보여 준다 (기본 끔)</small></label>
      <label class="sw"><input type="checkbox" data-set="dislike" ${settings.dislike ? 'checked' : ''}> <b>싫어하는 종류</b> <small>끄면 만족도를 깎지 않는다 (기본 켬)</small></label>
      <div class="sw"><b>시드</b> <input id="seed-in" value="${s.seed}" spellcheck="false"> <button data-act="seedGo">이 시드로 새 판</button> <button data-act="seedRandom">무작위 새 판</button>
        <small>같은 시드, 같은 조작이면 후보와 드워프가 똑같이 나온다.</small></div>
      <div class="sw"><b>역대 최고</b> ${allTimeBest ? `${won(allTimeBest.income)} <small>(${allTimeBest.dwarf}, 시드 ${allTimeBest.seed})</small>` : '없음'} <button data-act="clearBest">지우기</button></div>
      <div class="mfoot"><button data-act="close">닫기</button></div>`;
  } else if (kind === 'over') {
    const rows = s.waveResults.map(w => `<tr class="${w.passed ? '' : 'bad'}"><td>${w.wave + 1}</td><td>${won(w.target)}</td><td><b>${won(w.income)}</b></td><td>${won(w.moneyAfter)}</td>
      <td>${w.passed ? '통과' : '실패'}</td><td class="l">${w.sends.map(x => `${x.dwarf} ${won(x.income)}(${x.laps}바퀴)`).join(' · ')}</td></tr>`).join('');
    h = `<h2>${s.outcome === 'clear' ? '🎉 클리어! 다섯 웨이브를 모두 통과했다' : `💀 웨이브 ${s.wave + 1}에서 끝났다`}</h2>
      <p>이번 판 최고 수입 <b class="big">${won(s.bestSend ? s.bestSend.income : 0)}</b> ${s.bestSend ? `<small>(${s.bestSend.dwarf}, 웨이브 ${s.bestSend.wave + 1})</small>` : ''}
        · 역대 최고 <b>${allTimeBest ? won(allTimeBest.income) : 0}</b> · 마지막에 가진 돈 <b>${won(s.money)}</b></p>
      <table class="result"><tr><th>웨이브</th><th>목표</th><th>번 돈</th><th>판정 때 가진 돈</th><th>판정</th><th>보낸 드워프</th></tr>${rows}</table>
      <div class="mfoot"><span class="dim">시드 ${s.seed}</span><button data-act="sameSeed">같은 시드로 다시</button><button class="primary" data-act="restart">다시 하기</button></div>`;
  }
  m.innerHTML = `<div class="sheet ${kind}">${h}</div>`;
}

// ── 기록 창, 알림 ────────────────────────────────────────────
function addLog(html, cls = '') {
  const el = document.createElement('div');
  el.className = 'line ' + cls; el.innerHTML = html;
  const log = $('log'); log.appendChild(el); log.scrollTop = log.scrollHeight;
}
function toast(text, cls = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + cls; el.textContent = text;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), 2600);
}
const diff = (label, a, b) => (a === b ? '' : `${label} ${a}→${b}`);
function changes(ev) {
  const a = ev.before, b = ev.after;
  const parts = [a.gauge === b.gauge ? '' : `${gaugeText(a.gauge)}→${gaugeText(b.gauge)}`, diff('취함', a.drunk, b.drunk), diff('흥', a.hype, b.hype)].filter(Boolean);
  let sat = '';
  if (ev.countsSatisfaction && ev.taste === 'like') sat = `만족도 ${a.satisfaction}→${b.satisfaction} ♥`;
  else if (ev.countsSatisfaction && ev.taste === 'dislike') sat = ev.satChange ? `만족도 ${a.satisfaction}→${b.satisfaction} ✕` : (game.state.options.dislike ? '만족도 0 그대로 ✕' : '');
  if (sat) parts.push(sat);
  return parts.join(' · ') || '변화 없음';
}

// ── 재생: 엔진이 돌려준 기록을 차례로 보여 준다 ───────────────
const TIME = { pass: 90, move: 230, use: 520, refuse: 420, lapEnd: 1250, leave: 1100 };
function wait(ms) {
  if (ui.skip) return Promise.resolve();
  const fever = ui.play ? Math.min(3, 1 + 0.35 * ui.play.fever) : 1;   // 추가 바퀴를 거듭할수록 빨라진다
  return new Promise(res => { const t = setTimeout(done, ms / (ui.speed * fever)); function done() { clearTimeout(t); ui.wake = null; res(); } ui.wake = done; });
}
function tileEl(i) { return document.querySelector(`#board .tile[data-tile="${i}"]`); }
function placeToken(i, ms) {
  const el = tileEl(i), tk = $('token');
  if (!el || !tk) return;
  tk.hidden = false;
  tk.style.transitionDuration = ms + 'ms';
  tk.style.left = el.offsetLeft + el.offsetWidth / 2 + 'px';
  tk.style.top = el.offsetTop + el.offsetHeight - 8 + 'px';
  tk.className = ui.play && ui.play.fever ? `fever f${Math.min(ui.play.fever, 4)}` : '';
}
function popup(i, html, cls) {
  if (ui.skip) return;
  const el = tileEl(i), fx = $('fx');
  if (!el || !fx) return;
  const p = document.createElement('div');
  p.className = 'pop ' + cls; p.innerHTML = html;
  p.style.left = el.offsetLeft + el.offsetWidth / 2 + 'px';
  // 같은 칸에 연달아 뜨면(한 번 더, 2호점) 겹치지 않게 조금씩 위로 올린다
  const stack = fx.querySelectorAll(`.pop[data-at="${i}"]:not(.growpop)`).length;
  p.dataset.at = i;
  p.style.top = el.offsetTop + el.offsetHeight * (cls === 'growpop' ? 0.2 : 0.62) - (cls === 'growpop' ? 0 : (stack % 3) * 26) + 'px';
  const life = 1600 / Math.pow(ui.speed * (ui.play ? Math.min(3, 1 + 0.35 * ui.play.fever) : 1), 0.7);
  p.style.animationDuration = life + 'ms';
  fx.appendChild(p); setTimeout(() => p.remove(), life + 50);
}
function flash(i, cls) {
  const el = tileEl(i);
  if (!el || ui.skip) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}
const READS = ['feePerHunger', 'feePerDrunk', 'feePerHype', 'consumeAllHypeFeePer', 'doubleIfDrunkAtLeast'];
function markReaders(from) {   // 스택을 읽는 건물은 드워프가 다가올 때 밝아진다
  document.querySelectorAll('#board .tile.reading').forEach(el => el.classList.remove('reading'));
  const s = game.state, P = ui.play;
  for (let k = 1; k <= 2 && from + k < N; k++) {
    const b = s.board[from + k] && building(s.board[from + k]);
    if (!b || b.group !== 'shop') continue;
    const st = P.stacks, e = b.effect;
    const live = (e.feePerHunger && st.gauge > 0) || (e.feePerDrunk && st.drunk > 0) || ((e.feePerHype || e.consumeAllHypeFeePer) && st.hype > 0) || (e.doubleIfDrunkAtLeast != null && st.drunk >= e.doubleIfDrunkAtLeast);
    if (READS.some(key => e[key] != null) && live) tileEl(from + k)?.classList.add('reading');
  }
}

function applyUse(ev, P) {
  const info = P.info;
  P.stacks = { gauge: ev.after.gauge, drunk: ev.after.drunk, hype: ev.after.hype };
  P.sat = ev.after.satisfaction; P.total = ev.incomeSoFar;
  const moneyBefore = P.money;
  P.money = info.moneyBefore + ev.incomeSoFar; P.waveIncome = info.waveIncomeBefore + ev.incomeSoFar;
  const formula = formulaText(ev);
  const via = ev.via === 'again' ? '<i class="via">한 번 더</i>' : ev.via === 'branch' ? `<i class="via">2호점 → ${ev.building}</i>` : '';
  const size = Math.min(46, 17 + 7 * Math.log10(ev.pay + 1));
  const satMark = !ev.countsSatisfaction ? '' : ev.taste === 'like' ? '<span class="s like">♥ 만족도 +1</span>'
    : ev.taste === 'dislike' && game.state.options.dislike ? `<span class="s hate">✕ 만족도 ${ev.satChange ? '−1' : '0 그대로'}</span>` : '';
  popup(ev.tile, `${via}<b style="font-size:${size}px">+${won(ev.pay)}</b><span class="f">${formula}</span>${satMark}`, ev.pay >= 1000 ? 'pay huge' : ev.pay >= 100 ? 'pay big' : 'pay');
  flash(ev.tile, ev.pay >= 300 ? 'paid-big' : 'paid');
  if (ev.via === 'branch') flash(ev.shopTile, 'paid');
  addLog(`<span class="lt">바퀴${ev.lap} · ${ev.tile}번</span><b>${ev.via === 'branch' ? `2호점→${ev.building}` : ev.building}${ev.via === 'again' ? ' (한 번 더)' : ''}</b><span class="lf">${formula}</span><span class="lp">+${won(ev.pay)}</span><span class="ls">${changes(ev)}</span>`);
  const target = game.cfg.targets[info.wave];
  if (moneyBefore < target && P.money >= target) { toast(`🎯 목표 ${won(target)} 돌파!`, 'goal'); addLog(`🎯 가진 돈이 목표 ${won(target)}을 넘었다`, 'mark'); }
  if (!P.brokeAll && P.allBefore > 0 && P.total > P.allBefore) { P.brokeAll = P.brokeRun = true; toast(`🏆 역대 최고 수입 경신! (종전 ${won(P.allBefore)})`, 'record'); }
  else if (!P.brokeRun && info.bestBefore > 0 && P.total > info.bestBefore) { P.brokeRun = true; toast(`⭐ 이번 판 최고 수입 경신! (종전 ${won(info.bestBefore)})`, 'record'); }
}

function applyRefuse(ev, P) {
  const why = ev.reason === 'drunk' ? '만취해서 못 들어감' : '배불러서 못 들어감';
  popup(ev.tile, `<b>🚫 ${why}</b>${ev.via === 'again' ? '<span class="f">남은 "한 번 더"도 하지 않는다</span>' : ''}`, 'refuse');
  flash(ev.tile, 'refused');
  addLog(`<span class="lt">바퀴${ev.lap} · ${ev.tile}번</span><b>${ev.via === 'branch' ? `2호점→${ev.building}` : ev.building}${ev.via === 'again' ? ' (한 번 더)' : ''}</b><span class="lr">🚫 ${why}</span><span class="ls">${ev.reason === 'drunk' ? `취함 ${ev.before.drunk}` : gaugeText(ev.before.gauge)}</span>`, 'refuse');
}

function applyLapEnd(ev, P) {
  const st = ev.stacksBefore;
  const had = [st.gauge ? gaugeText(st.gauge) : '', st.drunk ? `취함 ${st.drunk}` : '', st.hype ? `흥 ${st.hype}` : ''].filter(Boolean).join(', ');
  const cleared = had ? `스택이 사라진다 (${had} → 0)` : '스택 없음';
  let line, cls;
  if (ev.result === 'base') { line = `기본 바퀴 — 무조건 한 바퀴 더 (만족도 ${ev.satisfaction}은 쌓아 둔다)`; cls = 'base'; }
  else if (ev.result === 'extra') { line = `만족도 ${ev.satisfactionBefore} − 한 바퀴 값 ${ev.paid} = ${ev.satisfaction} → <b>🔥 한 바퀴 더!</b> (다음 값 ${ev.lapCost})`; cls = 'extra'; }
  else { line = `만족도 ${ev.satisfaction} &lt; 한 바퀴 값 ${ev.needed} → 떠난다`; cls = 'leave'; }
  P.stacks = { gauge: 0, drunk: 0, hype: 0 }; P.sat = ev.satisfaction; P.lapCost = ev.lapCost;
  P.banner = { cls, html: `<b>바퀴 ${ev.lap} 끝 · 이 바퀴 +${won(ev.lapIncome)}</b><br>${cleared}<br>${line}` };
  addLog(`<span class="lt">바퀴${ev.lap} 끝</span><span class="lp">이 바퀴 +${won(ev.lapIncome)}</span><span class="ls">${cleared} · ${line.replace(/<[^>]+>/g, '')}</span>`, 'lap ' + cls);
  // 성장 지원이 건물을 키운다 (g가 1 늘었다)
  const prep = P.info.prep, oldG = P.g;
  P.g = ev.g;
  const grown = [];
  for (const i of prep.shops) {
    if (!prep.growFee[i] && !prep.growMult[i]) continue;
    const el = tileEl(i);
    if (el) el.querySelector('.tstats').innerHTML = tileStats(i, P.g);
    flash(i, 'grew');
    const parts = [prep.growFee[i] ? `요금 +${fmtNum(prep.growFee[i])}` : '', prep.growMult[i] ? `곱 +${fmtNum(prep.mult[i] * prep.growMult[i])}` : ''].filter(Boolean).join(' · ');
    popup(i, `<b>▲ ${parts}</b>`, 'growpop');
    grown.push(`${game.state.board[i]} 요금 ${fmtNum(game.engine.feeAt(prep, i, oldG))}→${fmtNum(game.engine.feeAt(prep, i, P.g))}${prep.growMult[i] ? `, 곱 ×${fmtNum(game.engine.multAt(prep, i, oldG))}→×${fmtNum(game.engine.multAt(prep, i, P.g))}` : ''}`);
  }
  if (grown.length) addLog(`<span class="lt">성장</span><span class="ls">${grown.join(' · ')}</span>`, 'growl');
  if (ev.result === 'extra' && !ui.skip) {
    const b = $('board'); b.classList.remove('burst'); void b.offsetWidth; b.classList.add('burst');
  }
}

async function playSend(choice) {
  const s = game.state;
  if (ui.playing || s.phase !== 'pick') return;
  const choices = s.choices.slice(), allBefore = allTimeBest ? allTimeBest.income : 0;
  const info = game.send(choice);
  if (!info) return;
  if (info.income > allBefore) { allTimeBest = { income: info.income, dwarf: info.dwarf, seed: s.seed }; store.set('best', allTimeBest); }
  const P = ui.play = { info, choices, allBefore, g: info.lapsDoneBefore, lap: 1, fever: 0, tile: 0, stacks: { gauge: 0, drunk: 0, hype: 0 }, sat: 0, lapCost: cfg.lapCostStart, total: 0, money: info.moneyBefore, waveIncome: info.waveIncomeBefore, banner: null, brokeRun: false, brokeAll: false };
  Object.assign(ui, { playing: true, skip: false, sel: null, hover: null });
  const d = dwarfOf(info.dwarf);
  addLog(`▶ 웨이브 ${info.wave + 1} · 보내기 ${info.sendIndex + 1}/${cfg.sendsPerWave} · <b>${d.name}</b> (♥ ${d.likes.join(', ')} / ✕ ${d.dislikes}) · 시작 g=${info.lapsDoneBefore}`, 'head');
  render();
  const evs = info.events;
  let k = 0;
  while (k < evs.length) {
    const ev = evs[k];
    if (ev.type === 'lapStart') {
      k++;
      P.lap = ev.lap; P.g = ev.g; P.lapCost = ev.lapCost;
      const fever = ev.extra ? ev.lap - cfg.baseLaps : 0;
      if (fever !== P.fever) { P.fever = fever; $('board').className = fever ? `fever f${Math.min(fever, 4)}` : ''; }
      if (ev.lap > 1) P.banner = null;
      for (let i = 0; i < N; i++) {
        const here = [];
        while (k < evs.length && evs[k].type !== 'lapEnd' && evs[k].tile === i) here.push(evs[k++]);
        P.tile = i;
        const ms = (here.length ? TIME.move : TIME.pass) / (ui.speed * Math.min(3, 1 + 0.35 * P.fever));
        placeToken(i, ui.skip ? 0 : ms);
        if (!ui.skip) { applyHighlights(); markReaders(i); renderCenter(); }
        await wait(here.length ? TIME.move : TIME.pass);
        for (const e of here) {
          if (e.type === 'use') applyUse(e, P); else applyRefuse(e, P);
          if (!ui.skip) { renderCenter(); renderTop(); markReaders(i); }
          await wait(e.type === 'use' ? TIME.use : TIME.refuse);
        }
      }
    } else {
      k++;
      applyLapEnd(ev, P);
      if (!ui.skip) { renderCenter(); renderTop(); }
      await wait(ev.result === 'leave' ? TIME.leave : TIME.lapEnd);
    }
  }
  addLog(`■ ${d.name} 떠남 · ${info.laps}바퀴 · 합계 <b>+${won(info.income)}</b> (바퀴마다 ${info.incomePerLap.map(won).join(' / ')}) · 가진 돈 ${won(s.money)}`, 'tail');
  if (ui.skip) {   // 건너뛰었으면 놓친 알림을 한 번에
    const target = cfg.targets[info.wave];
    toast(`${d.name}: +${won(info.income)} (${info.laps}바퀴)`, 'sum');
    if (info.moneyBefore < target && s.money >= target) toast(`🎯 목표 ${won(target)} 돌파!`, 'goal');
  }
  Object.assign(ui, { playing: false, play: null, skip: false });
  if (s.phase === 'judge') addLog(`${s.judge.passed ? '✅' : '💀'} 웨이브 ${s.wave + 1} 판정: 가진 돈 ${won(s.money)} / 목표 ${won(s.judge.target)} → ${s.judge.cleared ? '클리어' : s.judge.passed ? '통과' : '실패'} (이번 웨이브에 번 돈 ${won(s.waveIncome)})`, 'mark');
  render();
}

// ── 조작 ────────────────────────────────────────────────────
// 되돌릴 수 없는 단추는 두 번 눌러야 한다(브라우저 확인 창은 막힌 곳이 있어 쓰지 않는다).
let armed = null;
function twice(key, msg) {
  if (armed && armed.key === key && Date.now() - armed.t < 5000) { armed = null; return true; }
  armed = { key, t: Date.now() }; toast(msg);
  return false;
}
function act(name, el) {
  const s = game.state;
  switch (name) {
    case 'begin': game.begin(); ui.modal = null; addLog(`새 판 · 시드 ${s.seed} · 시작 돈 ${cfg.startMoney}`, 'mark'); break;
    case 'close': ui.modal = null; break;
    case 'deck': ui.modal = s.phase === 'intro' ? 'intro' : 'deck'; break;
    case 'settings': ui.modal = 'settings'; break;
    case 'restart': if (s.phase === 'over' || s.phase === 'intro' || twice('restart', '한 번 더 누르면 지금 판을 버리고 새 판을 시작한다')) return newGame();
      return;
    case 'sameSeed': return newGame(s.seed);
    case 'seedGo': { const v = $('seed-in').value.trim(); if (v) return newGame(v); return; }
    case 'seedRandom': return newGame();
    case 'clearBest': allTimeBest = null; store.set('best', null); break;
    case 'freeze': game.toggleFreeze(+el.dataset.slot); break;
    case 'refresh': { const cost = game.refreshCost(); if (game.refresh()) { ui.sel = null; addLog(`🔄 새로고침 −${won(cost)} · 가진 돈 ${won(s.money)}`, 'prepl'); } break; }
    case 'startWave': if (s.buildsLeft > 0 && s.candidates.some(c => c) && !twice('wave' + s.wave, `건설이 ${s.buildsLeft}채 남았다. 남긴 건설은 넘어가지 않는다. 한 번 더 누르면 시작`)) return;
      ui.sel = null; game.startWave(); addLog(`— 웨이브 ${s.wave + 1} 시작 · 목표 ${won(game.target())} · 보드: ${s.board.map((b, i) => (b ? `${i}:${b}` : '')).filter(Boolean).join(', ') || '비어 있음'}`, 'mark'); break;
    case 'send': playSend(+el.dataset.i); return;
    case 'speed': ui.speed = +el.dataset.x; store.set('speed', ui.speed); renderTray(); return;
    case 'skip': ui.skip = true; ui.wake?.(); return;
    case 'proceed': game.proceed(); if (s.phase === 'over') ui.modal = null; break;
  }
  render();
}

function tryBuild(slot, tile) {
  const c = game.state.candidates[slot];
  if (!c) return;
  if (game.build(slot, tile)) { addLog(`🏗 ${tile}번 칸에 <b>${c.name}</b> 건설`, 'prepl'); ui.sel = null; }
  else if (game.state.buildsLeft <= 0) toast('이번 정비의 건설 2채를 다 썼다');
  else if (game.state.board[tile] != null) toast('빈 칸에만 지을 수 있다');
  render();
}
function tryMove(from, to) {
  const b = game.state.board;
  const a = b[from], z = b[to];
  if (game.move(from, to)) addLog(`↔ 자리 바꾸기: ${a} ${from}→${to}${z ? `, ${z} ${to}→${from}` : ''}`, 'prepl');
  ui.sel = null; render();
}

const root = $('app');
root.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  if (actEl) { if (!actEl.disabled) act(actEl.dataset.act, actEl); return; }
  if (e.target.id === 'modal' && ui.modal && ui.modal !== 'intro') { ui.modal = null; render(); return; }
  if (ui.playing) return;
  const s = game.state;
  const cand = e.target.closest('[data-cand]');
  if (cand && s.phase === 'prep') {
    const slot = +cand.dataset.cand;
    ui.sel = ui.sel?.type === 'cand' && ui.sel.slot === slot ? null : { type: 'cand', slot };
    if (ui.sel && s.buildsLeft <= 0) { ui.sel = null; toast('이번 정비의 건설 2채를 다 썼다'); }
    return render();
  }
  const tile = e.target.closest('[data-tile]');
  if (tile && game.canEditBoard()) {
    const i = +tile.dataset.tile;
    if (ui.sel?.type === 'cand') return tryBuild(ui.sel.slot, i);
    if (ui.sel?.type === 'tile') return ui.sel.i === i ? (ui.sel = null, render()) : tryMove(ui.sel.i, i);
    if (s.board[i] != null) { ui.sel = { type: 'tile', i }; render(); }
    return;
  }
  if (ui.sel) { ui.sel = null; render(); }
});
root.addEventListener('change', e => {
  const key = e.target.dataset?.set;
  if (!key) return;
  settings[key] = e.target.checked; store.set('settings', settings);
  game.state.options.dislike = settings.dislike;
  render();
});
root.addEventListener('keydown', e => { if (e.target.id === 'seed-in' && e.key === 'Enter') act('seedGo'); });

function hoverOf(target) {
  const t = target.closest?.('[data-tile]'); if (t) return { type: 'tile', i: +t.dataset.tile };
  const c = target.closest?.('[data-cand]'); if (c) return { type: 'cand', slot: +c.dataset.cand };
  const d = target.closest?.('[data-name]'); if (d) return { type: 'dwarf', name: d.dataset.name };
  return null;
}
root.addEventListener('mouseover', e => {
  const h = hoverOf(e.target);
  if (JSON.stringify(h) === JSON.stringify(ui.hover) || ui.drag) return;
  ui.hover = h; renderDetail(); applyHighlights();
});
root.addEventListener('mouseleave', () => { ui.hover = null; renderDetail(); applyHighlights(); });

// 끌어다 놓기: 후보 → 빈 칸(건설), 건물 → 다른 칸(자리 바꾸기)
root.addEventListener('dragstart', e => {
  if (ui.playing) return e.preventDefault();
  const c = e.target.closest?.('[data-cand]'), t = e.target.closest?.('[data-tile]');
  if (c && game.state.phase === 'prep' && game.state.buildsLeft > 0) ui.drag = { type: 'cand', slot: +c.dataset.cand };
  else if (t && game.canEditBoard() && game.state.board[+t.dataset.tile] != null) ui.drag = { type: 'tile', i: +t.dataset.tile };
  else return e.preventDefault();
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'x');
  ui.sel = ui.drag; applyHighlights();
});
const dropOk = i => ui.drag && (ui.drag.type === 'cand' ? game.state.board[i] == null : ui.drag.i !== i);
root.addEventListener('dragover', e => {
  const t = e.target.closest?.('[data-tile]');
  if (t && dropOk(+t.dataset.tile)) { e.preventDefault(); t.classList.add('over'); }
});
root.addEventListener('dragleave', e => e.target.closest?.('[data-tile]')?.classList.remove('over'));
root.addEventListener('drop', e => {
  const t = e.target.closest?.('[data-tile]'), d = ui.drag;
  ui.drag = null;
  if (!t || !d) return;
  e.preventDefault();
  const i = +t.dataset.tile;
  if (d.type === 'cand') tryBuild(d.slot, i); else tryMove(d.i, i);
});
root.addEventListener('dragend', () => { if (ui.drag) { ui.drag = null; ui.sel = null; render(); } });

newGame(new URLSearchParams(location.search).get('seed') || undefined);
window.__yolo = { get game() { return game; }, ui, newGame };   // 콘솔에서 들여다보기용

</script>
