<title>욜로드워프 시제품 1차</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1f232b; --panel2: #272c36; --line: #363d4a; --text: #e8eaf0; --dim: #98a0b0;
  --gold: #ffd257; --good: #6fd08c; --bad: #ff6b62; --fever: #ff9a3c; --ice: #7fd4ff; --mult: #ff9f7a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
button, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: #6b7690; background: #303746; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: #2f6fdd; border-color: #4a86ee; font-weight: 700; }
button.primary:hover:not(:disabled) { background: #3c7cec; }
small, .dim { color: var(--dim); }
h2, h3 { margin: 0 0 6px; }
h3 small, h2 small { font-weight: 400; font-size: 12px; }
p { margin: 4px 0; }
.good { color: var(--good); } .bad { color: var(--bad); } .num { color: var(--gold); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px; white-space: nowrap; margin: 0 2px; background: color-mix(in srgb, var(--c) 28%, #1b1e25); border: 1px solid var(--c); }
.kind { white-space: nowrap; color: color-mix(in srgb, var(--c) 75%, #fff); font-weight: 700; }
.cfee { color: var(--gold); } .cmult { color: var(--mult); } .cstack { color: #9fe0b0; } .csat { color: #ff9fbd; } .now { color: var(--dim); }
.mark { font-weight: 700; margin-right: 3px; font-size: 12px; }
.mark.like, .s.like { color: #ff7fa5; } .mark.hate, .s.hate { color: #9fb0c8; } .s.rest { color: #9fc8ff; }
.trait { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: #5a4a1c; border: 1px solid var(--gold); color: var(--gold); margin-left: 4px; white-space: nowrap; }
.stars { color: var(--gold); margin-left: 2px; letter-spacing: -1px; }

#app { display: flex; flex-direction: column; height: 100%; min-height: 790px; overflow-x: auto; }
#top, main { min-width: 1240px; }
#top { display: flex; align-items: center; gap: 12px; padding: 7px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
#top .brand { font-weight: 800; font-size: 16px; }
#top .stat { display: flex; align-items: baseline; gap: 5px; padding: 2px 11px; border-left: 1px solid var(--line); position: relative; white-space: nowrap; }
#top .stat label { color: var(--dim); font-size: 12px; }
#top .stat b { font-size: 19px; font-variant-numeric: tabular-nums; }
#top .stat b.sw { font-size: 15px; }
#top .money b { color: var(--gold); } #top .money b.tg { color: var(--text); font-size: 16px; }
#top .money.hit #money { color: var(--good); }
#top .money .bar { position: absolute; left: 11px; right: 11px; bottom: -4px; height: 3px; background: #333a47; border-radius: 2px; overflow: hidden; }
#top .money .bar i { display: block; height: 100%; background: var(--gold); transition: width .2s; }
#top .money.hit .bar i { background: var(--good); }
#top .grow { flex: 1; }
#top .flag { color: #ffb36b; font-size: 12px; border: 1px dashed #ffb36b; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
#top .seed { color: var(--dim); font-size: 12px; white-space: nowrap; } #top .seed b { color: var(--text); font-family: ui-monospace, monospace; user-select: all; }

main { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 10px; min-height: 0; }
#upper { display: flex; gap: 10px; flex: none; height: 512px; }
#side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 330px; min-height: 0; }

/* ── 보드: 둥근 네모 트랙 ── */
#board { position: relative; flex: none; width: 770px; height: 512px; display: grid; gap: 5px; padding: 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 26px; transition: box-shadow .4s, border-color .4s; }
#board.fever { border-color: var(--fever); box-shadow: 0 0 0 1px var(--fever), 0 0 26px rgba(255, 154, 60, .35); }
#board.fever.f2 { box-shadow: 0 0 0 2px var(--fever), 0 0 40px rgba(255, 154, 60, .5); }
#board.fever.f3, #board.fever.f4 { box-shadow: 0 0 0 3px #ff6a2a, 0 0 60px rgba(255, 106, 42, .7); }
#board.burst { animation: burst .7s; }
@keyframes burst { 0% { transform: scale(1); } 25% { transform: scale(1.015); filter: brightness(1.5); } 100% { transform: scale(1); } }
.tile { position: relative; min-width: 0; min-height: 0; border-radius: 7px; padding: 8px 6px 4px; background: var(--panel2); border: 2px solid var(--line); overflow: hidden; user-select: none; }
.tile.corner-tl { border-top-left-radius: 20px; } .tile.corner-tr { border-top-right-radius: 20px; } .tile.corner-br { border-bottom-right-radius: 20px; } .tile.corner-bl { border-bottom-left-radius: 20px; }
.tile[draggable="true"] { cursor: grab; }
.tile.empty { background: transparent; border-style: dashed; }
.tile.support { background: #2a2d33; border-color: #4a4f59; color: #c9ccd3; }
.tile .kbar { position: absolute; left: 0; top: 0; right: 0; height: 5px; display: flex; }
.tile .kbar i { flex: 1; background: #70757f; }
.tile .tno { position: absolute; right: 5px; bottom: 1px; font-size: 10px; color: #6f788a; }
.tile[data-tile="0"] .tno { color: var(--gold); font-weight: 700; }
.tile[data-tile="0"] { box-shadow: inset 4px 0 0 var(--gold); }
.tile .arrow { position: absolute; left: 4px; bottom: 0; font-size: 11px; color: #6f788a; }
.tile .taste { position: absolute; right: 4px; top: 6px; font-weight: 800; font-size: 15px; z-index: 1; }
.tile.like .taste { color: #ff7fa5; } .tile.dislike .taste { color: #c3d0e6; }
.tile.like { background: color-mix(in srgb, #ff7fa5 15%, var(--panel2)); }
.tile.dislike { background: repeating-linear-gradient(135deg, var(--panel2), var(--panel2) 9px, #20242d 9px, #20242d 12px); }
.tname { font-weight: 700; font-size: 13px; white-space: nowrap; display: flex; align-items: baseline; padding-right: 12px; }
.tname .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tname .stars, .tname .mk, .tname .boost { flex: none; }
.tkind { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.mk { font-style: normal; font-size: 11px; margin-left: 2px; }
.boost { color: var(--ice); font-style: normal; font-weight: 700; font-size: 11px; margin-left: 3px; }
.tile.top { border-color: #8b7630; }
.tstats { display: flex; gap: 6px; align-items: baseline; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tstats .fee { font-weight: 800; font-size: 17px; color: var(--text); } .tstats .fee.buffed { color: var(--gold); }
.tstats .mult { color: var(--mult); font-weight: 800; font-size: 14px; } .tstats .again { color: var(--ice); font-weight: 700; }
.ttext { font-size: 11px; line-height: 1.3; color: #a9aeb9; margin-top: 2px; }
/* 칸 수에 따라 줄인다 */
#board.n16 .tkind, #board.n20 .tkind, #board.n24 .tkind { display: none; }
#board.n16 .ttext { font-size: 10px; line-height: 1.25; }
#board.n20 .ttext, #board.n24 .ttext { font-size: 9.5px; line-height: 1.2; margin-top: 0; }
#board.n20 .tname, #board.n24 .tname { font-size: 11.5px; }
#board.n24 .tile { padding: 7px 4px 2px; } #board.n24 .tname { font-size: 11px; letter-spacing: -.5px; }
#board.n20 .tstats .fee, #board.n24 .tstats .fee { font-size: 15px; } #board.n24 .tstats { gap: 4px; } #board.n24 .tstats .mult { font-size: 12px; }
#board.n8 .tname { font-size: 16px; } #board.n8 .tkind, #board.n8 .ttext { font-size: 13px; } #board.n8 .tstats .fee { font-size: 24px; } #board.n8 .tstats .mult { font-size: 18px; } #board.n8 .tile { padding: 14px 12px; }
#board.n12 .tname { font-size: 14px; } #board.n12 .tile { padding: 10px 8px; } #board.n12 .tstats .fee { font-size: 20px; }
.tile.hl-self { border-color: #fff; }
.tile.hl-target { border-color: var(--good); box-shadow: 0 0 0 2px rgba(111, 208, 140, .45); }
.tile.hl-target.hl-prev::after { content: "↩ 이전 칸"; position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 11px; font-weight: 700; color: var(--good); }
.tile.hl-source { border-color: var(--ice); box-shadow: 0 0 0 2px rgba(127, 212, 255, .45); }
.tile.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 87, .5); }
.tile.droppable { border-color: #6b7690; cursor: pointer; background: rgba(107, 118, 144, .12); }
.tile.over { border-color: var(--gold); background: #3a3a2c; }
.tile.reading { border-color: #fff3b0; box-shadow: 0 0 14px rgba(255, 243, 176, .6); filter: brightness(1.25); }
.tile.paid { animation: paid .45s; } .tile.paid-big { animation: paidbig .6s; }
@keyframes paid { 0% { filter: brightness(1.9); transform: scale(1.04); } 100% { filter: none; transform: none; } }
@keyframes paidbig { 0% { filter: brightness(2.4); transform: scale(1.1) rotate(-1deg); } 30% { transform: scale(1.06) rotate(1deg); } 100% { filter: none; transform: none; } }
.tile.refused { animation: refused .45s; }
@keyframes refused { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); background: #5a2b2b; } 60% { transform: translateX(5px); } }
.tile.grew { animation: grew .9s; }
.tile.grew .tstats span, .tile.grew .now { display: inline-block; animation: grewnum .9s; }
@keyframes grew { 0% { box-shadow: 0 0 0 3px var(--good); } 100% { box-shadow: none; } }
@keyframes grewnum { 0% { transform: scale(1.8); color: var(--good); } 100% { transform: none; } }

#fx { position: absolute; inset: 0; pointer-events: none; }
#token { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; border: 3px solid #2f6fdd; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: left linear, top linear; z-index: 5; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
#token[hidden] { display: none; }
#token.fever { border-color: var(--fever); box-shadow: 0 0 16px 5px rgba(255, 154, 60, .85); animation: glow .5s infinite alternate; }
#token.fever.f2 { box-shadow: 0 0 22px 9px rgba(255, 140, 40, .9); }
#token.fever.f3, #token.fever.f4 { box-shadow: 0 0 30px 14px rgba(255, 90, 30, .95); animation-duration: .25s; }
@keyframes glow { from { transform: scale(1); } to { transform: scale(1.22); } }
.pop { position: absolute; transform: translate(-50%, -50%); z-index: 6; text-align: center; white-space: nowrap; animation: rise 1.5s forwards; background: rgba(15, 17, 21, .9); border-radius: 8px; padding: 2px 8px; border: 1px solid var(--line); }
.pop b { display: block; color: var(--gold); line-height: 1.1; }
.pop .f { display: block; font-size: 11.5px; color: #dfe3ec; } .pop .s { display: block; font-size: 11.5px; font-weight: 700; }
.pop .via { display: block; font-size: 11px; color: var(--ice); font-style: normal; }
.pop.big { border-color: var(--gold); animation-name: risebig; } .pop.huge { border-color: #ff6a2a; animation-name: risehuge; } .pop.huge b { color: #ffb14a; text-shadow: 0 0 12px #ff6a2a; }
.pop.refuse { border-color: var(--bad); } .pop.refuse b { color: var(--bad); font-size: 13px; }
.pop.growpop { border-color: var(--good); animation-name: risegrow; } .pop.growpop b { color: var(--good); font-size: 12px; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -95%); } }
@keyframes risebig { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.35); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }
@keyframes risehuge { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1.7) rotate(-4deg); } 20% { transform: translate(-50%, -50%) scale(1.2) rotate(3deg); } 30% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -130%); } }
@keyframes risegrow { 0% { opacity: 0; transform: translate(-50%, 0); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -120%); } }

/* ── 보드 가운데 ── */
#center { min-width: 0; min-height: 0; border-radius: 10px; background: #191c22; border: 1px solid var(--line); padding: 8px 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
.ctitle { font-size: 17px; font-weight: 800; } .ctitle small { font-size: 12px; font-weight: 400; color: var(--dim); }
.cbig { font-size: 30px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.2; }
.csub { font-size: 13px; color: var(--dim); margin: 3px 0; }
.cbox.judge.pass .ctitle { color: var(--good); } .cbox.judge.failj .ctitle { color: var(--bad); } .cbox.judge button { margin-top: 6px; }
.banner { margin-top: 5px; font-size: 12px; line-height: 1.4; border-radius: 6px; padding: 4px 8px; background: #262b35; }
.banner.extra { background: #3a2a1a; } .banner.extra b { color: var(--fever); } .banner b { color: var(--gold); }
#board.n8 .cbig { font-size: 24px; } #board.n8 .banner { font-size: 11px; }

/* ── 오른쪽: 드워프·단계, 살펴보기, 기록 ── */
#hud, #detail, #log-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
#hud { flex: none; height: 142px; overflow: hidden; font-size: 13px; }
#hud h3 { font-size: 15px; } #hud .cur { color: var(--gold); font-weight: 700; }
#detail { flex: none; height: 190px; overflow: auto; font-size: 13px; }
#side.logbig #detail { display: none; }
.sends { margin: 3px 0; padding: 0; list-style: none; font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; } .sends b { color: var(--gold); }
.decklabel { white-space: nowrap; }
.hud-head { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; font-size: 14px; }
.hud-head .lapno { margin-left: auto; font-weight: 700; } .hud.fever .lapno { color: var(--fever); }
.hud-row { display: flex; align-items: center; gap: 9px; margin-top: 5px; font-size: 13px; flex-wrap: wrap; }
.hud-row b { font-size: 16px; font-variant-numeric: tabular-nums; } .hud-row b.neg { color: var(--bad); }
.gauge { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
.gauge i { font-style: normal; } .gauge .gr { color: #f0923b; } .gauge .gl { color: #7fb3ff; }
.gtrack { position: relative; width: 64px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #35507e, #2a2e37 50%, #7e4d22); }
.gtrack::after { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 14px; background: #777; }
.gtrack em { position: absolute; top: -4px; width: 10px; height: 16px; margin-left: -5px; border-radius: 3px; background: #fff; transition: left .2s; }
.hungry { color: #f0923b; } .fullv { color: #7fb3ff; }
.state { font-weight: 800; font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.state.drunk { background: #6b3fb8; } .state.full { background: #2f5fa8; }
.pips { display: inline-flex; gap: 2px; } .pips i { width: 7px; height: 12px; border-radius: 2px; background: #3a4150; } .pips i.on { background: #ff7fa5; }
.sums { border-top: 1px solid var(--line); padding-top: 5px; } .sums b { color: var(--gold); }
.calc { border-collapse: collapse; font-size: 13px; margin: 3px 0; } .calc th { text-align: left; color: var(--dim); font-weight: 400; padding: 1px 10px 1px 0; white-space: nowrap; vertical-align: top; }
.calc b { color: var(--gold); } .calc small { color: var(--dim); }
.tacts { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; } .tacts .why { color: #ffb36b; }
.kw { font-size: 11.5px; color: var(--dim); margin-top: 3px; } .kw b { color: #c9d0de; }
#log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-right: 6px; }
#log-wrap h3 { font-size: 13px; display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; } #log-wrap .hint { font-weight: 400; font-size: 11px; color: var(--dim); flex: 1; }
.mini-btn { font-size: 11px; padding: 1px 7px; }
#log { flex: 1; overflow-y: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.line { padding: 2px 0; border-bottom: 1px solid #262b34; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.line .lt { color: var(--dim); width: 82px; flex: none; } .line .lf { color: #cfd5e2; } .line .lp { color: var(--gold); font-weight: 700; } .line .ls { color: #8f98aa; } .line .lr { color: var(--bad); font-weight: 700; }
.line.head { margin-top: 5px; color: #9cc2ff; border-bottom-color: #3b4660; display: block; } .line.tail { color: var(--text); display: block; background: #232832; }
.line.mark { color: var(--good); display: block; } .line.prepl { color: #b6bccb; display: block; }
.line.lap { background: #20242c; } .line.lap.extra .ls { color: var(--fever); } .line.lap.leave .ls { color: #d99; }
.line.growl .ls { color: var(--good); }

/* ── 아래 줄: 후보 / 드워프 ── */
#tray { flex: 1; min-height: 176px; display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.cands, .dwarves { display: flex; gap: 6px; flex: 1; min-width: 0; }
.cand { position: relative; flex: 1; min-width: 0; max-width: 220px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 9px 6px 30px; cursor: pointer; overflow: hidden; }
.cand[draggable="true"] { cursor: grab; }
.cand .kbar { position: absolute; left: 0; top: 0; right: 0; height: 5px; display: flex; } .cand .kbar i { flex: 1; background: #70757f; }
.cand.support { background: #2a2d33; }
.cand.none { border-style: dashed; background: transparent; cursor: default; }
.cand.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 87, .45); }
.cand.locked { border-color: var(--ice); background: #22323d; box-shadow: inset 0 0 18px rgba(127, 212, 255, .3); }
.cname { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ckind { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.ckind b { color: var(--gold); font-size: 14px; }
.rar-common { color: #b9bec9; } .rar-uncommon { color: #7fd4ff; font-weight: 700; } .rar-rare { color: #ffb14a; font-weight: 700; }
.ctext { font-size: 11px; line-height: 1.3; color: #c2c7d2; margin-top: 2px; }
.lock { position: absolute; left: 5px; right: 5px; bottom: 4px; padding: 1px 4px; font-size: 11px; }
.cand.locked .lock { border-color: var(--ice); color: var(--ice); }
.actions { width: 150px; flex: none; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.actions.wide { width: auto; } .actions small { font-size: 11px; line-height: 1.3; }
.builds { text-align: center; } .builds b { font-size: 20px; color: var(--gold); }
.speed { display: flex; gap: 3px; align-items: center; } .speed button { flex: 1; padding: 4px 6px; } .speed button.on { background: #2f6fdd; border-color: #4a86ee; }
.auto { font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap; }
.dwarf { flex: 1; max-width: 340px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px; }
.dwarf.pickable:hover { border-color: #fff; }
.dwarf.chosen { border-color: var(--gold); } .dwarf.gone { opacity: .3; }
.dname { font-weight: 800; font-size: 15px; } .dtrait { font-size: 12px; color: #d8c98f; }
.drow { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.dfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--dim); min-height: 30px; }
.dfoot .pv { color: #ffb36b; font-weight: 700; } .dfoot button { margin-left: auto; }

/* ── 창 ── */
#modal { display: none; } #modal.open { display: flex; position: fixed; inset: 0; background: rgba(0, 0, 0, .62); align-items: center; justify-content: center; z-index: 20; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 24px; width: 920px; max-width: calc(100% - 32px); max-height: 92%; overflow: auto; }
.sheet.settings { width: 660px; }
.sheet table { border-collapse: collapse; margin: 8px 0; } .sheet td, .sheet th { padding: 3px 12px 3px 0; text-align: left; font-size: 13px; }

// 건물은 데이터의 effect.type으로만 가린다. 데이터에서 건물을 빼면 그 건물 없이 돌아간다.
// prep(st)                 → 보드를 읽는다 (업종, 요금, 걸린 ×, 지나갈 때 일하는 건물)
// runDwarf(info, dwarf, …) → 드워프 한 마리의 매출과 "어느 칸에서 얼마가 왜 들어왔는지"의 기록
// endWave / startPrep      → 웨이브가 끝났을 때와 정비를 시작할 때 보드에 일어나는 일
// 계산은 docs/proto1/reference_engine_proto1.mjs와 같다(검증 사례로 맞춘다). 여기에는 화면이 쓸 기록을 더했다.

function makeEngine(data) {
  const c = data.constants;
  const shops = new Map(data.shops.map(s => [s.id, s]));
  const supports = new Map(data.supports.map(s => [s.id, s]));
  const traits = new Map(data.traits.map(t => [t.id, t]));
  const byType = type => data.supports.find(s => s.effect.type === type) || null;
  const REST = '휴식';

  // st: { board: 0번 칸(입구)부터의 건물 id(빈 칸은 null), levels: 칸마다의 ★ 수, trend: 이번 웨이브의 유행 업종(없으면 null) }
  function prep(st) {
    const { board, levels } = st; const N = board.length;
    const shopAt = board.map(b => (b && shops.get(b)) || null);
    const supAt = board.map(b => (b && supports.get(b)) || null);
    const typeAt = board.map((b, i) => (supAt[i] ? supAt[i].effect.type : null));
    const shopTiles = []; for (let i = 0; i < N; i++) if (shopAt[i]) shopTiles.push(i);
    const adj1 = i => [(i - 1 + N) % N, (i + 1) % N];
    const adj2 = i => [...new Set([(i - 2 + N) % N, (i - 1 + N) % N, (i + 1) % N, (i + 2) % N])];
    const prev = i => (i - 1 + N) % N;
    // 화면용 기록: 칸마다 걸린 지원(sources), 지원마다 닿는 칸(targets). 계산에는 쓰지 않는다.
    const sources = board.map(() => []), targets = board.map(() => []);
    const note = (i, j, type, value) => { sources[j].push({ from: i, id: board[i], type, value }); if (!targets[i].includes(j)) targets[i].push(j); };

    // 0) 업종. 구름다리: 양옆 1칸이 모두 매장이면 두 매장은 서로의 업종도 갖는다(매장이 본래 가진 업종만 건넨다).
    const kindsAt = board.map((b, i) => (shopAt[i] ? [...shopAt[i].kinds] : null));
    for (let i = 0; i < N; i++) if (typeAt[i] === 'shareKinds') {
      const [a, b] = adj1(i);
      if (shopAt[a] && shopAt[b]) {
        for (const k of shopAt[b].kinds) if (!kindsAt[a].includes(k)) kindsAt[a].push(k);
        for (const k of shopAt[a].kinds) if (!kindsAt[b].includes(k)) kindsAt[b].push(k);
        note(i, a, 'kinds', shopAt[b].kinds.join(', ')); note(i, b, 'kinds', shopAt[a].kinds.join(', '));
      }
    }
    const matches = (j, target) => target === 'shops' ? true : kindsAt[j].includes(target);
    const tilesOf = (i, scope) => (scope === 'all' ? shopTiles : scope === 'adj1' ? adj1(i) : scope === 'adj2' ? adj2(i) : scope === 'prev' ? [prev(i)] : [])
      .filter(j => shopAt[j]);
    const empty = board.filter(b => b === null).length;

    // 1) 요금을 더하는 것부터. "요금이 가장 높은 매장"은 요금을 모두 더한 뒤에 정한다.
    const fee = board.map((b, i) => (shopAt[i] ? shopAt[i].fee : 0));
    const addFee = (i, j, v) => { fee[j] += v; note(i, j, 'fee', v); };
    for (let i = 0; i < N; i++) {
      const s = supAt[i]; if (!s) continue; const e = s.effect;
      if (e.type === 'fee') for (const j of tilesOf(i, e.scope).filter(j => matches(j, e.target))) addFee(i, j, e.amount);
      else if (e.type === 'smelter') for (const j of shopTiles) addFee(i, j, e.feeAll);
      else if (e.type === 'feePerEmpty') for (const j of shopTiles) addFee(i, j, e.amount * empty);
    }
    const best = (tiles, keys) => tiles.reduce((a, j) => {
      if (a === null) return j;
      for (const k of keys) { if (k(j) > k(a)) return j; if (k(j) < k(a)) return a; }
      return a;   // 같으면 입구에서 먼저 나오는 칸
    }, null);
    const top = best(shopTiles, [j => fee[j]]);
    const mostStars = best(shopTiles.filter(j => levels[j] > 0), [j => levels[j], j => fee[j]]);

    // 2) 곱, 주는 스택, 드워프를 가리는 것, 성장, 휴식
    const mult = board.map(() => 1), again = board.map(() => 0), growFee = board.map(() => 0), restMult = board.map(() => 1);
    const giveBonus = board.map(() => 0), vip = board.map(() => false);
    const mul = (i, j, v) => { mult[j] *= v; note(i, j, 'mult', v); };
    for (let i = 0; i < N; i++) {
      const s = supAt[i]; if (!s) continue; const e = s.effect;
      const hit = () => tilesOf(i, e.scope).filter(j => matches(j, e.target));
      if (e.type === 'mult') {
        const tiles = e.scope === 'duplicates' ? shopTiles.filter(j => shopTiles.filter(q => board[q] === board[j]).length >= 2) : hit();
        for (const j of tiles) mul(i, j, e.amount);
      } else if (e.type === 'growFee') for (const j of hit()) { growFee[j] += e.amount; note(i, j, 'growFee', e.amount); }
      else if (e.type === 'restMult') for (const j of hit()) { restMult[j] *= e.amount; note(i, j, 'restMult', e.amount); }
      else if (e.type === 'campus') for (const j of tilesOf(i, 'adj1')) { mul(i, j, e.mult); giveBonus[j] += e.giveBonus; note(i, j, 'giveBonus', e.giveBonus); }
      else if (e.type === 'smelter') for (const j of tilesOf(i, 'adj1')) mul(i, j, e.multAdj);
      else if (e.type === 'popup') for (const j of tilesOf(i, 'adj1')) mul(i, j, e.mult);
      else if (e.type === 'vip') for (const j of tilesOf(i, 'adj1')) { mul(i, j, e.mult); vip[j] = true; note(i, j, 'vip', 1); }
      else if (e.type === 'original') {   // 이전 칸의 매장. 그 매장의 업종을 가진 매장이 보드에 또 있으면 효과가 없다
        const j = prev(i);
        if (shopAt[j]) { if (!shopTiles.some(q => q !== j && kindsAt[q].some(k => kindsAt[j].includes(k)))) mul(i, j, e.mult); else note(i, j, 'off', 1); }
      } else if (e.type === 'streak') {   // 같은 업종을 가진 매장이 e.min칸 이상 이어진 구간. 고리의 끝과 입구도 이어진다. 한 매장에는 한 번만 건다
        const marked = new Set();
        for (const k of c.kinds) {
          const has = j => !!shopAt[j] && kindsAt[j].includes(k);
          for (let j = 0; j < N; j++) if (has(j) && !has(prev(j))) {
            const run = []; for (let q = j; has(q); q = (q + 1) % N) run.push(q);
            if (run.length >= e.min) run.forEach(q => marked.add(q));
          }
        }
        for (const j of marked) mul(i, j, e.mult);
      } else if (e.type === 'trend') { if (st.trend) for (const j of shopTiles) if (kindsAt[j].includes(st.trend)) mul(i, j, e.mult); }
      else if (e.type === 'branch') { if (top !== null) note(i, top, 'branch', 1); }
      else if (e.type === 'everyNth') { if (shopAt[prev(i)]) note(i, prev(i), 'everyNth', e.mult); }
      else if (e.type === 'merger') { const [a, b] = adj1(i); if (shopAt[a] && shopAt[b]) { note(i, a, 'merger', 1); note(i, b, 'merger', 1); } }
      else if (e.type === 'roundabout') for (let k = Math.max(0, i - e.tiles); k < i; k++) targets[i].push(k);
    }
    const starMult = board.map((b, i) => (shopAt[i] ? Math.pow(c.upgrade.salesMultPerStar, levels[i]) : 1));
    for (const j of shopTiles) mult[j] *= starMult[j];   // ★ 하나마다 ×2

    // 3) 드워프가 지나갈 때 일하는 것과 보드 어디에 있든 일하는 것
    const passAt = board.map((b, i) => (typeAt[i] === 'pass' ? supAt[i].effect : null));
    const branchAt = board.map((b, i) => typeAt[i] === 'branch');
    const roundabout = typeAt.indexOf('roundabout');
    const roundaboutTiles = roundabout >= 0 ? supAt[roundabout].effect.tiles : 0;
    const keep = supAt.filter(s => s && s.effect.type === 'keepStack').map(s => s.effect.stack);
    const tipSup = supAt.find(s => s && s.effect.type === 'tip'); const tipDivisor = tipSup ? tipSup.effect.divisor : 0;
    const ev = typeAt.indexOf('everyNth');
    const eventTile = ev >= 0 && shopAt[prev(ev)] ? prev(ev) : null; const eventEffect = ev >= 0 ? supAt[ev].effect : null;
    // 거리 표지판: 휴식을 뺀 업종 가운데 그 업종을 가진 매장이 가장 많은 업종. 같으면 그 업종의 첫 매장이 입구에 가까운 쪽, 그것도 같으면 업종의 정해진 순서
    const mostKind = () => {
      let kind = null, bestCount = 0, bestFirst = N;
      for (const k of c.kinds) {
        if (k === REST) continue;
        const tiles = shopTiles.filter(j => kindsAt[j].includes(k)); if (!tiles.length) continue;
        if (tiles.length > bestCount || (tiles.length === bestCount && tiles[0] < bestFirst)) { kind = k; bestCount = tiles.length; bestFirst = tiles[0]; }
      }
      return kind;
    };
    const likeAll = typeAt.includes('likeMost') ? mostKind() : null;
    return { N, board, levels, shopAt, supAt, typeAt, shopTiles, kindsAt, fee, mult, starMult, again, growFee, restMult, giveBonus, vip, top, mostStars, passAt, branchAt,
      roundabout, roundaboutTiles, keep, tipDivisor, eventTile, eventEffect, likeAll, mostKind: mostKind(), trend: st.trend || null, empty, sources, targets };
  }

  const feeAt = (info, j, g) => info.fee[j] + info.growFee[j] * g;
  // 이 드워프가 좋아하는 업종(거리 표지판이 더한 것까지)과 칸마다의 취향
  const likesOf = (info, dwarf) => (info.likeAll && !dwarf.likes.includes(info.likeAll) ? [...dwarf.likes, info.likeAll] : dwarf.likes);
  function tasteOf(info, i, dwarf) {
    if (!info.shopAt[i]) return 0;
    const like = info.kindsAt[i].some(k => likesOf(info, dwarf).includes(k)), dis = info.kindsAt[i].includes(dwarf.dislike);
    return like && !dis ? c.satisfaction.like : dis && !like ? c.satisfaction.dislike : 0;
  }

  // 드워프 한 마리를 보낸다. g0: 이 웨이브에서 지금까지 돈 추가 바퀴 수. sales: 칸마다의 매출을 더해 갈 배열.
  // ctx.eventCount: 이벤트 부스가 센 이용 수(건물에 남는다). options.events가 false면 기록을 남기지 않는다.
  function runDwarf(info, dwarf, g0 = 0, sales = null, ctx = { eventCount: 0 }, options = {}) {
    const trait = dwarf.trait ? traits.get(dwarf.trait).effect : {};
    const start = trait.lapStart || {};
    const baseLaps = trait.baseLaps || c.baseLaps;
    const fresh = () => ({ h: (start.hunger || 0) - (start.fullness || 0), d: start.tipsy || 0, y: start.hype || 0, tired: 0 });   // h: 양수는 허기, 음수는 포만감
    const likes = likesOf(info, dwarf);
    const likeAt = info.board.map((b, i) => !!info.shopAt[i] && info.kindsAt[i].some(k => likes.includes(k)));
    const taste = info.board.map((b, i) => tasteOf(info, i, dwarf));
    const log = options.events === false ? null : [];
    let st = fresh(), sat = 0, cost = c.extraLapCost.first, laps = 0, total = 0, bestPay = 0, step = 0, lap = 1;
    const amount = name => name === 'hunger' ? Math.max(st.h, 0) : name === 'fullness' ? Math.max(-st.h, 0) : name === 'tipsy' ? st.d : st.y;
    const snap = () => ({ h: st.h, d: st.d, y: st.y, tired: st.tired, sat });
    // 이용 한 번. 지나치면 null.
    const use = (j, g, ev) => {
      const s = info.shopAt[j];
      if (s.skip === 'drunk' && st.d >= c.thresholds.drunk) { if (ev) ev.skip = 'drunk'; return null; }
      if (s.skip === 'full' && -st.h >= c.thresholds.full) { if (ev) ev.skip = 'full'; return null; }
      if (info.vip[j] && !likeAt[j]) { if (ev) ev.skip = 'vip'; return null; }   // VIP 라운지: 그 업종을 좋아하지 않는 드워프는 지나친다
      let add = 0; for (const r of s.read) add += r.per * amount(r.stack);
      let m = info.mult[j];
      const over = !!(s.threshold && amount(s.threshold.stack) >= s.threshold.at);
      if (over) m *= s.threshold.mult;
      let nth = null, nthHit = false;
      if (j === info.eventTile) { ctx.eventCount += 1; nth = ctx.eventCount; if (ctx.eventCount % info.eventEffect.every === 0) { m *= info.eventEffect.mult; nthHit = true; } }
      const raw = (info.fee[j] + info.growFee[j] * g + add) * m;
      const pay = Math.floor(raw);
      if (ev) Object.assign(ev, { fee: info.fee[j] + info.growFee[j] * g, terms: s.read.map(r => ({ stack: r.stack, count: amount(r.stack), per: r.per })), add,
        baseMult: info.mult[j], threshold: over ? s.threshold : null, nth, nthHit, nthMult: nthHit ? info.eventEffect.mult : null, nthEvery: nth ? info.eventEffect.every : null, mult: m, raw, pay });
      for (const r of s.read) if (r.consume) { if (r.stack === 'fullness') { if (st.h < 0) st.h = 0; } else if (r.stack === 'tipsy') st.d = 0; else if (r.stack === 'hype') st.y = 0; }
      const b = info.giveBonus[j], gv = s.give, plus = x => (x > 0 ? x + b : 0);   // 대학교: 그 매장이 주는 스택마다 더 준다
      st.h += plus(gv.hunger) - plus(gv.fullness); st.d += plus(gv.tipsy); st.y += plus(gv.hype);
      return pay;
    };
    const isRest = j => info.shopAt[j].kinds.includes(REST);   // 휴식의 일은 매장이 본래 가진 업종으로만 본다
    // 칸 하나를 지난다. back: 회전교차로로 다시 지나는 것
    const visit = (i, g, back) => {
      const base = () => (log ? { type: 'use', lap, step, tile: i, shopTile: i, via: back ? 'roundabout' : null, before: snap() } : null);
      if (info.shopAt[i]) {
        for (let u = 0; u <= info.again[i]; u++) {
          const ev = base(); if (ev && u > 0) ev.via = 'again';
          const pay = use(i, g, ev);
          if (pay === null) { if (log) { ev.type = 'skip'; log.push(ev); } break; }
          total += pay; if (sales) sales[i] += pay; if (pay > bestPay) bestPay = pay;
          let restGain = 0, restFrom = null;
          if (isRest(i)) {
            if (u === 0) {
              const r = info.shopAt[i].rest; let gain;
              restFrom = st.tired;
              if (r.mode === 'consumePer') { gain = Math.floor(st.tired / r.per); st.tired = 0; }
              else if (r.mode === 'per') gain = Math.floor(st.tired / r.per);
              else gain = st.tired >= r.at ? r.gain : 0;
              if (gain > 0) { restGain = gain * info.restMult[i]; sat += restGain; }
            }
          } else st.tired += c.fatiguePerUse;
          sat += taste[i];
          if (log) { Object.assign(ev, { satChange: taste[i], restGain, restFrom, after: snap(), total }); log.push(ev); }
        }
      } else if (info.branchAt[i]) {   // 2호점: 요금이 가장 높은 매장을 이 칸에서 이용한다. 만족도는 바뀌지 않는다
        if (info.top !== null) {
          const j = info.top, ev = base(); if (ev) { ev.shopTile = j; ev.via = 'branch'; }
          const pay = use(j, g, ev);
          if (pay !== null) {
            total += pay; if (sales) sales[j] += pay; if (pay > bestPay) bestPay = pay;
            if (!isRest(j)) st.tired += c.fatiguePerUse;
            if (log) { Object.assign(ev, { satChange: 0, restGain: 0, restFrom: null, after: snap(), total }); log.push(ev); }
          } else if (log) { ev.type = 'skip'; log.push(ev); }
        }
      } else if (info.passAt[i]) {   // 산책로, 언덕길, 버스킹 존
        const e = info.passAt[i], before = log ? snap() : null;
        for (const k of e.consume || []) { if (k === 'fullness') { if (st.h < 0) st.h = 0; } else if (k === 'tipsy') st.d = 0; else if (k === 'hype') st.y = 0; }
        if (e.convert) { const v = amount(e.convert.from); if (e.convert.from === 'tipsy') st.d = 0; if (e.convert.to === 'hype') st.y += v; }
        if (e.give) { st.h += (e.give.hunger || 0) - (e.give.fullness || 0); st.d += e.give.tipsy || 0; st.y += e.give.hype || 0; st.tired += e.give.fatigue || 0; }
        if (log) log.push({ type: 'pass', lap, step, tile: i, via: back ? 'roundabout' : null, before, after: snap() });
      }
    };
    for (;;) {
      const g = g0 + Math.max(0, laps - baseLaps + 1);   // 추가 바퀴에 들어설 때마다 한 번 자란다
      const lapStartTotal = total; lap = laps + 1; step = 0;
      const path = [];   // 이 바퀴에 걷는 칸의 차례. 화면이 이대로 걷는다
      const head = log ? { type: 'lapStart', lap, g, extra: laps >= baseLaps, extraNo: Math.max(0, laps - baseLaps + 1), stacks: snap(), sat, cost, baseLaps, path } : null;
      if (log) log.push(head);
      for (let i = 0; i < info.N; i++) {
        path.push({ tile: i, back: false });
        // 회전교차로: 이 칸에 오면 이전 칸들을 한 번 더 지난다. 입구 앞으로는 넘어가지 않는다
        if (i === info.roundabout) { step++; for (let k = Math.max(0, i - info.roundaboutTiles); k < i; k++) { path.push({ tile: k, back: true }); visit(k, g, true); step++; } }
        else { visit(i, g, false); step++; }
      }
      laps += 1;
      const end = log ? { type: 'lapEnd', lap, lapSales: total - lapStartTotal, total, stacksBefore: snap(), satBefore: sat } : null;
      const kept = st; st = fresh();
      if (info.keep.includes('hype')) st.y += kept.y;   // 전광판: 흥은 바퀴를 넘어 남는다
      let result = 'base';
      if (laps >= baseLaps) {
        if (sat >= cost) { sat -= cost; if (end) end.paid = cost; cost *= c.extraLapCost.multiplier; result = 'extra'; }
        else { result = 'leave'; if (end) end.needed = cost; }
      }
      if (end) { Object.assign(end, { result, sat, cost, keptHype: info.keep.includes('hype') ? kept.y : 0 }); log.push(end); }
      if (result === 'leave') break;
    }
    const tip = info.tipDivisor && sat > 0 ? Math.floor(total * sat / info.tipDivisor) : 0;   // 팁 상자
    return { sales: total, laps, extraLaps: laps - baseLaps, tip, bestPay, satLeft: sat, events: log, g0, baseLaps };
  }

  // 웨이브 하나: 보낸 순서대로 드워프를 돌린다. 검증 사례와 같은 꼴을 돌려준다.
  function runWave(st, wave) {
    const info = prep(st); const sales = st.board.map(() => 0); let g = 0; const perDwarf = []; const ctx = { eventCount: st.eventCount || 0 };
    for (const d of wave) { const r = runDwarf(info, d, g, sales, ctx, { events: false }); perDwarf.push({ sales: r.sales, laps: r.laps, extraLaps: r.extraLaps, tip: r.tip }); g += r.extraLaps; }
    return { perDwarf, waveSales: perDwarf.reduce((a, r) => a + r.sales, 0), tips: perDwarf.reduce((a, r) => a + r.tip, 0), salesByTile: sales,
      topTile: info.top, feeByTile: st.board.map((b, i) => (info.shopAt[i] ? info.fee[i] : null)), multByTile: st.board.map((b, i) => (info.shopAt[i] ? info.mult[i] : null)),
      kindsByTile: info.kindsAt, likeAll: info.likeAll, eventCount: ctx.eventCount };
  }

  // 웨이브가 끝났을 때(판정을 통과한 뒤) 보드에 일어나는 일. 순서: 대기업 사옥, 팝업 스토어, 공사 현장. (3.6절의 3~6)
  // s: { board, levels, timers: { 건물 id: 남은 횟수 }, money }, salesByTile: 방금 끝난 웨이브에 칸마다 들어온 매출
  function endWave(s, salesByTile) {
    const board = [...s.board], levels = [...s.levels], timers = { ...s.timers }, lastSales = [...salesByTile]; let money = s.money; const events = [];
    const N = board.length; const isShop = i => !!board[i] && shops.has(board[i]);
    const typeOf = id => (id && supports.get(id) ? supports.get(id).effect.type : null);
    const hq = board.findIndex(b => typeOf(b) === 'merger');
    if (hq >= 0) {
      const a = (hq - 1 + N) % N, b = (hq + 1) % N;
      if (isShop(a) && isShop(b)) {
        // 매출이 높은 쪽이 남는다. 같으면 ★이 많은 쪽, 그것도 같으면 입구에서 먼저 나오는 쪽
        const lo = Math.min(a, b), hi = Math.max(a, b);
        const win = salesByTile[lo] !== salesByTile[hi] ? (salesByTile[lo] > salesByTile[hi] ? lo : hi) : levels[lo] !== levels[hi] ? (levels[lo] > levels[hi] ? lo : hi) : lo;
        const lose = win === lo ? hi : lo;
        if (levels[win] < c.upgrade.maxStars) {   // 남는 쪽이 이미 ★★★이면 아무 일도 없다
          if (board.some(x => typeOf(x) === 'demolitionIncome')) { money += salesByTile[lose]; events.push({ type: 'demolitionIncome', tile: lose, amount: salesByTile[lose] }); }
          events.push({ type: 'merger', demolished: lose, shop: board[lose], starTo: win });
          board[lose] = null; levels[lose] = 0; lastSales[lose] = 0; levels[win] += 1;
        }
      }
    }
    for (const [type, becomes] of [['popup', () => null], ['construction', e => e.becomes]]) {
      const i = board.findIndex(b => typeOf(b) === type); if (i < 0) continue;
      const id = board[i];
      timers[id] -= 1;
      if (timers[id] <= 0) { const to = becomes(supports.get(id).effect); board[i] = to; delete timers[id]; events.push({ type: to ? 'built' : 'gone', tile: i, id }); }
    }
    return { board, levels, timers, money, lastSales, events };
  }

  // 다음 정비를 시작할 때. 순서: 칸이 는다, 은행의 이자. (3.6절의 8~9)
  function startPrep(s, waveNo) {
    const board = [...s.board], levels = [...s.levels]; let money = s.money;
    while (board.length < data.waves[waveNo - 1].tiles) { board.push(null); levels.push(0); }   // 새 칸은 고리의 끝(마지막 칸과 입구 사이)에 생긴다
    const bank = board.map(b => b && supports.get(b)).find(x => x && x.effect.type === 'interest');
    if (bank) money += Math.floor(money / bank.effect.divisor);
    return { ...s, board, levels, money };
  }

  // 업그레이드 비용: 그 매장이 지난 웨이브에 올린 매출의 두 배, 최소 10.
  const upgradeCost = lastWaveSales => Math.max(c.upgrade.minCost, Math.floor(lastWaveSales * c.upgrade.costFactor));
  // 새로고침 비용: 그 웨이브의 처음 값에서 시작해 누를 때마다 두 배. presses: 이번 정비에서 지금까지 누른 횟수.
  const refreshCost = (waveNo, presses) => data.waves[waveNo - 1].refreshBase * Math.pow(c.refresh.multiplierPerPress, presses);

  return { prep, runDwarf, runWave, endWave, startPrep, upgradeCost, refreshCost, feeAt, tasteOf, likesOf, byType,
    shop: id => shops.get(id), support: id => supports.get(id), building: id => shops.get(id) || supports.get(id), trait: id => traits.get(id) };
}

// 숫자를 화면에 적는 법. 2.5, 0.75처럼 필요한 자리까지만.
const fmtNum = x => (Number.isInteger(x) ? String(x) : String(Math.round(x * 1000) / 1000));

// 이용 기록 한 줄을 계산식 글자로. stackNames: 스택의 이름(허기, 포만감, 취기, 흥).
// 예: "6 + 허기 3 × 8 = 30", "(12 + 취기 3 × 4) × 3 × 2(만취 상태) × 5(5번째 이용) = 720"
function formulaText(ev, stackNames) {
  const terms = ev.terms.filter(t => t.count > 0).map(t => `${stackNames[t.stack]} ${t.count} × ${t.per}`);
  const sum = [fmtNum(ev.fee), ...terms].join(' + ');
  const mults = [];
  if (ev.baseMult !== 1) mults.push(fmtNum(ev.baseMult));
  if (ev.threshold) {
    const label = ev.threshold.stack === 'tipsy' ? '만취 상태' : ev.threshold.stack === 'fullness' ? '포만 상태' : `${stackNames[ev.threshold.stack]} ${ev.threshold.at} 이상`;
    mults.push(`${fmtNum(ev.threshold.mult)}(${label})`);
  }
  if (ev.nthHit) mults.push(`${fmtNum(ev.nthMult)}(${ev.nthEvery}번째 이용)`);
  if (!mults.length) return terms.length ? `${sum} = ${ev.pay}` : `요금 ${ev.pay}`;
  const floored = ev.raw !== ev.pay ? ' (소수 버림)' : '';
  return `${terms.length ? `(${sum})` : sum} × ${mults.join(' × ')} = ${ev.pay}${floored}`;
}

// 허기와 포만감은 한 눈금이다. 양수면 허기, 음수면 포만감.
const gaugeText = h => (h > 0 ? `허기 ${h}` : h < 0 ? `포만감 ${-h}` : '허기 0');

// ── js/rng.js
// 시드로 다시 만들 수 있는 무작위. 같은 시드 글자 → 같은 수열.
function hash(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

function makeRng(seedText) {
  let a = hash(String(seedText));
  const rand = () => {                    // mulberry32
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    rand,
    int: n => Math.floor(rand() * n),
    shuffle(list) {
      const a2 = list.slice();
      for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; }
      return a2;
    },
    weighted(items, weightOf) {
      const total = items.reduce((s, x) => s + weightOf(x), 0);
      let r = rand() * total;
      for (const x of items) { r -= weightOf(x); if (r < 0) return x; }
      return items[items.length - 1];
    },
  };
}

const randomSeed = () => Math.random().toString(36).slice(2, 8).toUpperCase();

// ── js/game.js
// 한 런의 진행 (시제품 1차 제작 요청서 3절과 4.3절). DOM을 쓰지 않는다. 계산은 engine.js에 맡긴다.
// 단계(phase): intro(런 시작) → prep(정비) → pick(웨이브: 드워프 고르기) ×3~4 → judge(판정) → prep … → over
// 건물은 데이터의 effect.type으로만 가린다. 데이터에서 건물을 빼면 그 건물 없이 돌아간다.



function createGame(data, { seed, targetMult = 1, traits = true, deckColor = true, supportRate = null, disabled = [], forced = [] } = {}) {
  const c = data.constants;
  const engine = makeEngine(data);
  const isShop = id => !!engine.shop(id);
  const typeOf = id => (id && engine.support(id) ? engine.support(id).effect.type : null);
  const candRng = makeRng(`${seed}/candidates`);   // 후보, 드워프, 유행은 서로 다른 수열을 쓴다
  const neverDisliked = data.tasteKinds
    ? data.tasteKinds.filter(k => !data.dwarves.some(d => d.dislike === k))
    : c.kinds.filter(k => data.dwarves.some(d => d.likes.includes(k)) && !data.dwarves.some(d => d.dislike === k));
  const tasteKinds = data.tasteKinds || c.kinds.filter(k => data.dwarves.some(d => d.likes.includes(k)));   // 취향에 드는 업종(휴식을 뺀 일곱)
  const rate = supportRate == null ? c.candidateRates.support : supportRate;

  const s = {
    seed: String(seed),
    options: { targetMult, traits, deckColor, supportRate: rate, disabled: [...disabled], forced: forced.slice(0, 3) },
    phase: 'intro',
    wave: 0,                                   // 0부터. 화면에는 +1
    money: c.startMoney,
    borrowed: 0,                               // 대출 창구로 빌린 돈. 남은 목표가 그만큼 올라 있다
    board: new Array(data.waves[0].tiles).fill(null),   // 칸마다 null 또는 { id, stars, lastSales, waveSales }. lastSales가 null이면 이번 정비에 지은 건물
    newTiles: [],                              // 이번 정비에 새로 생긴 칸
    candidates: new Array(c.candidates).fill(null),     // { id, locked } 또는 null
    buildsLeft: 0, upgradesLeft: 0, refreshPresses: 0,
    timers: {},                                // 팝업 스토어와 공사 현장의 남은 횟수 { 건물 id: 수 }
    eventCount: 0,                             // 이벤트 부스의 세기. 건물에 남는다
    deck: [], popular: [], unpopular: [],
    trends: [],                                // 웨이브마다의 유행하는 업종(잡지사). 런을 시작할 때 미리 뽑는다
    hand: [], order: [], orderPos: 0, sendIndex: 0, sends: c.sendsPerWave,
    g: 0,                                      // 이 웨이브에서 성장 지원이 자란 횟수(추가 바퀴 수)
    waveSales: 0, waveTips: 0, waveSends: [],
    results: [],                               // 웨이브마다 { wave, sales, tips, moneyAfter, target, passed, sends }
    log: [],                                   // 웨이브마다 기록 복사에 쓸 것 { seen, built, demolished, upgraded, notes }
    notices: [],                               // 화면이 알릴 일(이자, 철거로 얻은 돈, 빌린 돈, 대기업 사옥 들). 화면이 읽고 비운다
    bestPay: null, maxLaps: 0,
    judge: null, outcome: null,                // outcome: 'clear' | 'fail'
  };
  const targetOf = wave => Math.ceil(data.waves[wave].target * s.options.targetMult) + (wave >= s.wave ? s.borrowed : 0);
  const target = () => targetOf(s.wave);
  const ids = () => s.board.map(b => (b ? b.id : null));
  const levels = () => s.board.map(b => (b ? b.stars : 0));
  const has = type => s.board.some(b => b && typeOf(b.id) === type);
  const prep = () => engine.prep({ board: ids(), levels: levels(), trend: s.trends[s.wave] || null });
  const noteLog = () => s.log[s.wave];
  const nameOf = id => engine.building(id).name;

  // 덱: 90마리에서 30마리, 덱의 색, 특성 (규칙 문서 v3의 5.2절). 런을 시작할 때 한 번 뽑는다
  function buildDeck() {
    const rng = makeRng(`${s.seed}/deck`), dk = c.deck, w = dk.weights;
    if (s.options.deckColor) {
      s.popular = rng.shuffle(tasteKinds).slice(0, dk.popularKinds);
      s.unpopular = rng.shuffle(tasteKinds.filter(k => !s.popular.includes(k) && !neverDisliked.includes(k))).slice(0, dk.unpopularKinds);
    }
    const weight = d => {
      let x = 1;
      for (const k of d.likes) { if (s.popular.includes(k)) x *= w.likePopular; if (s.unpopular.includes(k)) x *= w.likeUnpopular; }
      if (s.unpopular.includes(d.dislike)) x *= w.dislikeUnpopular;
      if (s.popular.includes(d.dislike)) x *= w.dislikePopular;
      return x;
    };
    const pool = data.dwarves.slice(), deck = [];
    while (deck.length < dk.size && pool.length) { const d = rng.weighted(pool, weight); pool.splice(pool.indexOf(d), 1); deck.push({ ...d, trait: null }); }
    if (s.options.traits) {
      const lucky = rng.shuffle(deck.map((_, i) => i)).slice(0, dk.traitsEach * data.traits.length);
      lucky.forEach((di, n) => { deck[di].trait = data.traits[n % data.traits.length].id; });
    }
    s.deck = deck;
  }
  // 잡지사: 웨이브 열 개의 유행을 미리 뽑는다. 여덟 업종에서 고르게, 바로 앞 웨이브와 같은 업종은 뽑지 않는다
  function buildTrends() {
    const rng = makeRng(`${s.seed}/trend`);
    for (let w = 0; w < data.waves.length; w++) { const pool = c.kinds.filter(k => k !== s.trends[w - 1]); s.trends.push(pool[rng.int(pool.length)]); }
  }

  // 후보에 나올 수 있는 지원 건물인가 (3.3절)
  function supportAllowed(x, taken) {
    if (x.inCandidates === false || s.options.disabled.includes(x.id) || taken.has(x.id)) return false;
    if (x.effect.type === 'construction') {   // 공사 현장: 보드에 공사 현장이나 랜드마크가 있으면, 그리고 정해진 웨이브 뒤로는 나오지 않는다
      if (s.board.some(b => b && (b.id === x.id || b.id === x.effect.becomes))) return false;
      if (c.constructionLastWave != null && s.wave + 1 > c.constructionLastWave) return false;
    }
    return true;
  }
  // 후보 한 장: 묶음(매장/지원 건물)을 확률로 뽑고 그 안에서 고르게. 뽑을 지원 건물이 없으면 매장을 뽑는다
  function fillSlots(slots, forcedIds = []) {
    const taken = new Set(s.board.filter(b => b && !isShop(b.id)).map(b => b.id));
    s.candidates.forEach((cd, i) => { if (cd && !slots.includes(i) && !isShop(cd.id)) taken.add(cd.id); });
    const queue = forcedIds.filter(id => engine.support(id) && supportAllowed(engine.support(id), taken));
    for (const i of slots) {
      let pick;
      if (queue.length) pick = engine.support(queue.shift());
      else {
        const pool = candRng.rand() < s.options.supportRate ? data.supports.filter(x => supportAllowed(x, taken)) : [];
        const from = pool.length ? pool : data.shops;
        pick = from[candRng.int(from.length)];
      }
      s.candidates[i] = { id: pick.id, locked: false };
      if (!isShop(pick.id)) { taken.add(pick.id); const seen = noteLog().seen; if (!seen.includes(pick.id)) seen.push(pick.id); }
    }
  }
  const unlockedSlots = () => s.candidates.map((cd, i) => (cd && cd.locked ? -1 : i)).filter(i => i >= 0);

  // 정비를 시작할 때 (3.6절의 8~10): 칸이 늘고, 은행의 이자가 들어오고, 새로고침의 비용이 처음으로 돌아가고, 후보가 나온다
  function enterPrep() {
    s.phase = 'prep'; s.judge = null;
    s.log[s.wave] = { seen: [], built: [], demolished: [], upgraded: [], notes: [] };
    const r = engine.startPrep({ board: ids(), levels: levels(), timers: s.timers, money: s.money }, s.wave + 1);
    s.newTiles = [];
    while (s.board.length < r.board.length) { s.newTiles.push(s.board.length); s.board.push(null); }
    if (r.money !== s.money) { const amount = r.money - s.money; s.money = r.money; s.notices.push({ type: 'interest', amount }); noteLog().notes.push(`이자 +${amount}`); }
    s.buildsLeft = c.buildsPerPrep;
    s.upgradesLeft = c.upgrade.perPrep;
    s.refreshPresses = 0;
    fillSlots(unlockedSlots(), s.wave === 0 ? s.options.forced : []);   // 잠근 후보만 남고 나머지는 새로 뽑는다
  }

  const refreshCost = () => engine.refreshCost(s.wave + 1, s.refreshPresses);
  const canRefresh = () => s.phase === 'prep' && s.money >= refreshCost() && unlockedSlots().length > 0;
  const canMove = () => s.phase === 'prep' || s.phase === 'pick';

  // 업그레이드를 할 수 있는가. 안 되면 까닭: support | new | once | max | money
  function upgradeInfo(tile) {
    const b = s.board[tile];
    if (!b || s.phase !== 'prep') return { ok: false, reason: 'phase' };
    if (!isShop(b.id)) return { ok: false, reason: 'support' };
    if (b.stars >= c.upgrade.maxStars) return { ok: false, reason: 'max' };
    if (b.lastSales == null) return { ok: false, reason: 'new' };
    const cost = engine.upgradeCost(b.lastSales);
    if (s.upgradesLeft <= 0) return { ok: false, reason: 'once', cost };
    if (s.money < cost) return { ok: false, reason: 'money', cost };
    return { ok: true, cost };
  }

  function nextHand(returning) {
    const take = c.handSize - (returning ? 1 : 0);
    const drawn = s.order.slice(s.orderPos, s.orderPos + take).map(i => s.deck[i]);
    s.orderPos += take;
    s.hand = returning ? [returning, ...drawn] : drawn;
  }

  const api = {
    state: s, data, engine, c,
    target, targetOf, prep, refreshCost, canRefresh, canMove, upgradeInfo, has,
    finalMoney: () => s.money - s.borrowed,   // 끝 화면과 최고 기록은 빌린 돈을 뺀 값이다
    takeNotices() { const n = s.notices; s.notices = []; return n; },

    begin() { if (s.phase !== 'intro') return false; enterPrep(); return true; },

    build(slot, tile) {
      const cd = s.candidates[slot];
      if (s.phase !== 'prep' || !cd || s.buildsLeft <= 0 || tile == null || s.board[tile] !== null) return false;
      if (!isShop(cd.id) && s.board.some(b => b && b.id === cd.id)) return false;   // 같은 지원 건물은 한 채만
      s.board[tile] = { id: cd.id, stars: 0, lastSales: null, waveSales: 0 };
      s.candidates[slot] = null;
      s.buildsLeft -= 1;
      noteLog().built.push(cd.id);
      const e = engine.support(cd.id) ? engine.support(cd.id).effect : null;
      if (e && e.waves) s.timers[cd.id] = e.waves;   // 팝업 스토어, 공사 현장: 남은 횟수
      if (e && e.type === 'loan') {                  // 대출 창구: 이번 웨이브의 지금 목표만큼 얻고, 남은 목표가 그만큼 오른다
        const amount = target();
        s.money += amount; s.borrowed += amount;
        s.notices.push({ type: 'loan', amount }); noteLog().notes.push(`빌린 돈 +${amount}`);
      }
      return true;
    },

    // 자리 바꾸기: 빈 칸으로 옮기거나 두 건물의 자리를 바꾼다. ★과 매출 기록은 건물을 따라간다.
    move(from, to) {
      if (!canMove() || from === to || !s.board[from] || to == null || to < 0 || to >= s.board.length) return false;
      [s.board[from], s.board[to]] = [s.board[to], s.board[from]];
      return true;
    },

    // 철거: 무료. 건설 횟수는 돌아오지 않는다. ★도 사라진다. 철거 업체가 있으면 매장의 지난 웨이브 매출만큼 얻는다.
    demolish(tile) {
      const b = s.board[tile];
      if (s.phase !== 'prep' || !b) return false;
      if (isShop(b.id) && has('demolitionIncome')) {
        const amount = b.lastSales || 0;   // 이번 정비에 지은 매장은 0
        s.money += amount; s.notices.push({ type: 'demolitionIncome', amount, name: nameOf(b.id) });
        if (amount) noteLog().notes.push(`철거 +${amount}`);
      }
      delete s.timers[b.id];
      if (typeOf(b.id) === 'everyNth') s.eventCount = 0;   // 이벤트 부스를 철거하면 세기가 사라진다
      s.board[tile] = null;
      noteLog().demolished.push(b.id);
      return true;
    },

    upgrade(tile) {
      const u = upgradeInfo(tile);
      if (!u.ok) return false;
      s.money -= u.cost; s.upgradesLeft -= 1; s.board[tile].stars += 1;
      noteLog().upgraded.push(s.board[tile].id);
      return true;
    },

    toggleLock(slot) {
      const cd = s.candidates[slot];
      if (s.phase !== 'prep' || !cd) return false;
      cd.locked = !cd.locked;
      return true;
    },

    refresh() {
      if (!canRefresh()) return false;
      s.money -= refreshCost();
      s.refreshPresses += 1;
      fillSlots(unlockedSlots());
      return true;
    },

    startWave() {
      if (s.phase !== 'prep') return false;
      s.phase = 'pick';
      s.order = makeRng(`${s.seed}/dwarves/${s.wave}`).shuffle(s.deck.map((_, i) => i));

  html += `<div id="center" style="grid-row:2/${rows};grid-column:2/${cols}"></div><div id="fx"><div id="token" hidden>🧔</div></div>`;
  const board = $('board');
  board.innerHTML = html;
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; board.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  board.className = sizeClass(N) + (ui.play && ui.play.fever ? ` fever f${Math.min(ui.play.fever, 4)}` : '');
  if (ui.play && ui.play.tile >= 0) placeToken(ui.play.tile, 0);
}

function renderCenter() {
  const s = game.state, P = ui.play, el = $('center');
  if (!el) return;
  if (P) {
    el.innerHTML = `<div class="cbox"><div class="ctitle">${P.out.dwarf.name} <small>${P.fever ? `🔥 추가 바퀴 ${P.fever}` : `바퀴 ${P.lap}`}</small></div>
      <div class="cbig">+${won(P.total)}</div>${P.banner ? `<div class="banner ${P.banner.cls}">${P.banner.html}</div>` : ''}</div>`;
  } else if (s.phase === 'judge') {
    const j = s.judge;
    el.innerHTML = `<div class="cbox judge ${j.passed ? 'pass' : 'failj'}"><div class="ctitle">${j.cleared ? '🎉 클리어!' : j.passed ? '목표 달성!' : '런이 끝났어요'}</div>
      ${j.passed ? `<div class="cbig">목표의 ${j.ratio.toFixed(1)}배</div>` : `<div class="csub">목표에 ${won(j.target - j.money)} 모자랐어요.</div>`}
      <button class="primary" data-act="proceed">${j.cleared || !j.passed ? '결과 보기' : '다음 정비'}</button></div>`;
  } else if (s.phase === 'prep') {
    el.innerHTML = `<div class="cbox"><div class="ctitle">정비 <small>${waveLabel()}</small></div><div class="csub">후보에서 건물을 골라 칸에 지으세요.</div></div>`;
  } else if (s.phase === 'pick') {
    el.innerHTML = `<div class="cbox"><div class="ctitle">웨이브 <small>보내기 ${s.sendIndex + 1} / ${s.sends}</small></div><div class="csub">셋 가운데 하나를 골라 보내세요.</div></div>`;
  } else el.innerHTML = '';
}

const deckLabel = () => {
  const s = game.state;
  return s.popular.length ? `<span class="decklabel">인기 ${s.popular.map(k => chip(k)).join('')} · 비인기 ${s.unpopular.map(k => chip(k)).join('')}</span>` : '<span class="decklabel dim">덱의 색 없음</span>';
};
// 잡지사가 보드나 후보에 있을 때만 이번 웨이브의 유행을 보여 준다
const trendLabel = () => {
  const s = game.state, on = [...s.board, ...s.candidates].some(x => x && typeOf(x.id) === 'trend');
  return on && ui.info.trend ? ` · <span class="decklabel">이번 웨이브의 유행: ${kindTok(ui.info.trend)}</span>` : '';
};
const plannedSends = () => c.sendsPerWave + game.state.board.reduce((a, b) => a + (b && typeOf(b.id) === 'extraSend' ? bld(b.id).effect.amount : 0), 0);
const judgeEventText = e => (e.type === 'merger' ? `${e.demolished}을(를) 철거하고 ${e.kept}에 ★을 줬어요.` : e.type === 'demolitionIncome' ? `철거 +${won(e.amount)}` : e.type === 'gone' ? `${e.name}가 문을 닫았어요.` : '랜드마크가 다 지어졌어요.');

// 오른쪽 위 창: 걷는 드워프의 스택, 또는 지금 단계의 요약
function renderHud() {
  const s = game.state, P = ui.play, el = $('hud');
  if (P) {
    const d = P.out.dwarf, st = P.st;
    const drunkOn = st.d >= c.thresholds.drunk, fullOn = -st.h >= c.thresholds.full;
    const pos = Math.max(-6, Math.min(6, st.h));
    el.innerHTML = `<div class="hud ${P.fever ? 'fever' : ''}">
      <div class="hud-head"><b>🧔 ${d.name}</b>${d.likes.map(k => chip(k, '♥')).join('')}${chip(d.dislike, '✕')}${traitBadge(d)}
        <span class="lapno">${P.fever ? `🔥 추가 바퀴 ${P.fever}` : `바퀴 ${P.lap} / 기본 ${P.out.baseLaps}`}</span></div>
      <div class="hud-row"><span class="gauge" title="허기와 포만감은 한 눈금의 양 끝이에요">
        <i class="gl">포만감</i><span class="gtrack"><em style="left:${50 + pos * (50 / 6)}%"></em></span><i class="gr">허기</i></span>
        <b class="${st.h > 0 ? 'hungry' : st.h < 0 ? 'fullv' : ''}">${gaugeText(st.h)}</b>${fullOn ? '<span class="state full">포만 상태</span>' : ''}
        <span class="st">🍺 ${SN.tipsy} <b>${st.d}</b></span>${drunkOn ? '<span class="state drunk">만취 상태</span>' : ''}
        <span class="st">🎵 ${SN.hype} <b>${st.y}</b></span><span class="st">💤 ${SN.fatigue} <b>${st.tired}</b></span></div>
      <div class="hud-row sat"><span class="st">😊 만족도 <b class="${P.sat < 0 ? 'neg' : ''}">${P.sat}</b></span>
        <span class="st">다음 추가 바퀴의 비용 <b>${P.cost}</b></span>
        <span class="pips">${Array.from({ length: Math.min(P.cost, 12) }, (_, k) => `<i class="${k < P.sat ? 'on' : ''}"></i>`).join('')}</span></div>
      <div class="hud-row sums"><span>이 드워프의 매출 <b>${won(P.total)}</b></span><span>이번 웨이브의 매출 <b>${won(P.waveSales)}</b></span><span>추가 바퀴(성장) <b>${P.g}</b></span></div></div>`;
    return;
  }
  const sends = s.waveSends.map((x, i) => `<li>${i + 1}. ${x.name} <b>${won(x.sales)}</b>${x.tip ? ` <span class="tipv">팁 +${won(x.tip)}</span>` : ''} <small>${x.laps}바퀴</small></li>`).join('');
  if (s.phase === 'prep') {
    el.innerHTML = `<h3>정비 <small>${waveLabel()} · ${s.board.length}칸${s.newTiles.length ? ` (새 칸 ${s.newTiles.length}개)` : ''}</small></h3>
      <p>남은 건설 <b class="num">${s.buildsLeft}</b> · 업그레이드 <b class="num">${s.upgradesLeft}</b> · 이번 웨이브에 보낼 횟수 <b class="num">${plannedSends()}</b></p>
      <p>${deckLabel()}${trendLabel()}</p>
      <p class="dim">후보를 끌어다 빈 칸에 놓거나, 후보를 누른 뒤 빈 칸을 누르세요. 지은 건물을 누르면 업그레이드와 철거가 나와요. 끌면 자리를 바꿔요.</p>`;
  } else if (s.phase === 'pick') {
    el.innerHTML = `<h3>웨이브 <small>${waveLabel()} · 보내기 ${s.sendIndex + 1} / ${s.sends}</small></h3>
      <ul class="sends">${sends}</ul>
      <p>이번 웨이브의 매출 <b class="num">${won(s.waveSales)}</b> · 추가 바퀴(성장) <b class="num">${s.g}</b></p>
      <p>${deckLabel()}${trendLabel()}</p>
      <p class="dim">고르기 전에 자리 바꾸기를 할 수 있어요.</p>`;
  } else if (s.phase === 'judge') {
    const j = s.judge;
    el.innerHTML = `<h3 class="${j.passed ? 'good' : 'bad'}">${j.passed ? '목표 달성!' : '런이 끝났어요'} <small>${waveLabel()}</small></h3>
      <p>자금 <b class="num">${won(j.money)}</b> · 목표 <b class="num">${won(j.target)}</b> · ${j.passed ? `<b class="good">목표의 ${j.ratio.toFixed(1)}배</b>` : `목표에 ${won(j.target - j.money)} 모자랐어요.`}</p>
      <ul class="sends">${sends}</ul><p>이번 웨이브의 매출 <b class="num">${won(s.waveSales)}</b>${s.waveTips ? ` · 팁 <b class="num">${won(s.waveTips)}</b>` : ''}</p>
      ${j.events.length ? `<p class="good">${j.events.map(judgeEventText).join(' ')}</p>` : ''}`;
  } else el.innerHTML = `<h3>${waveLabel()}</h3>`;
}

function buildingCard(def) {
  return isShop(def.id)
    ? `<div class="kbar">${def.kinds.map(k => `<i style="background:${kindColor(k)}"></i>`).join('')}</div>
       <div class="cname">${def.name}</div><div class="ckind">${def.kinds.map(k => ICONS[k] + k).join(' + ')} · 요금 <b>${def.fee}</b></div><div class="ctext">${rich(def.text)}</div>`
    : `<div class="kbar"><i></i></div><div class="cname">${def.name}</div><div class="ckind">지원 건물</div><div class="ctext">${rich(def.text, nowText(def.id, null))}</div>`;
}

function dwarfCard(d, i, extra = '') {
  return `<div class="dwarf ${extra}" data-dwarf="${i}">
    <div class="dname">🧔 ${d.name} ${traitBadge(d)}</div>
    <div class="drow"><span class="mark like">♥</span>${d.likes.map(k => chip(k)).join('')}</div>
    <div class="drow"><span class="mark hate">✕</span>${chip(d.dislike)}</div>
    ${d.trait ? `<div class="dtrait">${rich(traitOf(d.trait).text)}</div>` : ''}`;
}

function renderTray() {
  const s = game.state, t = $('tray');
  const auto = `<label class="auto"><input type="checkbox" data-set="autoSkip" ${settings.autoSkip ? 'checked' : ''}> 계속 결과만 보기</label>`;
  if (ui.playing) {
    const P = ui.play;
    t.innerHTML = `<div class="dwarves">${P.out.hand.map((d, i) => dwarfCard(d, i, d === P.out.dwarf ? 'chosen' : 'gone') + `<div class="dfoot">${d === P.out.dwarf ? '도는 중' : ''}</div></div>`).join('')}</div>
      <div class="actions"><div class="speed">${[1, 2, 4].map(x => `<button data-act="speed" data-x="${x}" class="${ui.speed === x ? 'on' : ''}">${x}배</button>`).join('')}</div>
      <button data-act="skip">결과만 보기 ⏭</button>${auto}</div>`;
  } else if (s.phase === 'prep') {
    const cost = game.refreshCost();
    t.innerHTML = `<div class="cands">${s.candidates.map((cd, i) => cd
      ? `<div class="cand ${isShop(cd.id) ? 'shop' : 'support'} ${cd.locked ? 'locked' : ''} ${ui.sel?.type === 'cand' && ui.sel.slot === i ? 'sel' : ''}" data-cand="${i}" draggable="${s.buildsLeft > 0}">
          ${buildingCard(bld(cd.id))}<button class="lock" data-act="lock" data-slot="${i}">${cd.locked ? '🔒 해제' : '잠금'}</button></div>`
      : '<div class="cand none"></div>').join('')}</div>
      <div class="actions"><div class="builds">남은 건설 <b>${s.buildsLeft}</b></div>
      <button data-act="refresh" ${game.canRefresh() ? '' : 'disabled'}>새로고침 <b>${won(cost)}</b></button>
      <button class="primary" data-act="startWave">웨이브 시작</button></div>`;
  } else if (s.phase === 'pick') {
    t.innerHTML = `<div class="dwarves">${s.hand.map((d, i) => {
      const pv = settings.preview ? game.preview(i) : null;
      return dwarfCard(d, i, 'pickable') + `<div class="dfoot">${pv ? `<span class="pv">예상 매출 ${won(pv.sales)}${pv.tip ? ` · 팁 ${won(pv.tip)}` : ''} · ${pv.laps}바퀴</span>` : ''}<button class="primary" data-act="send" data-i="${i}">보내기</button></div></div>`;
    }).join('')}</div>
      <div class="actions"><div class="builds">보내기 <b>${s.sendIndex + 1}</b> / ${s.sends}</div>${auto}</div>`;
  } else t.innerHTML = '<div class="actions wide"></div>';
}

// ── 살펴보기 창 ──────────────────────────────────────────────
const UP_REASON = { new: '이번 정비에 지은 매장은 다음 정비부터 올릴 수 있어요.', once: '업그레이드는 정비마다 한 번이에요.', max: '여기까지 올릴 수 있어요.', money: '자금이 모자라요.' };
function tileActions(i) {
  const s = game.state, b = s.board[i];
  if (!b || s.phase !== 'prep' || ui.playing || !(ui.sel?.type === 'tile' && ui.sel.i === i)) return '';
  let up = '';
  if (isShop(b.id)) {
    const u = game.upgradeInfo(i);
    up = `<button class="primary" data-act="upgrade" data-tile="${i}" ${u.ok ? '' : 'disabled'}>업그레이드${u.cost != null ? ` <b>${won(u.cost)}</b>` : ''}</button>${u.ok ? '' : `<small class="why">${UP_REASON[u.reason] || ''}</small>`}`;
  }
  const gain = isShop(b.id) && game.has('demolitionIncome') ? ` <b>+${won(b.lastSales || 0)}</b>` : '';
  return `<div class="tacts">${up}<button data-act="demolish" data-tile="${i}">철거${gain}</button></div>`;
}

function detailTile(i) {
  const s = game.state, p = ui.info, b = s.board[i];
  if (!b) return `<h3>${i}번 칸 <small>빈 칸</small></h3><p class="dim">드워프는 그냥 지나가요.</p>`;
  const def = bld(b.id), src = p.sources[i], g = viewG(), e = game.engine;
  const nm = x => `${bld(x.id).name}<small>(${x.from}번 칸)</small>`;
  if (!isShop(b.id)) {
    const t = p.targets[i];
    return `<h3>${def.name} <small>${i}번 칸 · 지원 건물</small></h3><p>${rich(def.text, nowText(b.id, i))}</p>
      ${tileActions(i)}
      <p>닿는 칸: ${t.length ? t.map(j => `<b>${j}번${s.board[j] ? ' ' + bld(s.board[j].id).name : ' 빈 칸'}</b>`).join(', ') : '<span class="dim">지금은 없어요</span>'}</p>
      ${keywordHelp(def.text)}`;
  }
  const by = type => src.filter(x => x.type === type);
  const fees = by('fee'), mults = by('mult'), gf = by('growFee'), br = by('branch'), rm = by('restMult');
  const kinds = p.kindsAt[i];
  let h = `<h3>${def.name}${b.stars ? ` <span class="stars">${'★'.repeat(b.stars)}</span>` : ''} <small>${i}번 칸</small> ${kinds.map(k => chip(k)).join('')}</h3><p>${rich(def.text)}</p>${tileActions(i)}<table class="calc">`;
  h += `<tr><th>요금</th><td>${def.fee}${fees.map(x => ` <span class="cfee">+ ${nm(x)} ${fmtNum(x.value)}</span>`).join('')}${fees.length ? ` = <b>${fmtNum(p.fee[i])}</b>` : ''}</td></tr>`;
  const mparts = [...(b.stars ? [`<span class="stars">${'★'.repeat(b.stars)}</span> ×${p.starMult[i]}`] : []), ...mults.map(x => `${nm(x)} ×${fmtNum(x.value)}`)];
  h += `<tr><th>매출</th><td>${mparts.length ? `<span class="cmult">${mparts.join(' · ')}</span> = <b>×${fmtNum(p.mult[i])}</b>` : '<span class="dim">×1</span>'}</td></tr>`;
  if (gf.length) h += `<tr><th>성장</th><td>${gf.map(x => `${nm(x)} 요금 +${fmtNum(x.value)}`).join(' · ')} <small>(추가 바퀴마다)</small>${g > 0 ? ` → 지금 요금 <b>${fmtNum(e.feeAt(p, i, g))}</b>` : ''}</td></tr>`;
  if (rm.length) h += `<tr><th>휴식</th><td>${rm.map(x => `${nm(x)} 만족도 ×${fmtNum(x.value)}`).join(' · ')}</td></tr>`;
  h += '</table>';
  const tags = [];
  if (p.top === i) tags.push('👑 요금이 가장 높은 매장');
  for (const x of by('kinds')) tags.push(`${nm(x)}: 업종 ${x.value}도 가져요`);
  for (const x of by('giveBonus')) tags.push(`${nm(x)}: 주는 스택 +${x.value}`);
  for (const x of by('vip')) tags.push(`🎩 ${nm(x)}: 이 업종을 좋아하지 않는 드워프는 지나쳐요`);
  for (const x of by('everyNth')) tags.push(`${nm(x)}: 지금 ${nowText(x.id, x.from)}까지 셌어요`);
  for (const x of by('merger')) tags.push(`⚔ ${nm(x)}: 웨이브가 끝날 때 양옆 가운데 매출이 낮은 곳이 철거돼요`);
  for (const x of by('off')) tags.push(`${nm(x)}: 같은 업종의 매장이 또 있어 효과가 없어요`);
  if (br.length) tags.push(br.map(x => `${nm(x)}에서도 이용돼요`).join(' · '));
  if (b.lastSales != null) tags.push(`지난 웨이브의 매출 ${won(b.lastSales)}`);
  if (tags.length) h += `<p class="good">${tags.join('<br>')}</p>`;
  return h + keywordHelp(def.text);
}

// 이 드워프가 이 칸의 매장을 지나치는가(VIP 라운지)
const vipSkip = (p, i, d) => p.vip[i] && !p.kindsAt[i].some(k => game.engine.likesOf(p, d).includes(k));

function renderDetail() {
  const h = ui.hover || (ui.sel?.type === 'tile' ? { type: 'tile', i: ui.sel.i } : ui.sel?.type === 'cand' ? { type: 'cand', slot: ui.sel.slot } : null), s = game.state;
  let html;
  if (h?.type === 'tile' && h.i < s.board.length) html = detailTile(h.i);
  else if (h?.type === 'cand' && s.candidates[h.slot]) {
    const def = bld(s.candidates[h.slot].id);
    html = `<h3>${def.name} <small>후보 · ${isShop(def.id) ? `매장 · 요금 ${def.fee}` : '지원 건물'}</small> ${(def.kinds || []).map(k => chip(k)).join('')}</h3><p>${rich(def.text, nowText(def.id, null))}</p>
      ${!isShop(def.id) ? '<p class="dim">같은 지원 건물은 한 채만 지을 수 있어요.</p>' : ''}${keywordHelp(def.text)}`;
  } else if (h?.type === 'dwarf') {
    const d = (ui.play ? ui.play.out.hand : s.hand)[h.i], p = ui.info;
    if (d) {
      const marks = p.board.map((_, i) => game.engine.tasteOf(p, i, d));
      const skips = p.shopTiles.filter(i => vipSkip(p, i, d)).length;
      html = `<h3>🧔 ${d.name} ${traitBadge(d)}</h3><p>${d.likes.map(k => chip(k, '♥')).join('')} ${chip(d.dislike, '✕')}${p.likeAll && !d.likes.includes(p.likeAll) ? ` <small>거리 표지판:</small> ${chip(p.likeAll, '♥')}` : ''}</p>
        ${d.trait ? `<p>${rich(traitOf(d.trait).text)}</p>` : ''}
        <p>보드에 좋아하는 매장 <b>${marks.filter(m => m > 0).length}곳</b>, 싫어하는 매장 <b>${marks.filter(m => m < 0).length}곳</b>${skips ? `, 🎩 지나칠 매장 <b>${skips}곳</b>` : ''}</p>
        <p class="dim">좋아하는 업종의 매장을 이용하면 만족도가 1 오르고 싫어하는 업종이면 1 내려요. 기본 바퀴를 다 돈 뒤 만족도가 추가 바퀴의 비용(3, 6, 12, 24…) 이상이면 그만큼 내고 한 바퀴를 더 돌아요.</p>`;
    }
  }
  if (!html) html = '<h3>살펴보기</h3><p class="dim">건물, 후보, 드워프 카드에 마우스를 올리면 여기에 풀이가 나와요. 지원 건물은 닿는 칸이, 매장은 자기에게 걸린 지원 건물이 보드에 밝혀져요.</p>';
  $('detail').innerHTML = html;
}

// 마우스가 올라간 것에 따라 보드에 표시를 한다. 칸을 다시 그리지 않고 표시만 바꾼다(끌기가 끊기지 않게).
function applyHighlights() {
  const s = game.state, p = ui.info, h = ui.hover || (ui.sel?.type === 'tile' ? { type: 'tile', i: ui.sel.i } : null);
  const tiles = [...document.querySelectorAll('#board .tile')];
  const d = h?.type === 'dwarf' ? (ui.play ? ui.play.out.hand : s.hand)[h.i] : ui.play ? ui.play.out.dwarf : null;
  tiles.forEach((el, i) => {
    el.classList.remove('hl-target', 'hl-source', 'hl-self', 'sel', 'like', 'dislike', 'vipskip', 'droppable');
    const t = d ? game.engine.tasteOf(p, i, d) : 0, skip = d && p.shopAt[i] ? vipSkip(p, i, d) : false;
    el.querySelector('.taste').textContent = skip ? '🚫' : t > 0 ? '♥' : t < 0 ? '✕' : '';
    if (skip) el.classList.add('vipskip'); else if (t) el.classList.add(t > 0 ? 'like' : 'dislike');
    if (h?.type === 'tile' && s.board[h.i]) {
      if (h.i === i) el.classList.add('hl-self');
      if (p.targets[h.i].includes(i)) el.classList.add('hl-target');
      if (p.sources[h.i].some(x => x.from === i)) el.classList.add('hl-source');
    }
    if (ui.sel?.type === 'tile' && ui.sel.i === i) el.classList.add('sel');
    if (!ui.playing && ui.sel?.type === 'cand' && !s.board[i]) el.classList.add('droppable');
  });
}

// ── 창: 런 시작/덱, 설정, 끝 ─────────────────────────────────
function deckHTML() {
